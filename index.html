<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BWP Sales — ระบบจัดการงานขาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ฟอนต์หน้าจอโหลดทันที ส่วนฟอนต์สำหรับพิมพ์เอกสารโหลดตอนเปิดหน้าพิมพ์ครั้งแรก -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0b2a63; --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eff5ff;
  --bg:#f4f6fb; --card:#fff; --bd:#e6ebf3; --bd2:#f1f5f9;
  --tx:#16233a; --mut:#5b6b83; --mut2:#94a3b8;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--tx);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:250px;flex-shrink:0;background:var(--navy);color:#c7d7f5;display:flex;flex-direction:column;
  padding:20px 0 16px;position:sticky;top:0;height:100vh;overflow:auto;z-index:60}
.brand{display:flex;align-items:center;gap:11px;padding:0 18px 20px}
.mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(150deg,#4f9cf9,#123f9e);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;overflow:hidden;flex-shrink:0;cursor:pointer}
.mark img{width:100%;height:100%;object-fit:cover}
.navlabel{font-size:11px;color:#6d94d8;letter-spacing:.06em;padding:14px 20px 6px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:3px;padding:0 10px}
.nv{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:10px;font-size:15px;
  color:#c3d5f2;background:none;border:0;cursor:pointer;text-align:left;width:100%;min-height:46px}
.nv:hover{background:rgba(255,255,255,.09);color:#fff}
.nv.on{background:var(--blue);color:#fff;font-weight:600}
.nv .cnt{margin-left:auto;font-size:12px;background:rgba(255,255,255,.16);padding:2px 8px;border-radius:99px}
.nv.on .cnt{background:rgba(255,255,255,.25)}
.sub{display:flex;flex-direction:column;gap:2px;margin:4px 0 6px 24px;padding-left:12px;border-left:2px solid rgba(255,255,255,.15)}
.sv{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;font-size:14px;color:#a9c2e8;
  background:none;border:0;cursor:pointer;text-align:left;width:100%;min-height:40px}
.sv:hover{background:rgba(255,255,255,.08);color:#fff}
.sv.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.sv .cnt{margin-left:auto;font-size:11.5px;color:#8fb0e2}
.sv.on .cnt{color:#dbe9ff}
.backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:55}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{min-height:66px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;
  justify-content:space-between;padding:10px 22px;position:sticky;top:0;z-index:40;gap:14px;flex-wrap:wrap}
.ttl{display:flex;align-items:center;gap:12px;min-width:0}
.ttl h1{font-size:19px;font-weight:700;margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut2)}
.body{flex:1;padding:20px 22px 60px;display:flex;flex-direction:column;gap:16px;max-width:1500px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 1px 2px rgba(15,42,90,.04)}
.pad{padding:18px 20px}
.h3{font-size:16px;font-weight:600;margin:0 0 14px}
.mut{color:var(--mut);font-size:13.5px}
.tiny{font-size:12.5px;color:var(--mut2)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media(max-width:700px){.g4,.g3,.g2{grid-template-columns:1fr}}

.pill{font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;display:inline-block;white-space:nowrap}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.s{width:17px;height:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;
  font-size:14.5px;font-weight:600;padding:0 18px;height:44px;border-radius:10px;border:1px solid var(--blue);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn:active{transform:translateY(1px)}
.btn.gh{background:#fff;color:#33445f;border-color:#d3ddec}
.btn.gh:hover{background:#f6f9ff;border-color:#a9c4f0;color:var(--blue-d)}
.btn.dg{background:#fff;color:#b91c1c;border-color:#fbcaca}
.btn.dg:hover{background:#fef2f2}
.btn.sm{height:36px;padding:0 13px;font-size:13.5px}
.btn.blk{width:100%}

.searchwrap{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #d3ddec;border-radius:10px;
  padding:0 13px;height:44px;flex:1;min-width:200px;max-width:440px;color:var(--mut2)}
.searchwrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.searchwrap input{border:0;background:none;outline:0;width:100%;color:var(--tx);height:100%}
.searchwrap .kbd{font-size:11px;border:1px solid #e2e8f0;border-radius:5px;padding:1px 6px;color:#a9b6c9}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13.5px;padding:8px 15px;border-radius:999px;color:#41546f;background:#fff;border:1px solid #dde5f0;cursor:pointer;min-height:38px}
.chip:hover{border-color:#a9c4f0;color:var(--blue-d)}
.chip.on{background:var(--blue-d);color:#fff;font-weight:600;border-color:var(--blue-d)}
.chip.clear{background:#fff5f5;color:#b91c1c;border-color:#fbcaca}

/* ---------- list rows (แทนตารางที่ล้นจอ) ---------- */
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--bd2);cursor:pointer;background:#fff}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:#f6f9ff}
.lrow.sel{background:var(--blue-l);box-shadow:inset 3px 0 0 var(--blue)}
.lav{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden;background:#e8f0fe;color:var(--blue-d)}
.lav img{width:100%;height:100%;object-fit:cover}
.lmain{flex:1;min-width:0}
.lt{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.lright{display:flex;align-items:center;gap:14px;flex-shrink:0}
.lamt{font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
.lchev{color:#c3ccdb}
@media(max-width:640px){.lright{flex-direction:column;align-items:flex-end;gap:5px}.lchev{display:none}}

.empty{padding:56px 24px;text-align:center;color:var(--mut2)}
.empty .big{font-size:16px;color:var(--mut);margin-bottom:6px;font-weight:600}
.hint{color:#51678a;background:#f0f5ff;border:1px solid #dbe7fb;border-radius:10px;padding:10px 14px;font-size:13.5px;display:flex;gap:9px;align-items:center}

/* ---------- drawer ---------- */
.dr{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:94vw;background:#fff;z-index:90;
  box-shadow:-16px 0 44px rgba(15,42,90,.16);display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.dr header{padding:18px 20px;border-bottom:1px solid var(--bd2);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dr .db{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.dr footer{padding:14px 20px;border-top:1px solid var(--bd2);display:flex;gap:10px}
.drow{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--bd2);font-size:14px}
.drow:last-child{border-bottom:0}
.drow span{color:var(--mut);flex-shrink:0}
.drow b{text-align:right;font-weight:600;word-break:break-word}

/* ---------- forms ---------- */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:#fff;border-radius:16px;width:100%;max-width:680px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 26px 64px rgba(15,42,90,.3)}
.modal header{padding:20px 24px 16px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;justify-content:space-between}
.modal header b{font-size:18px}
.modal .mb{padding:20px 24px;overflow:auto}
.modal footer{padding:16px 24px;border-top:1px solid var(--bd2);display:flex;justify-content:flex-end;gap:10px;background:#fbfcfe}
.close{background:none;border:0;font-size:22px;color:var(--mut2);cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
.close:hover{background:#f1f5f9;color:var(--tx)}
.fgroup{font-size:14px;font-weight:700;color:var(--tx);grid-column:1/-1;margin-top:10px;padding-top:14px;
  border-top:1px solid var(--bd2);display:flex;align-items:center;gap:9px}
.fgroup:first-child{margin-top:0;padding-top:0;border-top:0}
.fgroup .n{width:23px;height:23px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.fgroup .sub{font-weight:400;font-size:12.5px;color:var(--mut2)}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13.5px;color:#41546f;font-weight:500}
.field label .rq{color:#dc2626}
.field input,.field select,.field textarea{border:1px solid #d3ddec;border-radius:10px;padding:0 13px;height:46px;outline:0;background:#fff;width:100%}
.field textarea{height:auto;padding:12px 13px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.field .fh{font-size:12px;color:var(--mut2)}
.optrow{display:flex;flex-wrap:wrap;gap:9px}
.opt{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #d3ddec;border-radius:10px;
  padding:0 14px;height:44px;cursor:pointer;font-size:14.5px;color:#33445f}
.opt:hover{border-color:#a9c4f0}
.opt.on{border-color:var(--blue);background:#eff5ff;color:var(--blue-d);font-weight:600}
.opt .bx{width:20px;height:20px;border:1.5px solid #c3cfe0;border-radius:5px;display:inline-flex;
  align-items:center;justify-content:center;font-size:13px;background:#fff;color:var(--blue-d);flex-shrink:0}
.opt.on .bx{border-color:var(--blue);background:var(--blue);color:#fff}
.ppl{display:flex;flex-direction:column;gap:9px}
.pplrow{display:grid;grid-template-columns:210px minmax(0,1fr);gap:10px;align-items:center}
.pplrow>span{font-size:13.5px;color:#41546f}
.pplrow input{height:44px;padding:0 12px;border:1px solid #d3ddec;border-radius:10px;outline:0;width:100%}
.pplrow input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
@media(max-width:780px){.pplrow{grid-template-columns:1fr;gap:5px}}
/* ---- การ์ดกรอกรายการสินค้าในฟอร์ม ---- */
.itbl{display:flex;flex-direction:column;gap:12px}
.itrow{border:1px solid var(--bd);border-radius:12px;padding:14px 16px 16px;background:#fbfcfe;position:relative;display:flex;flex-direction:column;gap:12px}
.itrow .ittop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.itrow .itno{font-size:12.5px;font-weight:700;color:var(--blue-d);background:#e7f0ff;border-radius:999px;padding:3px 12px}
.itl1{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px}
.itl2{display:grid;grid-template-columns:110px 130px 150px minmax(0,1fr);gap:12px;align-items:end}
.itf{display:flex;flex-direction:column;gap:6px;min-width:0}
.itf>span{font-size:12.5px;color:#41546f;font-weight:500}
.itrow input,.itrow select,.itrow textarea{height:44px;padding:0 12px;border:1px solid #d3ddec;border-radius:10px;
  width:100%;outline:0;background:#fff;font-size:14.5px}
.itrow textarea{height:auto;padding:11px 12px;resize:vertical;line-height:1.5;min-height:66px}
.itrow input:focus,.itrow select:focus,.itrow textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.itrow .itamtbox{height:44px;display:flex;align-items:center;justify-content:flex-end;padding:0 13px;
  background:#eef4ff;border:1px solid #d7e4fb;border-radius:10px;font-weight:700;font-size:16px;color:var(--blue-d)}
.itrow .itdel{height:34px;padding:0 12px;border:1px solid #fbcaca;background:#fff;color:#b91c1c;border-radius:9px;
  cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.itrow .itdel:hover{background:#fef2f2}
.itsum{display:flex;flex-direction:column;gap:9px;align-items:flex-end;border-top:2px solid var(--bd2);padding-top:14px;font-size:14.5px}
.itsum .rw{display:flex;gap:34px;align-items:baseline}
.itsum .rw b{width:150px;text-align:right}
@media(max-width:820px){
  .itl1,.itl2{grid-template-columns:1fr;gap:11px}
  .itl2{grid-template-columns:1fr 1fr}
  .itl2 .itamtwrap{grid-column:1/-1}
}

/* ---------- upload ---------- */
.drop{border:2px dashed #bfd3f5;background:#f6f9ff;border-radius:12px;padding:26px 16px;display:flex;
  flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer}
.drop:hover,.drop.hot{background:#e8f1ff;border-color:var(--blue)}
.thumbs{display:flex;gap:12px;flex-wrap:wrap}
.thumb{width:124px;border:1px solid #e2e8f0;border-radius:11px;overflow:hidden;position:relative;background:#f8fafc}
.thumb img{width:100%;height:90px;object-fit:cover;display:block;cursor:zoom-in}
.thumb .nm{font-size:11px;color:var(--mut);padding:6px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(15,23,42,.72);color:#fff;
  font-size:13px;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;line-height:1}
.x:hover{background:#ef4444}
.filerow{display:flex;align-items:center;gap:12px;border:1px solid #eaf0f8;border-radius:11px;padding:12px 14px}
.ftag{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0}
.lightbox{position:fixed;inset:0;background:rgba(15,23,42,.88);display:flex;align-items:center;justify-content:center;z-index:200;padding:34px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);background:#101b2e;color:#fff;
  font-size:14px;padding:13px 18px;border-radius:11px;z-index:300;opacity:0;transition:opacity .2s,transform .2s;
  display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px rgba(15,42,90,.3)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast button{background:none;border:0;color:#8ec0ff;font-weight:700;cursor:pointer;padding:0}

/* ---------- misc ---------- */
.tl{display:flex;gap:13px}
.tl .dot{display:flex;flex-direction:column;align-items:center}
.tl .dot i{width:12px;height:12px;border-radius:50%;background:var(--blue-d);margin-top:5px;flex-shrink:0}
.tl .dot s{width:2px;flex:1;background:#dbeafe}
.tl.pend .dot i{background:#fff;border:2px solid #cbd5e1}
.fl{display:flex;flex-direction:column;gap:4px}
.fl>span{font-size:12.5px;color:var(--mut2)}
.fl>b{font-size:14.5px;font-weight:600}
.burger{display:none;background:none;border:0;cursor:pointer;color:var(--mut);padding:6px}
@media(max-width:1023px){
  .side{position:fixed;left:-260px;transition:left .2s}
  .side.open{left:0}
  .backdrop.on{display:block}
  .burger{display:inline-flex}
  .body{padding:16px 14px 60px}
  .top{padding:10px 14px}
}
/* ---------- แบบฟอร์มพิมพ์ใบเสนอราคา (A4) ---------- */
.prevov{position:fixed;inset:0;background:#59647a;z-index:150;overflow:auto;padding:24px}
.prevbar{position:sticky;top:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;z-index:2}
.sheet{width:210mm;min-height:297mm;background:#fff;margin:0 auto;padding:12mm 12mm 10mm;
  font-family:'Sarabun','IBM Plex Sans Thai',sans-serif;color:#000;font-size:12px;line-height:1.5;
  box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;position:relative}
.sheet .sh-top{display:flex;align-items:flex-start;gap:10px}
.sheet .sh-logo{width:30mm;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sheet .sh-logo img{max-width:100%;max-height:26mm}
.sheet .sh-mid{flex:1;text-align:center}
.sheet .sh-cert{width:26mm;flex-shrink:0;display:flex;align-items:flex-start;justify-content:flex-end}
.sheet .sh-cert img{max-width:100%;max-height:18mm}
.sheet .co-th{font-family:'Noto Serif Thai',serif;font-size:19px;font-weight:700;line-height:1.3}
.sheet .co-en{font-family:'Times New Roman',serif;font-size:15.5px;font-weight:700;letter-spacing:.3px}
.sheet .co-ad{font-size:12.5px;margin-top:3px}
.sheet .sh-title{font-family:'Noto Serif Thai',serif;font-size:16px;font-weight:700;text-align:center;margin:9px 0 8px}
.sheet .sh-info{display:flex;gap:14px;font-size:12px}
.sheet .sh-info .col{flex:1}
.sheet .kv{display:flex;gap:6px;margin-bottom:1px}
.sheet .kv .k{width:22mm;flex-shrink:0}
.sheet .kv .k.r{width:32mm}
.sheet .lead{margin:9px 0 7px;text-indent:12mm}
.sheet .itemswrap{flex:1;position:relative;min-height:34mm}
.sheet table.items{position:absolute;inset:0;width:100%;height:100%;border-collapse:collapse;table-layout:fixed}
.sheet table.items th{border:1px solid #000;padding:4px 6px;font-size:12px}
/* ช่องรายการสินค้าเป็นกล่องเปิด ไม่มีเส้นคั่นระหว่างแถว เหลือเส้นเดียวเหนือแถวสรุป */
.sheet table.items td{border-left:1px solid #000;border-right:1px solid #000;
  border-top:0;border-bottom:0;padding:4px 6px;vertical-align:top;font-size:12px}
.sheet table.items th{text-align:center;font-weight:400;height:9mm;vertical-align:middle}
.sheet table.items td.no{text-align:center;width:11mm}
.sheet table.items td.dt{font-family:'Courier New',monospace;font-size:11.5px;white-space:pre-line}
.sheet table.items td.qt{text-align:right;width:26mm}
.sheet table.items td.pr{text-align:right;width:24mm}
.sheet table.items td.am{text-align:right;width:26mm}
.sheet table.items tr.fill td{border-top:0;border-bottom:0;height:auto}
.sheet table.items tr.sum td{height:auto;padding:4px 8px;font-size:12px;vertical-align:middle;
  border-top:1px solid #000;border-bottom:1px solid #000}
.sheet table.items tr.sum .nt{text-align:left}
.sheet table.items tr.sum .lb{text-align:right;font-weight:600}
.sheet table.items tr.sum .am{text-align:right}
.sheet table.items tr.tot .lb,.sheet table.items tr.tot .am{font-weight:700}
.sheet table.items tr.last td{height:auto}

/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* กรอง src ของรูปก่อนใส่ลง HTML — กันสคริปต์แฝงมากับข้อมูลจากลิงก์เซ็น/ฐานข้อมูล
   อนุญาตเฉพาะ data:image ที่เป็น base64 ล้วน กับชื่อไฟล์รูปในเครื่องเท่านั้น */
function imgSrc(s){
  if(typeof s!=='string')return '';
  const v=s.trim();
  if(/^data:image\/(png|jpeg|jpg|gif|webp|svg\+xml);base64,[A-Za-z0-9+/=]+$/.test(v))return v;
  if(/^[\w.\-]+\.(png|jpe?g|gif|webp|svg)$/i.test(v))return v;
  return '';
}
const uid=()=>Math.random().toString(36).slice(2,10);
const num=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const num0=n=>Number(n||0).toLocaleString('th-TH');
const today=()=>new Date().toISOString().slice(0,10);
function fmtDate(iso){const d=new Date(iso);if(!iso||isNaN(d))return '-';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+(d.getFullYear()+543);}
function ago(iso){const d=new Date(iso);if(isNaN(d))return '';const day=Math.floor((Date.now()-d)/86400000);
  return day<=0?'วันนี้':day===1?'เมื่อวาน':day<30?day+' วันก่อน':fmtDate(iso);}
const initials=s=>String(s||'?').replace(/^(บริษัท|ห้างหุ้นส่วนจำกัด|หจก\.|คุณ)\s*/,'').trim().slice(0,2);

  doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
  cart:'<circle cx="9.5" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2 3h3l2.4 11.2a1.8 1.8 0 0 0 1.8 1.4h8.4a1.8 1.8 0 0 0 1.8-1.4L21.5 7H6"/>',

  trash:'<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>',
  print:'<path d="M6 9V3h12v6"/><rect x="6" y="14" width="12" height="7"/><path d="M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.1"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>'
};
const svg=(k,cls='ic')=>`<svg class="${cls}" viewBox="0 0 24 24">${ICON[k]}</svg>`;

/* ================= status ================= */
const CUST_ST={'ใหม่':['#dbeafe','#1d4ed8'],'กำลังติดต่อ':['#cffafe','#0e7490'],'ส่งใบเสนอราคา':['#fef3c7','#b45309'],'รอ PO':['#ede9fe','#6d28d9'],'ปิดการขาย':['#dcfce7','#15803d'],'ยกเลิก':['#fee2e2','#b91c1c']};
const DOC_ST={'ร่าง':['#f1f5f9','#64748b'],'รออนุมัติ':['#fef3c7','#b45309'],'ส่งแล้ว':['#dbeafe','#1d4ed8'],'อนุมัติแล้ว':['#dcfce7','#15803d'],'ยกเลิก':['#fee2e2','#b91c1c']};

const RC_ST={'รอชำระ':['#fef3c7','#b45309'],'บางส่วน':['#e0e7ff','#4338ca'],'ชำระแล้ว':['#dcfce7','#15803d'],'ยกเลิก':['#fee2e2','#b91c1c']};

const docTypeName=t=>(DOC_TYPES.find(x=>x[0]===t)||[,'-'])[1];
const MN=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

/* ================= storage ================= */
const KEY='bwp_sales_v1';
let DB=null;
let booted=false;
/* ---------- ซิงก์ข้อมูลขึ้นคลาวด์ (สำรองในเครื่องด้วย) ---------- */
let syncState='idle';      /* idle | saving | saved | offline | readonly */
let syncTimer=null,syncPending=false;
const localKey=()=>KEY+(AUTH.user?'_'+AUTH.user.id:'');
function setSync(s){syncState=s;const e=document.getElementById('syncDot');if(e)paintSync(e);}
function paintSync(e){
  const m={idle:['','',''],saving:['#f59e0b','กำลังบันทึก…','⟳'],saved:['#16a34a','บันทึกแล้ว','✓'],
    offline:['#dc2626','ยังไม่ได้บันทึกขึ้นคลาวด์','!'],readonly:['#6366f1','โหมดดูอย่างเดียว','👁']}[syncState]||['','',''];
  e.innerHTML=m[1]?`<span style="width:8px;height:8px;border-radius:50%;background:${m[0]};display:inline-block"></span>
    <span style="font-size:12px;color:var(--mut)">${esc(m[1])}</span>`:'';
}
function save(){
  try{localStorage.setItem(localKey(),JSON.stringify(DB));}
  catch(e){if(booted)toast('พื้นที่ในเครื่องเต็ม — ข้อมูลยังบันทึกขึ้นคลาวด์ตามปกติ');}
  if(!booted)return;
  if(readOnly()){setSync('readonly');return;}
  if(!authed())return;
  syncPending=true;setSync('saving');
  clearTimeout(syncTimer);syncTimer=setTimeout(cloudSave,1500);
}
async function cloudSave(){
  if(!authed()||readOnly())return;
  syncPending=false;
  try{
    const body=JSON.stringify({user_id:AUTH.user.id,data:DB,updated_at:new Date().toISOString()});
    if(body.length>4.5*1024*1024)toast('ข้อมูลใหญ่เกิน 4.5 MB แล้ว — ควรลบรูปเก่าที่ไม่ใช้ออก');
    await sbFetch('user_data?on_conflict=user_id',{method:'POST',
      headers:Object.assign(sbHeaders(),{Prefer:'resolution=merge-duplicates,return=minimal'}),body});
    setSync('saved');setTimeout(()=>{if(syncState==='saved'&&!syncPending)setSync('idle');},2500);
  }catch(e){setSync('offline');}
}
async function cloudLoad(userId){
  const rows=await sbGet('user_data?select=data,updated_at&user_id=eq.'+userId);
  return rows&&rows[0]?rows[0].data:null;
}
function load(){try{const r=localStorage.getItem(localKey())||localStorage.getItem(KEY);
  if(r)return JSON.parse(r);}catch(e){}return null;}

    logo:null,photos:[],files:[],

let undoFn=null;
function toast(msg,undo){
  const t=$('#toast');
  t.innerHTML=`<span>${esc(msg)}</span>`;
  if(undo){const b=el('<button>เลิกทำ</button>');b.onclick=()=>{undo();t.classList.remove('on');};t.append(b);}
  t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),undo?6000:2600);
}
function askConfirm(title,msg,okLabel,fn){
  const ov=el('<div class="ov"></div>');
  const m=el(`<div class="modal" style="max-width:430px"><header><b>${esc(title)}</b></header>
    <div class="mb" style="font-size:14.5px;color:#41546f">${esc(msg)}</div>
    <footer><button class="btn gh" id="c">ยกเลิก</button><button class="btn dg" id="o" style="background:#dc2626;color:#fff;border-color:#dc2626">${esc(okLabel)}</button></footer></div>`);
  const close=()=>ov.remove();
  m.querySelector('#c').onclick=close;
  m.querySelector('#o').onclick=()=>{close();fn();};
  ov.onclick=e=>{if(e.target===ov)close();};
  ov.append(m);$('#layer').append(ov);m.querySelector('#o').focus();
}

/* ================= files ================= */
function pickFiles(accept,multiple,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multiple;i.onchange=()=>cb([...i.files]);i.click();}
function readImage(file){
  return new Promise(res=>{const fr=new FileReader();
    fr.onload=()=>{const img=new Image();
      img.onload=()=>{const max=1000;let{width:w,height:h}=img;
        if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
        const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        res({name:file.name,type:'image',size:file.size,data:c.toDataURL('image/jpeg',.82),date:today()});};
      img.onerror=()=>res(null);img.src=fr.result;};
    fr.readAsDataURL(file);});
}
function readAny(file){
  if(file.type.startsWith('image/'))return readImage(file);
  return new Promise(res=>{
    if(file.size>3*1024*1024){toast('ไฟล์ใหญ่เกิน 3 MB — เก็บเฉพาะชื่อไฟล์');res({name:file.name,type:'file',size:file.size,data:null,date:today()});return;}
    const fr=new FileReader();fr.onload=()=>res({name:file.name,type:'file',size:file.size,data:fr.result,date:today()});fr.readAsDataURL(file);});
}
async function addUploads(files,imgArr,fileArr){
  let n=0;
  for(const f of files){
    const r=await readAny(f);if(!r)continue;
    (r.type==='image'?imgArr:fileArr).push(Object.assign({id:uid()},r));n++;
  }
  save();render();if(n)toast('อัปโหลด '+n+' ไฟล์เรียบร้อย');
}
function dropZone(hint,onFiles){
  const z=el(`<div class="drop">
    <svg viewBox="0 0 24 24" style="width:34px;height:34px;stroke:#2563eb;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">${ICON.up}</svg>
    <div style="font-size:15px;font-weight:600">ลากไฟล์มาวาง หรือ <span style="color:#2563eb">คลิกเพื่อเลือกไฟล์</span></div>
    <div class="tiny">${esc(hint)}</div></div>`);
  z.onclick=()=>pickFiles('image/*,.pdf,.doc,.docx,.xls,.xlsx',true,onFiles);
  z.ondragover=e=>{e.preventDefault();z.classList.add('hot');};
  z.ondragleave=()=>z.classList.remove('hot');
  z.ondrop=e=>{e.preventDefault();z.classList.remove('hot');onFiles([...e.dataTransfer.files]);};
  return z;
}

/* ---------- แบบพิมพ์ใบกำกับภาษี/ใบส่งของ/ใบแจ้งหนี้ ---------- */
function bahtText(n){
  n=Math.round((+n||0)*100)/100;
  const U=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const conv=s=>{let r='';const L=s.length;
    for(let i=0;i<L;i++){const dg=+s[i],pos=L-i-1;
      if(!dg)continue;
      if(pos===0&&dg===1&&L>1)r+='เอ็ด';
      else if(pos===1&&dg===2)r+='ยี่';
      else if(pos===1&&dg===1)r+='';
      else r+=U[dg];
      r+=P[pos];}
    return r;};
  const whole=s=>{let t='',x=s.replace(/^0+/,'')||'0';
    if(x==='0')return 'ศูนย์';
    while(x.length>6){t+=conv(x.slice(0,x.length-6))+'ล้าน';x=x.slice(-6);}
    return t+conv(x);};
  const [i,f]=n.toFixed(2).split('.');
  return whole(i)+'บาท'+(+f===0?'ถ้วน':whole(f)+'สตางค์');
}

    if(/already registered|already exists/i.test(m))throw new Error('ชื่อผู้ใช้นี้มีคนใช้แล้ว กรุณาใช้ชื่ออื่นหรือเข้าสู่ระบบ');
    if(/signups? not allowed|disabled/i.test(m))throw new Error('ระบบปิดการสมัครเอง — ติดต่อผู้ดูแลให้สร้างบัญชีให้');
    if(/rate limit/i.test(m))throw new Error('ระบบยังเปิด "Confirm email" อยู่ จึงพยายามส่งอีเมลจนเต็มโควตา — ให้ผู้ดูแลปิดใน Supabase → Authentication → Providers → Email');
    if(/invalid.*email|email.*invalid/i.test(m))throw new Error('ชื่อผู้ใช้ใช้ได้เฉพาะ a-z 0-9 . _ - (3 ตัวขึ้นไป)');
    if(/password/i.test(m)&&/least|short/i.test(m))throw new Error('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร');
    throw new Error(m);
  }
  return j;
}
async function signIn(user,password){
  const j=await sbAuthCall('token?grant_type=password',{email:toEmail(user),password});
  AUTH.token=j.access_token;AUTH.refresh=j.refresh_token;AUTH.user=j.user;saveSession();
}
async function signUp(user,password,name){

  if(j.access_token){AUTH.token=j.access_token;AUTH.refresh=j.refresh_token;AUTH.user=j.user;saveSession();return true;}

    AUTH.token=j.access_token;AUTH.refresh=j.refresh_token;AUTH.user=j.user||AUTH.user;saveSession();return true;}
  catch(e){clearSession();return false;}
}

/* ---------- REST helper ---------- */
async function sbFetch(path,opt,retry){
  const c=sbCfg();
  const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/'+path,
    Object.assign({headers:sbHeaders()},opt||{}));
  if(r.status===401&&!retry&&AUTH.refresh){
    if(await refreshSession())return sbFetch(path,opt,true);
  }
  const txt=await r.text();
  if(!r.ok){let m=txt;try{m=JSON.parse(txt).message||txt;}catch(e){}throw new Error(m);}
  return txt?JSON.parse(txt):null;
}
const sbGet=p=>sbFetch(p,{method:'GET'});

async function sbRpc(fn,args){
  const c=sbCfg();
  const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:sbHeaders(),body:JSON.stringify(args||{})});
  const txt=await r.text();
  if(!r.ok){
    let msg=txt;try{msg=JSON.parse(txt).message||txt;}catch(e){}
    if(/could not find the function|schema cache|does not exist/i.test(msg))
      throw new Error('ยังไม่ได้ติดตั้งส่วนนี้ในฐานข้อมูล — เปิด Supabase แล้วรัน '
        +(/doc_signature/.test(fn)?'supabase-setup-2.sql':'supabase-setup.sql')+' ก่อน');
    throw new Error(msg||('เชื่อมต่อไม่สำเร็จ ('+r.status+')'));
  }
  return txt?JSON.parse(txt):null;
}

/* ================= ลายเซ็นบนหน้าจอ + สายอนุมัติ ================= */
function b64e(obj){return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(obj))));}
function b64d(s){return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));}

/* แผ่นเซ็น — ใช้ได้ทั้งเมาส์ ปากกา (stylus/Apple Pencil) และนิ้ว */
function signaturePad(){
  const wrap=el(`<div>
    <div style="position:relative;border:2px dashed #bfd3f5;border-radius:12px;background:#fff;overflow:hidden">
      <canvas style="width:100%;height:210px;display:block;touch-action:none;cursor:crosshair"></canvas>
      <div class="phz" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a9b6c9;font-size:15px;pointer-events:none">เซ็นชื่อตรงนี้ — ใช้เมาส์ ปากกา หรือนิ้วได้</div>
      <div style="position:absolute;left:12%;right:12%;bottom:46px;border-bottom:1px solid #dbe3ef;pointer-events:none"></div>
    </div></div>`);
  const cv=wrap.querySelector('canvas'),ph=wrap.querySelector('.phz'),ctx=cv.getContext('2d');
  let drawing=false,dirty=false,last=null;
  function fit(){
    const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    const img=dirty?ctx.getImageData(0,0,cv.width,cv.height):null;
    cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b2a63';
    if(img)ctx.putImageData(img,0,0);
  }
  setTimeout(fit,30);
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
    drawing=true;dirty=true;ph.style.display='none';last=pos(e);
    ctx.lineWidth=e.pointerType==='pen'?Math.max(1.2,(e.pressure||.5)*3.4):2.2;
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y);ctx.stroke();});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();
    const p=pos(e);
    ctx.lineWidth=e.pointerType==='pen'?Math.max(1.2,(e.pressure||.5)*3.4):2.2;
    ctx.beginPath();ctx.moveTo(last.x,last.y);
    ctx.quadraticCurveTo(last.x,last.y,(last.x+p.x)/2,(last.y+p.y)/2);
    ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  const stop=e=>{if(drawing){drawing=false;try{cv.releasePointerCapture(e.pointerId);}catch(_){}}};
  cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);cv.addEventListener('pointerleave',stop);
  return {
    el:wrap,
    isEmpty:()=>!dirty,
    clear(){ctx.clearRect(0,0,cv.width,cv.height);dirty=false;ph.style.display='flex';},
    /* ตัดขอบขาวออกแล้วย่อ เพื่อให้ไฟล์เล็ก */
    data(){
      if(!dirty)return null;
      const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data;
      let x0=w,y0=h,x1=0,y1=0;
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>12){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
      if(x1<x0)return null;
      const pad=8;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
      const sw=x1-x0+1,sh=y1-y0+1,max=560,sc=Math.min(1,max/sw);
      const o=document.createElement('canvas');o.width=Math.round(sw*sc);o.height=Math.round(sh*sc);
      o.getContext('2d').drawImage(cv,x0,y0,sw,sh,0,0,o.width,o.height);
      return o.toDataURL('image/png');
    }};
}

function applyCreditSigs(no,sigs,status,silent,type){
  const d=(type==='receipt'?DB.receipts:DB.docs).find(x=>x.no===no&&(type==='receipt'||x.type===(type||'credit')));
  if(!d)return false;
  ensureByType(Object.assign(d,{type:d.type||type}));d.sigs=sigs||{};
  const isRc=d.type==='receipt'||DB.receipts.includes(d);
  if(status==='complete')d.status=isRc?d.status:'อนุมัติแล้ว';
  else if(status==='rejected')d.status='ยกเลิก';
  else if(Object.keys(d.sigs).length&&!isRc)d.status='รออนุมัติ';
  save();if(!silent)render();
  return true;
}
async function checkCredit(d,silent){
  if(!d.sigDocId||!sbOn())return null;
  const n=rolesOf(d.type).length;
  try{
    const rows=await sbRpc('get_doc_signature',{p_id:d.sigDocId});
    const row=Array.isArray(rows)?rows[0]:rows;
    if(!row){if(!silent)toast('ไม่พบเอกสารนี้ในฐานข้อมูล');return null;}
    const before=Object.keys(d.sigs||{}).length;
    applyCreditSigs(d.no,row.sigs,row.status,true,d.type);
    const after=Object.keys(d.sigs||{}).length;
    render();
    if(!silent||after>before)toast(row.status==='complete'?'เซ็นครบ '+n+' ลายเซ็นแล้ว ✓'
      :row.status==='rejected'?'มีผู้ไม่อนุมัติเอกสารนี้':after>before?'ได้รับลายเซ็นเพิ่ม ('+after+'/'+n+')':'ยังรอลายเซ็นอยู่ ('+after+'/'+n+')');
    return row.status;
  }catch(e){if(!silent)toast(e.message);return null;}
}

async function checkApproval(d,silent){
  if(!d.approvalId||!sbOn())return null;
  try{
    const rows=await sbRpc('get_quote_approval',{p_id:d.approvalId});
    const row=Array.isArray(rows)?rows[0]:rows;
    if(!row){if(!silent)toast('ไม่พบคำขออนุมัตินี้ในฐานข้อมูล');return null;}
    if(row.status==='pending'){if(!silent)toast('ยังรอผู้บริหารเซ็นอยู่');return 'pending';}
    if(d.sigApprover&&row.status==='approved')return row.status;
    applySignature({no:d.no,ok:row.status==='approved',name:row.approver_name,
      date:(row.decided_at||'').slice(0,10)||today(),img:row.approver_sig},true);
    render();
    toast(row.status==='approved'?'ผู้บริหารเซ็นอนุมัติแล้ว ✓':'ผู้บริหารไม่อนุมัติเอกสารนี้');
    return row.status;
  }catch(e){if(!silent)toast(e.message);return null;}
}
let pollTimer=null;
function startPolling(d){
  clearInterval(pollTimer);
  if(!d.approvalId||d.sigApprover||!sbOn())return;
  pollTimer=setInterval(async()=>{
    if(S.page!=='documents'||S.docOpen!==d.id){clearInterval(pollTimer);return;}
    const st=await checkApproval(d,true);
    if(st&&st!=='pending')clearInterval(pollTimer);
  },15000);
}

async function handleHash(){
  const h=location.hash||'';
  const ms=h.match(/^#s=([0-9a-fA-F-]{36})&r=([a-zA-Z]+)$/);
  const mo=h.match(/^#a=([0-9a-fA-F-]{36})$/);
  const m1=h.match(/^#approve=(.+)$/),m2=h.match(/^#signed=(.+)$/);
  if(!ms&&!mo&&!m1&&!m2)return false;
  history.replaceState(null,'',baseUrl());
  if(ms){
    const [,id,role]=ms;
    if(!Object.values(SIGN_ROLES).some(rs=>rs.some(r=>r[0]===role))){toast('ลิงก์ไม่ถูกต้อง');return false;}
    toast('กำลังโหลดเอกสาร…');
    try{
      const rows=await sbRpc('get_doc_signature',{p_id:id});
      const row=Array.isArray(rows)?rows[0]:rows;
      if(!row){toast('ไม่พบเอกสารนี้ หรือลิงก์หมดอายุแล้ว');return false;}
      if(row.status==='rejected'){toast('เอกสารนี้ถูกปฏิเสธไปแล้ว');return false;}
      creditSignView(row,id,role);return true;
    }catch(e){toast(e.message);return false;}
  }
  if(mo){
    const id=mo[1];
    toast('กำลังโหลดเอกสาร…');
    try{
      const rows=await sbRpc('get_quote_approval',{p_id:id});
      const row=Array.isArray(rows)?rows[0]:rows;
      if(!row){toast('ไม่พบเอกสารนี้ หรือลิงก์หมดอายุแล้ว');return false;}
      if(row.status!=='pending'){
        toast(row.status==='approved'?'เอกสารนี้อนุมัติไปแล้ว':'เอกสารนี้ถูกปฏิเสธไปแล้ว');return false;}
      approveView(row.payload,id);return true;
    }catch(e){toast(e.message);return false;}
  }
  try{
    const p=b64d(decodeURIComponent((m1||m2)[1]));
    if(m1){approveView(p);return true;}
    applySignature(p);
  }catch(e){toast('ลิงก์ไม่ถูกต้องหรือข้อมูลเสียหาย');}
  return false;
}

  const ff=m.querySelector('#ff');
  const custom={};let gi=0;
  fields.forEach(f=>{
    if(f.group){gi++;
      ff.append(el(`<div class="fgroup"><span class="n">${gi}</span><span>${esc(f.group)}</span>
        ${f.sub?`<span class="sub">${esc(f.sub)}</span>`:''}</div>`));return;}
    if(f.type==='items'){
      const ed=itemsEditor(values[f.key]);
      custom[f.key]=ed.value;
      const w=el('<div style="grid-column:1/-1"></div>');
      w.append(ed.el);ff.append(w);return;
    }
    if(f.type==='checks'||f.type==='radio'){
      const cur=f.type==='checks'?(values[f.key]||f.def||[]):(values[f.key]??f.def??'');
      const w=el(`<div class="field" style="${f.full?'grid-column:1/-1':''}">
        <label>${esc(f.label)}</label><div class="optrow"></div>
        ${f.hint?`<div class="fh">${esc(f.hint)}</div>`:''}</div>`);
      const row=w.querySelector('.optrow');
      (f.options||[]).forEach(o=>{
        const on=f.type==='checks'?cur.includes(o):cur===o;
        const b=el(`<button type="button" class="opt ${on?'on':''}" data-v="${esc(o)}">
          <span class="bx">${on?'✓':''}</span>${esc(o)}</button>`);
        b.onclick=()=>{
          if(f.type==='radio'){row.querySelectorAll('.opt').forEach(x=>{x.classList.remove('on');x.querySelector('.bx').textContent='';});
            b.classList.add('on');b.querySelector('.bx').textContent='✓';}
          else{const s=b.classList.toggle('on');b.querySelector('.bx').textContent=s?'✓':'';}};
        row.append(b);});
      custom[f.key]=()=>{
        const on=[...row.querySelectorAll('.opt.on')].map(x=>x.dataset.v);
        return f.type==='checks'?on:(on[0]||'');};
      ff.append(w);return;
    }
    if(f.type==='people'){
      const cur=values[f.key]||f.rolesDefault.map(r=>({role:r,name:''}));
      const w=el(`<div class="field" style="grid-column:1/-1"><label>${esc(f.label)}</label><div class="ppl"></div></div>`);
      const box=w.querySelector('.ppl');
      f.rolesDefault.forEach((role,i)=>{
        const v=cur.find(c=>c.role===role)||cur[i]||{};
        box.append(el(`<div class="pplrow"><span>${i+1}. ${esc(role)}</span>
          <input class="pname" data-role="${esc(role)}" placeholder="ชื่อ-นามสกุล" value="${esc(v.name||'')}">
          ${role==='อื่น ๆ (โปรดระบุตำแหน่ง)'?`<input class="ppos" placeholder="ระบุตำแหน่ง" value="${esc(v.pos||'')}">`:''}</div>`));
      });
      custom[f.key]=()=>[...box.querySelectorAll('.pplrow')].map(r=>({
        role:r.querySelector('.pname').dataset.role,
        name:r.querySelector('.pname').value.trim(),
        pos:r.querySelector('.ppos')?r.querySelector('.ppos').value.trim():''}));
      ff.append(w);return;
    }
    const v=values[f.key]??f.def??'';
    let inp;
    if(f.type==='select')inp=`<select name="${f.key}">${(f.options||[]).map(o=>`<option value="${esc(o)}" ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(f.type==='textarea')inp=`<textarea name="${f.key}" rows="3">${esc(v)}</textarea>`;
    else inp=`<input name="${f.key}" type="${f.type||'text'}" value="${esc(v)}" ${f.type==='number'?'step="0.01" inputmode="decimal"':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
    ff.append(el(`<div class="field" style="${f.full?'grid-column:1/-1':''}">
      <label>${esc(f.label)}${f.req?' <span class="rq">*</span>':''}</label>${inp}
      ${f.hint?`<div class="fh">${esc(f.hint)}</div>`:''}</div>`));
  });
  const close=()=>{ov.remove();document.removeEventListener('keydown',key);};
  const submit=()=>{
    const out={};let bad=null;
    Object.keys(custom).forEach(k=>out[k]=custom[k]());
    fields.filter(f=>!f.group&&!custom[f.key]).forEach(f=>{
      const n=ff.querySelector(`[name="${f.key}"]`);if(!n)return;let v=n.value.trim();
      if(f.type==='number')v=parseFloat(v||0)||0;
      if(f.req&&!v&&!bad)bad=[f.label,n];out[f.key]=v;});
    if(bad){toast('กรุณากรอก: '+bad[0]);bad[1].focus();bad[1].style.borderColor='#dc2626';return;}
    onSubmit(out);close();
  };
  const key=e=>{if(e.key==='Escape')close();
    if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&!e.target.closest('.itbl'))submit();};
  document.addEventListener('keydown',key);
  m.querySelector('.close').onclick=close;m.querySelector('#c').onclick=close;m.querySelector('#s').onclick=submit;
  ov.onclick=e=>{if(e.target===ov)close();};
  ov.append(m);$('#layer').append(ov);
  setTimeout(()=>ff.querySelector('input,select,textarea')?.focus(),40);
}

    Object.assign(S,v,{dash:Object.assign({},S.dash,v.dash||{})});
    if(!PAGES.some(p=>p.id===S.page))S.page='dashboard';

    if(S.poOpen&&!DB.pos.some(x=>x.id===S.poOpen))S.poOpen=null;
    if(S.rcOpen&&!DB.receipts.some(x=>x.id===S.rcOpen))S.rcOpen=null;
    if(S.profSel&&!DB.customers.some(x=>x.id===S.profSel))S.profSel=null;

/* ---------- 1. DASHBOARD ---------- */
const PERIODS=[['30','30 วัน'],['90','90 วัน'],['year','รายปี'],['all','ทั้งหมด']];
function inPeriod(iso){const d=new Date(iso);if(isNaN(d))return false;const p=S.dash.period;
  if(p==='all')return true;if(p==='year')return d.getFullYear()===S.dash.year;
  return (Date.now()-d.getTime())/86400000<=parseInt(p,10);}
function dataYears(){const ys=new Set([new Date().getFullYear()]);
  [...DB.receipts,...DB.pos,...DB.docs].forEach(x=>{const d=new Date(x.date);if(!isNaN(d))ys.add(d.getFullYear());});
  return [...ys].sort((a,b)=>b-a);}
const poTotal=p=>(p.items||[]).reduce((a,i)=>a+i.qty*i.price,0);
const poGross=p=>poTotal(p)*1.07;

/* ================= สูตรยอดขาย: อ้างอิงจากใบเสร็จ =================
   ยอดขายจริง (รับรู้รายได้) = ใบเสร็จรับเงินที่ไม่ถูกยกเลิก — นับครั้งเดียว ไม่ซ้ำ
   PO และใบเสนอราคา = "ยอดในมือ" ที่ยังไม่ได้ออกใบเสร็จ แสดงแยกต่างหาก
   ใบเสร็จอ้างอิงได้ทั้งเลขที่ PO และเลขที่ใบเสนอราคา (ช่อง ref)
   ลูกค้าที่ซื้อโดยไม่มี PO จึงเข้ายอดขายได้ทันทีเมื่อออกใบเสร็จอ้างอิงใบเสนอราคา */
const rcRef=r=>r.poRef||'';
const liveRc=()=>DB.receipts.filter(r=>r.status!=='ยกเลิก');
function poHasReceipt(po){return liveRc().some(r=>rcRef(r)===po.no);}
function quoteHasReceipt(q){
  const pos=DB.pos.filter(p=>p.quoteRef===q.no).map(p=>p.no);
  return liveRc().some(r=>rcRef(r)===q.no||pos.includes(rcRef(r)));
}
/* งานที่ปิดการขายแล้วแต่ยังไม่ได้ออกใบเสร็จ — ยังไม่นับเป็นยอดขาย */
function pending(){
  const out=[];
  DB.pos.filter(p=>p.status!=='ยกเลิก'&&!poHasReceipt(p)).forEach(p=>
    out.push({src:'po',label:'PO',ref:p.no,customer:p.customer,date:p.date,amount:poGross(p),obj:p}));
  DB.docs.filter(d=>d.type==='quotation'&&d.status==='อนุมัติแล้ว'
      &&!DB.pos.some(p=>p.status!=='ยกเลิก'&&p.quoteRef===d.no)&&!quoteHasReceipt(d))
    .forEach(d=>out.push({src:'quote',label:'ใบเสนอราคา (ไม่มี PO)',ref:d.no,customer:d.customer,date:d.date,amount:d.amount,obj:d}));
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
/* ออกใบเสร็จจากใบเสนอราคา หรือ PO — เติมข้อมูลให้อัตโนมัติ */
function issueReceipt(pre){
  openForm('ออกใบเสร็จรับเงิน',rcFields(),Object.assign({
    no:'RC-'+(new Date().getFullYear()+543)+'-'+String(DB.receipts.length+67).padStart(4,'0'),
    date:today(),status:'รอชำระ'},pre),d=>{
    const r=Object.assign({id:uid()},d);DB.receipts.unshift(r);save();
    go('receipts',{rcFilter:'ทั้งหมด',rcQ:'',rcMonth:null});toast('ออกใบเสร็จแล้ว — ยอดเข้าแดชบอร์ดทันที');openRc(r);});
}

function pgDashboard(v){
  header('หน้าแรก',['ภาพรวมยอดขาย']);
  $('#topActions').append(seg(PERIODS,S.dash.period,k=>{S.dash.period=k;render();}));
  if(S.dash.period==='year'){
    const sel=el(`<select style="border:1px solid #d3ddec;border-radius:10px;height:44px;padding:0 12px;background:#fff;cursor:pointer">${dataYears().map(y=>`<option value="${y}" ${y===S.dash.year?'selected':''}>ปี ${y+543}</option>`).join('')}</select>`);
    sel.onchange=()=>{S.dash.year=+sel.value;render();};$('#topActions').append(sel);
  }

  const rcs=liveRc().filter(r=>inPeriod(r.date)),css=DB.customers.filter(c=>inPeriod(c.date));
  const total=rcs.reduce((a,b)=>a+b.amount,0);
  const paid=rcs.filter(r=>r.status==='ชำระแล้ว').reduce((a,b)=>a+b.amount,0);
  const unpaid=rcs.filter(r=>r.status!=='ชำระแล้ว').reduce((a,b)=>a+b.amount,0);
  const pend=pending().filter(x=>inPeriod(x.date));
  const pendSum=pend.reduce((a,b)=>a+b.amount,0);

  v.append(hint('ยอดขายนับจาก "ใบเสร็จรับเงิน" เท่านั้น จึงไม่นับซ้ำกับ PO — งานที่ปิดแล้วแต่ยังไม่ออกใบเสร็จดูได้ที่การ์ด "ยอดในมือ"'));

  const kp=el('<div class="grid g4"></div>');
  [['ยอดขายรวม (จากใบเสร็จ)',num0(Math.round(total))+' ฿',rcs.length+' ใบเสร็จในช่วงนี้','receipts',{rcFilter:'ทั้งหมด',rcMonth:null}],
   ['รับชำระแล้ว',num0(Math.round(paid))+' ฿',rcs.filter(r=>r.status==='ชำระแล้ว').length+' ใบ','receipts',{rcFilter:'ชำระแล้ว',rcMonth:null}],
   ['รอเก็บเงิน',num0(Math.round(unpaid))+' ฿',rcs.filter(r=>r.status!=='ชำระแล้ว').length+' ใบที่ยังไม่ครบ','receipts',{rcFilter:'รอชำระ',rcMonth:null}],
   ['ยอดในมือ (ยังไม่ออกใบเสร็จ)',num0(Math.round(pendSum))+' ฿',pend.length+' รายการรอออกใบเสร็จ',null,null]
  ].forEach(([t,val,sub,page,extra])=>{
    const c=el(`<div class="card pad" style="cursor:pointer;transition:.15s">
      <div class="mut">${esc(t)}</div><div style="font-size:26px;font-weight:700;margin-top:4px">${val}</div>
      <div class="tiny" style="margin-top:8px">${esc(sub)} →</div></div>`);
    c.onmouseenter=()=>{c.style.boxShadow='0 8px 22px rgba(15,42,90,.11)';c.style.transform='translateY(-2px)';};
    c.onmouseleave=()=>{c.style.boxShadow='';c.style.transform='';};
    c.onclick=()=>page?go(page,extra):document.getElementById('pendingCard')?.scrollIntoView({behavior:'smooth',block:'center'});
    kp.append(c);});

    const list=el('<div class="list"></div>');
    pend.slice(0,6).forEach(x=>{
      const isQ=x.src==='quote';
      const r=el(`<div class="lrow" style="cursor:default">
        <div class="lav" style="${isQ?'background:#fff3e0;color:#b45309':''}">${svg(isQ?'doc':'cart','ic s')}</div>
        <div class="lmain"><div class="lt">${esc(x.ref)} · ${esc(x.customer)}</div>
        <div class="lm">${esc(x.label)} · ${fmtDate(x.date)}</div></div>
        <div class="lright"><div class="lamt">${num0(Math.round(x.amount))} ฿</div>
        <button class="btn sm iss">ออกใบเสร็จ</button></div></div>`);
      r.querySelector('.iss').onclick=()=>issueReceipt({customer:x.customer,amount:Math.round(x.amount*100)/100,poRef:x.ref});
      list.append(r);});
    pc.append(list);
    if(pend.length>6)pc.append(el(`<div class="pad tiny">และอีก ${pend.length-6} รายการ</div>`));
  }
  v.append(pc);

  const yr=S.dash.period==='year'?S.dash.year:new Date().getFullYear();
  const months=Array(12).fill(0),cnts=Array(12).fill(0);
  liveRc().forEach(r=>{const d=new Date(r.date);if(!isNaN(d)&&d.getFullYear()===yr){months[d.getMonth()]+=r.amount;cnts[d.getMonth()]++;}});
  const mx=Math.max(...months,100000),X=i=>56+i*53,Y=n=>208-(n/mx)*168;

  const row=el('<div class="split"></div>');
  const cc=el('<div class="card pad" style="position:relative"></div>');
  const ch=el(`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px">
    <div><div class="h3" style="margin:0">ยอดขายรายเดือน ปี ${yr+543}</div>
    <div class="tiny">นับจากใบเสร็จรับเงิน</div></div></div>`);
  ch.append(seg([['line','เส้น'],['bar','แท่ง']],S.dash.chart,k=>{S.dash.chart=k;render();}));
  cc.append(ch);
  const tip=el('<div style="position:absolute;pointer-events:none;opacity:0;transition:.12s;background:#101b2e;color:#fff;font-size:12.5px;padding:8px 11px;border-radius:9px;white-space:nowrap;z-index:5"></div>');
  cc.append(tip);
  const marks=S.dash.chart==='line'
    ? `<polyline points="${months.map((m,i)=>X(i)+','+Y(m).toFixed(0)).join(' ')}" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/>
       ${months.map((m,i)=>`<circle class="pt" data-i="${i}" cx="${X(i)}" cy="${Y(m).toFixed(0)}" r="3.8" fill="#fff" stroke="#2563eb" stroke-width="2.2"/>`).join('')}`
    : months.map((m,i)=>`<rect class="pt" data-i="${i}" x="${X(i)-17}" y="${Y(m).toFixed(0)}" width="34" height="${(208-Y(m)).toFixed(0)}" rx="5" fill="#2563eb" opacity=".88"/>`).join('');
  const chart=el(`<div style="position:relative">
    <svg viewBox="0 0 700 240" style="width:100%;height:230px;display:block">
      <g stroke="#eef2f8"><path d="M46 40H690M46 82H690M46 124H690M46 166H690M46 208H690"/></g>
      <g fill="#94a3b8" font-size="10"><text x="2" y="44">${num0(Math.round(mx/1000))}k</text><text x="2" y="128">${num0(Math.round(mx/2000))}k</text><text x="24" y="212">0</text></g>
      ${marks}
      <g fill="#94a3b8" font-size="10.5" text-anchor="middle">${MN.map((m,i)=>`<text x="${X(i)}" y="230">${m}</text>`).join('')}</g>
      ${months.map((m,i)=>`<rect class="hit" data-i="${i}" x="${X(i)-26}" y="30" width="52" height="182" fill="transparent" style="cursor:pointer"/>`).join('')}
    </svg></div>`);
  const sv=chart.querySelector('svg');
  chart.querySelectorAll('.hit').forEach(h=>{
    const i=+h.dataset.i;
    h.onmouseenter=()=>{const box=sv.getBoundingClientRect(),sc=box.width/700;
      tip.innerHTML=`<b>${MN[i]} ${yr+543}</b><br>${num(months[i])} บาท · ${cnts[i]} รายการ`;
      tip.style.opacity=1;tip.style.left=Math.min(Math.max(X(i)*sc-60,4),box.width-160)+'px';
      tip.style.top=(chart.offsetTop+Math.max(Y(months[i])*sc-54,0))+'px';
      sv.querySelectorAll('.pt').forEach(p=>p.setAttribute('opacity',+p.dataset.i===i?'1':'.4'));};
    h.onmouseleave=()=>{tip.style.opacity=0;sv.querySelectorAll('.pt').forEach(p=>p.setAttribute('opacity','1'));};
    h.onclick=()=>{if(!cnts[i]){toast('เดือน'+MN[i]+' ยังไม่มีรายการ');return;}go('receipts',{rcMonth:{y:yr,m:i},rcFilter:'ทั้งหมด',rcQ:''});};
  });
  cc.append(chart);row.append(cc);

  const pipe=el('<div class="card pad"><div class="h3">Pipeline การขาย</div></div>');
  const counts={};Object.keys(CUST_ST).forEach(k=>counts[k]=css.filter(c=>c.status===k).length);
  const mxn=Math.max(...Object.values(counts),1);
  Object.keys(CUST_ST).filter(k=>k!=='ยกเลิก').forEach(k=>{
    const col=CUST_ST[k][1],n=counts[k];
    const r=el(`<div style="cursor:pointer;padding:9px 10px;margin:0 -10px;border-radius:10px">
      <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>${k}</span><b>${n}</b></div>
      <div style="height:9px;background:#eef2f8;border-radius:99px;overflow:hidden"><div style="width:${(n/mxn*100).toFixed(0)}%;height:100%;background:${col};transition:width .3s"></div></div></div>`);
    r.onmouseenter=()=>r.style.background='#f6f9ff';r.onmouseleave=()=>r.style.background='';

  const row3=el('<div class="split"></div>');
  const act=el('<div class="card"><div class="pad" style="padding-bottom:2px"><div class="h3" style="margin:0">ลูกค้าติดต่อล่าสุด</div></div></div>');
  const acts=[...css].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const inner=listCard(acts,{
    avatar:c=>esc(initials(c.name)),
    title:c=>esc(c.name),
    meta:c=>esc((c.timeline[c.timeline.length-1]||{}).title||'ติดต่อเข้ามา')+' · '+ago(c.date),
    status:c=>pill(c.status,CUST_ST),
    onOpen:c=>go('profiles',{profSel:c.id,profTab:'info'}),
    empty:emptyState('ยังไม่มีลูกค้าในช่วงนี้','ลองเปลี่ยนช่วงเวลาด้านบน')});
  act.append(inner.firstElementChild);
  row3.append(act);

  const rcCard=el('<div class="card pad"><div class="h3">สถานะใบเสร็จ</div></div>');
  Object.keys(RC_ST).forEach(k=>{
    const g=rcs.filter(r=>r.status===k);
    const r=el(`<div style="display:flex;align-items:center;gap:10px;font-size:14px;padding:12px 10px;margin:0 -10px;border-bottom:1px solid var(--bd2);border-radius:10px;cursor:pointer">
      <span style="width:10px;height:10px;border-radius:50%;background:${RC_ST[k][1]}"></span>${k}
      <b style="margin-left:auto">${g.length} ใบ · ${num0(g.reduce((a,b)=>a+b.amount,0))} ฿</b></div>`);
    r.onmouseenter=()=>r.style.background='#f6f9ff';r.onmouseleave=()=>r.style.background='';
    r.onclick=()=>go('receipts',{rcFilter:k,rcMonth:null,rcQ:''});rcCard.append(r);});
  row3.append(rcCard);v.append(row3);
}

function ensureSample(d){if(!d.kinds)d.kinds=[];if(!d.cfWind)d.cfWind=[];if(!d.prWind)d.prWind=[];if(!d.sigs)d.sigs={};return d;}
function ensureReq(d){if(!d.joinMark)d.joinMark=[];if(!d.sigs)d.sigs={};return d;}
function ensureCredit(d){
  if(!d.contacts)d.contacts=CONTACT_ROLES.map(r=>({role:r,name:'',pos:''}));
  if(!d.products)d.products=[];
  if(!d.docs5)d.docs5=[];
  if(!d.sigs)d.sigs={};
  if(!d.photos)d.photos=[];
  if(!d.files)d.files=[];
  if(d.creditDays==null)d.creditDays=30;
  return d;
}
function nextNo(prefix){const yr=new Date().getFullYear()+543;
  const n=DB.docs.filter(d=>d.no.startsWith(prefix)).length+1;
  return `${prefix}-${yr}-${String(n).padStart(4,'0')}`;}
function openDocSmart(d){go('documents',{docType:d.type,docOpen:d.id});}
function pgDocuments(v){
  if(S.docOpen){const d=DB.docs.find(x=>x.id===S.docOpen);
    if(d)return d.type==='credit'?creditDetail(v,d)
      :(d.type==='sample'||d.type==='requirement')?formDocDetail(v,d):quoteDetail(v,d);
    S.docOpen=null;}
  const t=DOC_TYPES.find(x=>x[0]===S.docType);
  header('เอกสารการขาย',[t[1]]);
  const isQ=S.docType==='quotation',isC=S.docType==='credit';
  actionBtn('สร้าง'+t[1],'plus',()=>openForm('สร้าง'+t[1],docFields(S.docType),{},d=>{
    const doc=Object.assign({id:uid(),type:S.docType},d);
    if(doc.type==='quotation'){ensureQuote(doc);doc.amount=qtTotal(doc);}
    if(doc.type==='credit'){ensureCredit(doc);doc.amount=doc.approvedAmount||0;}
    if(doc.type==='sample'||doc.type==='requirement'){ensureByType(doc);doc.amount=doc.amount||0;}
    DB.docs.unshift(doc);save();render();toast('สร้างเอกสารแล้ว');openDocSmart(doc);},
    isQ?{wide:true,sub:'กรอกข้อมูลตามลำดับ 1 → 4 แล้วกดสร้าง',okLabel:'สร้างใบเสนอราคา'}
    :{wide:true,sub:'กรอกตามแบบฟอร์มบริษัท แล้วกดสร้าง',okLabel:'สร้าง'+t[1]}));

  v.append(hint('เลือกประเภทเอกสารได้จากหัวข้อย่อยใต้ "เอกสารการขาย" ในเมนูซ้าย · คลิกที่รายการเพื่อดูหรือแก้ไข'));

  const bar=el('<div class="toolbar"></div>');
  bar.append(searchRow(S.docQ,'ค้นหาเลขที่เอกสารหรือชื่อลูกค้า',q=>{S.docQ=q;render();}));
  v.append(bar);

  let clear=null;
  if(S.docFilter!=='ทั้งหมด'||S.docQ){clear=el('<button class="chip clear">ล้างตัวกรอง ✕</button>');
    clear.onclick=()=>{S.docFilter='ทั้งหมด';S.docQ='';render();};}
  const inType=DB.docs.filter(d=>d.type===S.docType);
  v.append(chipRow([['ทั้งหมด','ทั้งหมด ('+inType.length+')'],
    ...Object.keys(DOC_ST).map(k=>[k,k+' ('+inType.filter(d=>d.status===k).length+')'])],S.docFilter,k=>{S.docFilter=k;render();},clear));

  const q=S.docQ.toLowerCase();
  const items=inType.filter(d=>(S.docFilter==='ทั้งหมด'||d.status===S.docFilter)&&
    (!q||[d.no,d.customer].join(' ').toLowerCase().includes(q)));
  const money=S.docType==='quotation'||S.docType==='credit';
  v.append(el(`<div class="tiny">พบ ${items.length} รายการ${money?' · ยอดรวม '+num0(items.reduce((a,b)=>a+b.amount,0))+' ฿':''}</div>`));
  v.append(listCard(items,{
    avatar:()=>svg('doc','ic s'),
    title:d=>esc(d.no),
    meta:d=>{const n=(d.photos||[]).length+(d.files||[]).length;
      return esc(d.customer)+' · '+fmtDate(d.date)+(n?' · 📎 '+n:'')+(d.note?' · '+esc(d.note.slice(0,32)):'');},
    amount:money?d=>num0(d.amount)+' ฿':null,
    status:d=>pill(d.status,DOC_ST),
    onOpen:openDocSmart,
    empty:emptyState('ยังไม่มี'+t[1],'สร้างฉบับแรกได้เลย','สร้าง'+t[1],()=>$('#topActions .btn').click())
  }));
}

/* การ์ดลายเซ็น ใช้ร่วมกันทุกเอกสาร */
function signCard(d,onSigned){
  const roles=rolesOf(d.type),n=Object.keys(d.sigs||{}).length;
  const sg=el(`<div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px">
    <div class="h3" style="margin:0">ลายเซ็นอนุมัติ</div>
    <span class="pill" style="background:${n===roles.length?'#dcfce7':'#fef3c7'};color:${n===roles.length?'#15803d':'#b45309'}">${n}/${roles.length} ลายเซ็น</span></div></div>`);
  roles.forEach(([k,label],i)=>{
    const s=(d.sigs||{})[k],done=!!(s&&s.img);
    const row=el(`<div style="display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--bd2)">
      <div style="width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
        font-size:12px;font-weight:700;background:${done?'#dcfce7':'#eef2f8'};color:${done?'#15803d':'#94a3b8'}">${done?'✓':i+1}</div>
      <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${esc(label)}</div>
      <div class="tiny">${done?esc(s.name||'')+' · '+fmtDate(s.date):'ยังไม่ได้เซ็น'}</div>
      ${done?`<img src="${imgSrc(s.img)}" style="max-height:40px;margin-top:7px;display:block">`:''}</div></div>`);
    if(!done){
      const b=el('<button class="btn gh sm">เซ็นที่เครื่องนี้</button>');
      b.onclick=()=>signModal('เซ็น — '+label,d.no,'',s2=>{
        d.sigs=d.sigs||{};d.sigs[k]=s2;
        if(onSigned)onSigned();
        save();render();toast('บันทึกลายเซ็น '+label+' แล้ว');});
      row.append(b);}
    sg.append(row);});
  const send=el(`<button class="btn blk" style="margin-top:14px">${svg('doc','ic s')}ส่งลิงก์ให้เซ็น ${roles.length} ท่าน</button>`);
  send.onclick=()=>shareCredit(d);
  sg.append(send);
  if(d.sigDocId){
    const rf=el('<button class="btn gh blk" style="margin-top:9px">ตรวจสอบลายเซ็นล่าสุด</button>');
    rf.onclick=()=>checkCredit(d);sg.append(rf);
    if(n<roles.length&&sbReady!==false){clearInterval(pollTimer);
      pollTimer=setInterval(()=>{if(!document.body.contains(sg)){clearInterval(pollTimer);return;}checkCredit(d,true);},15000);}
  }
  sg.append(el(`<div class="tiny" style="margin-top:10px">${sbReady===true?'🟢 พร้อมส่งลิงก์ให้เซ็นข้ามเครื่อง'
    :sbReady===false?'🟠 '+esc(sbError):'⏳ กำลังตรวจสอบการเชื่อมต่อ…'}</div>`));
  return sg;
}

function openDoc(d){
  const isQuote=d.type==='quotation';
  const hasRc=isQuote&&quoteHasReceipt(d);
  const hasPo=isQuote&&DB.pos.some(p=>p.status!=='ยกเลิก'&&p.quoteRef===d.no);
  const blocks=[rows([['ลูกค้า',esc(d.customer)],['วันที่',fmtDate(d.date)],['ยอดรวม',num(d.amount)+' บาท'],
      d.note?['รายละเอียด',esc(d.note)]:null,
      isQuote?['สถานะยอดขาย',hasRc?'<span style="color:#15803d">ออกใบเสร็จแล้ว — นับเป็นยอดขาย</span>'
        :hasPo?'<span style="color:#4338ca">มี PO แล้ว รอออกใบเสร็จ</span>'
        :d.status==='อนุมัติแล้ว'?'<span style="color:#b45309">ยังไม่มี PO และยังไม่ออกใบเสร็จ</span>'
        :'<span style="color:#94a3b8">ยังไม่อนุมัติ</span>']:null])];
  if(isQuote&&!hasRc){
    const b=el(`<button class="btn blk">${svg('receipt','ic s')}ออกใบเสร็จจากใบเสนอราคานี้</button>`);
    b.onclick=()=>issueReceipt({customer:d.customer,amount:d.amount,poRef:d.no});
    const w=el('<div></div>');
    w.append(b);
    w.append(el(`<div class="tiny" style="margin-top:8px">${hasPo?'ใบเสนอราคานี้มี PO แล้ว — ออกใบเสร็จอ้างอิง PO ก็ได้เช่นกัน':'ลูกค้าที่ซื้อโดยไม่มี PO ให้ออกใบเสร็จจากตรงนี้ ยอดจะเข้าแดชบอร์ดทันที'}</div>`));
    blocks.push(w);
  }
  drawer({id:d.id,kicker:docTypeName(d.type),title:d.no,badge:pill(d.status,DOC_ST),
    blocks,
    actions:[
      [svg('edit','ic s')+'แก้ไข','gh',()=>openForm('แก้ไข '+d.no,docFields(d.type),d,o=>{Object.assign(d,o);save();render();toast('บันทึกแล้ว');openDoc(d);})],
      [svg('print','ic s')+'พิมพ์','gh',()=>window.print()],
      [svg('trash','ic s'),'dg',()=>askConfirm('ลบเอกสาร','ลบ '+d.no+'?','ลบ',()=>{
        const i=DB.docs.indexOf(d);DB.docs.splice(i,1);save();closeDrawer();render();
        toast('ลบเอกสารแล้ว',()=>{DB.docs.splice(i,0,d);save();render();});})]]});
}

    {key:'name',label:'ชื่อสินค้า',req:true,full:true},
    {key:'qty',label:'จำนวน',type:'number',def:1},{key:'price',label:'ราคา/หน่วย (บาท)',type:'number',def:0}
  ],{},d=>{p.items.push(d);save();render();toast('เพิ่มรายการแล้ว');});
  ih.append(addI);items.append(ih);

  if(!p.items.length)items.append(emptyState('ยังไม่มีรายการสินค้า','กด "เพิ่มรายการ" เพื่อใส่สินค้าใน PO นี้'));
  else{
    const list=el('<div class="list"></div>');
    p.items.forEach((it,i)=>{

        <div class="lm">${esc(it.code)} · ${num0(it.qty)} ${esc(it.unit)} × ${num(it.price)} ฿</div></div>
        <div class="lright"><div class="lamt">${num(it.qty*it.price)} ฿</div>

  const del=el(`<button class="btn dg blk">${svg('trash','ic s')}ลบ PO ใบนี้</button>`);
  del.onclick=()=>askConfirm('ลบ PO','ลบ '+p.no+' ออกจากระบบ?','ลบ',()=>{
    const i=DB.pos.indexOf(p);DB.pos.splice(i,1);save();go('po',{poOpen:null});
    toast('ลบ PO แล้ว',()=>{DB.pos.splice(i,0,p);save();render();});});

  wrap.append(right);v.append(wrap);

function uploadPanel(c,title){
  const r=el('<div class="card pad" style="display:flex;flex-direction:column;gap:16px;align-self:start"></div>');
  r.append(el(`<div class="h3" style="margin:0">${esc(title)}</div>`));
  const lb=el(`<div><div class="tiny" style="margin-bottom:8px">โลโก้บริษัท</div>
    <div class="thumb" style="width:140px">${c.logo?`<img src="${imgSrc(c.logo)}"><button class="x rmlogo" title="ลบโลโก้">✕</button>`
      :'<div style="height:90px;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:13px">ยังไม่มีโลโก้</div>'}
    <div class="nm">${c.logo?'โลโก้':'—'}</div></div>
    <div style="display:flex;gap:8px;margin-top:9px">
      <button class="btn gh sm ch" style="flex:1">${c.logo?'เปลี่ยนโลโก้':'อัปโหลดโลโก้'}</button>
      ${c.logo?'<button class="btn dg sm del">ลบ</button>':''}</div></div>`);
  const removeLogo=()=>{const old=c.logo;c.logo=null;save();render();
    toast('ลบโลโก้แล้ว',()=>{c.logo=old;save();render();});};
  if(c.logo){
    lb.querySelector('img').onclick=()=>lightbox(c.logo);
    lb.querySelector('.rmlogo').onclick=e=>{e.stopPropagation();removeLogo();};
    lb.querySelector('.del').onclick=removeLogo;
  }
  lb.querySelector('.ch').onclick=()=>pickFiles('image/*',false,async fs=>{const im=await readImage(fs[0]);if(im){c.logo=im.data;save();render();toast('อัปโหลดโลโก้แล้ว');}});
  r.append(lb);
  r.append(dropZone('JPG, PNG, PDF · รูปจะถูกย่อขนาดอัตโนมัติ',fs=>addUploads(fs,c.photos,c.files)));
  r.append(el(`<div style="font-size:14px;font-weight:600">รูปภาพ (${c.photos.length})</div>`));
  r.append(thumbGrid(c.photos));
  r.append(el(`<div style="font-size:14px;font-weight:600">เอกสารแนบ (${c.files.length})</div>`));
  r.append(fileList(c.files));
  return r;
}

/* ================= หน้าเข้าสู่ระบบ ================= */
function loginScreen(msg){
  document.querySelector('.app').style.display='none';
  const old=document.getElementById('loginWrap');if(old)old.remove();
  const w=el(`<div id="loginWrap" style="position:fixed;inset:0;background:linear-gradient(150deg,#0b2a63,#123f9e);
      display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;z-index:200">
    <div style="background:#fff;border-radius:18px;width:100%;max-width:430px;padding:34px 32px;box-shadow:0 24px 60px rgba(5,20,50,.4)">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:22px">
        <div style="width:48px;height:48px;border-radius:13px;background:linear-gradient(150deg,#4f9cf9,#123f9e);
          display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden">
          ${logoSrc()?`<img src="${imgSrc(logoSrc())}" style="width:100%;height:100%;object-fit:cover">`:'BWP'}</div>
        <div><div style="font-size:20px;font-weight:700">BWP Sales</div>
          <div class="tiny">ระบบจัดการงานขาย</div></div></div>
      ${msg?`<div class="hint" style="margin-bottom:16px">${esc(msg)}</div>`:''}
      <div id="lgErr" style="display:none;background:#fef2f2;border:1px solid #fbcaca;color:#b91c1c;
        border-radius:10px;padding:11px 13px;font-size:13.5px;margin-bottom:14px"></div>
      <div class="field" style="margin-bottom:14px"><label>ชื่อผู้ใช้</label>
        <input id="lgEmail" autocomplete="username" placeholder="เช่น somchai" autocapitalize="off" spellcheck="false">
        <div class="fh">ตัวอักษรอังกฤษ ตัวเลข . _ - (ไม่ต้องใส่อีเมล)</div></div>
      <div class="field" style="margin-bottom:14px"><label>รหัสผ่าน</label>
        <input id="lgPass" type="password" autocomplete="current-password" placeholder="อย่างน้อย 6 ตัวอักษร"></div>
      <div class="field" id="lgNameWrap" style="margin-bottom:14px;display:none"><label>ชื่อ-นามสกุล (แสดงในระบบ)</label>
        <input id="lgName" placeholder="เช่น คุณวราลักษณ์ บุตะกุล"></div>
      <button class="btn blk" id="lgGo" style="height:48px;margin-top:4px">เข้าสู่ระบบ</button>
      <div style="text-align:center;margin-top:16px;font-size:13.5px;color:var(--mut)">
        <span id="lgSwitchTxt">ยังไม่มีบัญชี?</span>
        <a href="#" id="lgSwitch" style="font-weight:600">สมัครใช้งาน</a></div>
      <div class="tiny" style="text-align:center;margin-top:18px">ข้อมูลของแต่ละคนแยกกัน เข้าจากเครื่องไหนก็เห็นงานของตัวเอง</div>
    </div></div>`);
  document.body.append(w);
  let mode='in';
  const err=t=>{const e=w.querySelector('#lgErr');e.style.display=t?'block':'none';e.textContent=t||'';};
  w.querySelector('#lgSwitch').onclick=e=>{e.preventDefault();
    mode=mode==='in'?'up':'in';err('');
    w.querySelector('#lgNameWrap').style.display=mode==='up'?'flex':'none';
    w.querySelector('#lgGo').textContent=mode==='up'?'สมัครใช้งาน':'เข้าสู่ระบบ';
    w.querySelector('#lgSwitchTxt').textContent=mode==='up'?'มีบัญชีแล้ว?':'ยังไม่มีบัญชี?';
    w.querySelector('#lgSwitch').textContent=mode==='up'?'เข้าสู่ระบบ':'สมัครใช้งาน';};
  const go=async()=>{
    const b=w.querySelector('#lgGo');
    const user=w.querySelector('#lgEmail').value.trim();
    const pass=w.querySelector('#lgPass').value;
    if(!user||!pass){err('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');return;}
    if(!validUsername(user)){err('ชื่อผู้ใช้ใช้ได้เฉพาะ a-z 0-9 . _ - และยาว 3 ตัวขึ้นไป');return;}
    if(mode==='up'&&pass.length<6){err('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร');return;}
    b.disabled=true;b.textContent='กำลังดำเนินการ…';err('');
    try{
      if(mode==='up'){
        const ok=await signUp(user,pass,w.querySelector('#lgName').value.trim());
        if(!ok){b.disabled=false;b.textContent='สมัครใช้งาน';
          err('สมัครแล้วแต่ระบบยังบังคับยืนยันอีเมล — ให้ผู้ดูแลปิด "Confirm email" ใน Supabase แล้วลองเข้าสู่ระบบอีกครั้ง');return;}
      }else await signIn(user,pass);
      w.remove();document.querySelector('.app').style.display='';
      await startApp();
    }catch(e){b.disabled=false;b.textContent=mode==='up'?'สมัครใช้งาน':'เข้าสู่ระบบ';err(e.message);}
  };
  w.querySelector('#lgGo').onclick=go;
  w.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  setTimeout(()=>w.querySelector('#lgEmail').focus(),80);
}
function userMenu(){
  if(!authed()){loginScreen();return;}
  const p=AUTH.profile||{},ro=readOnly();
  const ov=el('<div class="ov"></div>');
  const m=el(`<div class="modal" style="max-width:430px"><header><div><b>${esc(p.name||toUsername(p.email)||'ผู้ใช้')}</b>
      <div class="tiny" style="margin-top:2px">ชื่อผู้ใช้: ${esc(toUsername(p.email))} · ${isManager()?'ผู้จัดการ':'พนักงานขาย'}</div></div>
      <button class="close">✕</button></header>
    <div class="mb" style="display:flex;flex-direction:column;gap:10px">
      ${ro?'<div class="hint">กำลังดูข้อมูลของคนอื่นอยู่ แก้ไขไม่ได้ กดปุ่มด้านล่างเพื่อกลับมาที่ข้อมูลของคุณ</div>':''}
      ${isManager()?'<button class="btn gh blk" id="team">ดูข้อมูลของทีมขาย</button>':''}
      ${ro?'<button class="btn blk" id="mine">กลับไปข้อมูลของฉัน</button>':''}
      <button class="btn gh blk" id="sync">บันทึกขึ้นคลาวด์เดี๋ยวนี้</button>
      <button class="btn dg blk" id="out">ออกจากระบบ</button>
    </div></div>`);
  const close=()=>ov.remove();
  m.querySelector('.close').onclick=close;
  if(m.querySelector('#team'))m.querySelector('#team').onclick=()=>{close();teamPicker();};
  if(m.querySelector('#mine'))m.querySelector('#mine').onclick=()=>{close();viewUser(AUTH.user.id,'ฉัน',true);};
  m.querySelector('#sync').onclick=async()=>{close();
    if(readOnly()){toast('โหมดดูอย่างเดียว ไม่มีอะไรต้องบันทึก');return;}
    setSync('saving');await cloudSave();
    toast(syncState==='offline'?'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง':'บันทึกขึ้นคลาวด์แล้ว');};
  m.querySelector('#out').onclick=()=>{close();logout();};
  ov.onclick=e=>{if(e.target===ov)close();};
  ov.append(m);$('#layer').append(ov);
}
function logout(){
  askConfirm('ออกจากระบบ','ต้องการออกจากระบบใช่ไหม? ข้อมูลถูกบันทึกขึ้นคลาวด์แล้ว','ออกจากระบบ',async()=>{
    if(syncPending)await cloudSave();
    clearSession();location.reload();});
}
/* หัวหน้าเลือกดูข้อมูลของเซลแต่ละคน */
async function teamPicker(){
  let team=[];
  try{team=await sbRpc('team_list',{})||[];}catch(e){toast(e.message);return;}
  const ov=el('<div class="ov"></div>');
  const m=el(`<div class="modal" style="max-width:560px"><header><div><b>ข้อมูลของทีมขาย</b>
      <div class="tiny" style="margin-top:2px">เลือกดูข้อมูลของแต่ละคน (ดูได้อย่างเดียว แก้ไม่ได้)</div></div>
      <button class="close">✕</button></header><div class="mb"><div class="list2"></div></div></div>`);
  const list=m.querySelector('.list2');
  const me=AUTH.user.id;
  [{id:me,name:(AUTH.profile.name||'ฉัน')+' (ข้อมูลของฉัน)',email:AUTH.profile.email,role:AUTH.profile.role,mine:true,
    updated_at:null,size_kb:null}]
    .concat(team.filter(t=>t.id!==me))
    .forEach(t=>{
      const on=(AUTH.viewing||me)===t.id;
      const r=el(`<div class="lrow" style="border-radius:10px;${on?'background:var(--blue-l);box-shadow:inset 3px 0 0 var(--blue)':''}">
        <div class="lav">${esc(initials(t.name||toUsername(t.email)||'?'))}</div>
        <div class="lmain"><div class="lt">${esc(t.name||toUsername(t.email))}</div>
          <div class="lm">${esc(toUsername(t.email))} · ${esc(t.role==='sales'?'พนักงานขาย':t.role==='manager'?'ผู้จัดการ':'ผู้ดูแล')}${t.updated_at?' · แก้ล่าสุด '+ago(t.updated_at):''}${t.size_kb?' · '+t.size_kb+' KB':''}</div></div>
        <div class="lright">${on?'<span class="pill" style="background:#dbeafe;color:#1d4ed8">กำลังดู</span>':''}</div></div>`);
      r.onclick=async()=>{ov.remove();await viewUser(t.id,t.name||t.email,t.mine);};
      list.append(r);});
  if(!team.length)list.append(el('<div class="empty">ยังไม่มีผู้ใช้คนอื่นในระบบ</div>'));
  m.querySelector('.close').onclick=()=>ov.remove();
  ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.append(m);$('#layer').append(ov);
}
async function viewUser(id,name,mine){
  toast('กำลังโหลดข้อมูล…');
  try{
    const d=await cloudLoad(id);
    AUTH.viewing=mine?null:id;AUTH.viewingName=mine?null:name;
    DB=d&&d.customers?d:seed();
    migrate();
    S.page='dashboard';S.docOpen=S.poOpen=S.rcOpen=S.profSel=null;
    setSync(readOnly()?'readonly':'idle');render();
    toast(mine?'กลับมาที่ข้อมูลของคุณแล้ว':'กำลังดูข้อมูลของ '+name+' (แก้ไขไม่ได้)');
  }catch(e){toast(e.message);}
}

/* ================= boot ================= */
function migrate(){
  if(!DB.company)DB.company=Object.assign({},COMPANY);
  if(DB.cert===undefined)DB.cert=null;
  (DB.docs||[]).filter(d=>d.type==='quotation').forEach(d=>{
    ensureQuote(d);
    if(!d.items.length&&d.amount)d.items=[{name:'สินค้าตามรายละเอียดที่เสนอ',qty:1,unit:'รายการ',price:d.amount}];
  });
}
async function startApp(){
  try{await loadProfile();}catch(e){}
  let cloud=null,failed=false;
  try{cloud=await cloudLoad(AUTH.user.id);}catch(e){failed=true;}
  const local=load();
  if(cloud&&cloud.customers)DB=cloud;
  else if(local&&local.customers)DB=local;
  else DB=seed();
  migrate();
  loadView();booted=true;
  const nm=(AUTH.profile&&AUTH.profile.name)||toUsername(AUTH.user.email);
  $('#userName').textContent=nm;
  $('#userRole').textContent=isManager()?'ผู้จัดการ':'พนักงานขาย';
  $('#userAv').textContent=initials(nm);
  render();
  if(failed){setSync('offline');toast('เชื่อมคลาวด์ไม่ได้ — ใช้ข้อมูลในเครื่องไปก่อน แล้วจะบันทึกให้เมื่อกลับมาออนไลน์');}
  else if(!cloud){save();}   /* ผู้ใช้ใหม่: อัปข้อมูลเริ่มต้นขึ้นคลาวด์ */
  sbPing();
}
async function boot(){
  /* ลิงก์เซ็นเอกสาร: เปิดได้เลยไม่ต้องล็อกอิน */
  if(/^#(s=|a=|approve=|signed=)/.test(location.hash||'')){
    DB=load()||seed();migrate();booted=true;
    document.querySelector('.app').style.display='none';
    await handleHash();
    if(!document.querySelector('.prevov,.ov')){document.querySelector('.app').style.display='';render();}
    return;
  }
  try{const s=JSON.parse(localStorage.getItem(AKEY)||'null');
    if(s&&s.token){Object.assign(AUTH,s);}}catch(e){}
  if(!sbOn()){DB=load()||seed();migrate();booted=true;render();
    toast('ยังไม่ได้ตั้งค่าฐานข้อมูล — ใช้งานแบบเก็บในเครื่อง');return;}
  if(authed()){
    try{await sbGet('profiles?select=id&limit=1');}
    catch(e){if(!await refreshSession()){clearSession();loginScreen('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');return;}}
    await startApp();
  }else loginScreen();
}
window.addEventListener('hashchange',handleHash);
boot();

</script>
