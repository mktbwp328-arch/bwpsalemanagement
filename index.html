<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BWP Sales — ระบบจัดการงานขาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- ฟอนต์หน้าจอโหลดทันที ส่วนฟอนต์สำหรับพิมพ์เอกสารโหลดตอนเปิดหน้าพิมพ์ครั้งแรก -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --navy:#0b2a63; --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#eff5ff;
  --bg:#f4f6fb; --card:#fff; --bd:#e6ebf3; --bd2:#f1f5f9;
  --tx:#16233a; --mut:#5b6b83; --mut2:#94a3b8;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--tx);
  -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.55}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:250px;flex-shrink:0;background:var(--navy);color:#c7d7f5;display:flex;flex-direction:column;
  padding:20px 0 16px;position:sticky;top:0;height:100vh;overflow:auto;z-index:60}
.brand{display:flex;align-items:center;gap:11px;padding:0 18px 20px}
.mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(150deg,#4f9cf9,#123f9e);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;overflow:hidden;flex-shrink:0;cursor:pointer}
/* มีรูปโลโก้แล้วให้พื้นหลังโปร่ง กลืนกับแถบเมนู และไม่ครอบตัดรูป */
.mark img{width:100%;height:100%;object-fit:contain}
.mark.hasimg{background:none}
.navlabel{font-size:11px;color:#6d94d8;letter-spacing:.06em;padding:14px 20px 6px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:3px;padding:0 10px}
.nv{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:10px;font-size:15px;
  color:#c3d5f2;background:none;border:0;cursor:pointer;text-align:left;width:100%;min-height:46px}
.nv:hover{background:rgba(255,255,255,.09);color:#fff}
.nv.on{background:var(--blue);color:#fff;font-weight:600}
.nv .cnt{margin-left:auto;font-size:12px;background:rgba(255,255,255,.16);padding:2px 8px;border-radius:99px}
.nv.on .cnt{background:rgba(255,255,255,.25)}
.sub{display:flex;flex-direction:column;gap:2px;margin:4px 0 6px 24px;padding-left:12px;border-left:2px solid rgba(255,255,255,.15)}
.sv{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;font-size:14px;color:#a9c2e8;
  background:none;border:0;cursor:pointer;text-align:left;width:100%;min-height:40px}
.sv:hover{background:rgba(255,255,255,.08);color:#fff}
.sv.on{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.sv .cnt{margin-left:auto;font-size:11.5px;color:#8fb0e2}
.sv.on .cnt{color:#dbe9ff}
.backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:55}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{min-height:66px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;
  justify-content:space-between;padding:10px 22px;position:sticky;top:0;z-index:40;gap:14px;flex-wrap:wrap}
.ttl{display:flex;align-items:center;gap:12px;min-width:0}
.ttl h1{font-size:19px;font-weight:700;margin:0;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut2)}
.body{flex:1;padding:20px 22px 60px;display:flex;flex-direction:column;gap:16px;max-width:1500px;width:100%}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:0 1px 2px rgba(15,42,90,.04)}
.pad{padding:18px 20px}
.h3{font-size:16px;font-weight:600;margin:0 0 14px}
.mut{color:var(--mut);font-size:13.5px}
.tiny{font-size:12.5px;color:var(--mut2)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media(max-width:700px){.g4,.g3,.g2{grid-template-columns:1fr}}

.pill{font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:999px;display:inline-block;white-space:nowrap}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ic.s{width:17px;height:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;
  font-size:14.5px;font-weight:600;padding:0 18px;height:44px;border-radius:10px;border:1px solid var(--blue);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn:active{transform:translateY(1px)}
.btn.gh{background:#fff;color:#33445f;border-color:#d3ddec}
.btn.gh:hover{background:#f6f9ff;border-color:#a9c4f0;color:var(--blue-d)}
.btn.dg{background:#fff;color:#b91c1c;border-color:#fbcaca}
.btn.dg:hover{background:#fef2f2}
.btn.sm{height:36px;padding:0 13px;font-size:13.5px}
.btn.blk{width:100%}

.searchwrap{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #d3ddec;border-radius:10px;
  padding:0 13px;height:44px;flex:1;min-width:200px;max-width:440px;color:var(--mut2)}
.searchwrap:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.searchwrap input{border:0;background:none;outline:0;width:100%;color:var(--tx);height:100%}
.searchwrap .kbd{font-size:11px;border:1px solid #e2e8f0;border-radius:5px;padding:1px 6px;color:#a9b6c9}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13.5px;padding:8px 15px;border-radius:999px;color:#41546f;background:#fff;border:1px solid #dde5f0;cursor:pointer;min-height:38px}
.chip:hover{border-color:#a9c4f0;color:var(--blue-d)}
.chip.on{background:var(--blue-d);color:#fff;font-weight:600;border-color:var(--blue-d)}
.chip.clear{background:#fff5f5;color:#b91c1c;border-color:#fbcaca}

/* ---------- list rows (แทนตารางที่ล้นจอ) ---------- */
.list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:center;gap:14px;padding:15px 20px;border-bottom:1px solid var(--bd2);cursor:pointer;background:#fff}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:#f6f9ff}
.lrow.sel{background:var(--blue-l);box-shadow:inset 3px 0 0 var(--blue)}
.lav{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden;background:#e8f0fe;color:var(--blue-d)}
.lav img{width:100%;height:100%;object-fit:cover}
.lmain{flex:1;min-width:0}
.lt{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lm{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.lright{display:flex;align-items:center;gap:14px;flex-shrink:0}
.lamt{font-size:15px;font-weight:700;text-align:right;white-space:nowrap}
.lchev{color:#c3ccdb}
@media(max-width:640px){.lright{flex-direction:column;align-items:flex-end;gap:5px}.lchev{display:none}}

.empty{padding:56px 24px;text-align:center;color:var(--mut2)}
.empty .big{font-size:16px;color:var(--mut);margin-bottom:6px;font-weight:600}
.hint{color:#51678a;background:#f0f5ff;border:1px solid #dbe7fb;border-radius:10px;padding:10px 14px;font-size:13.5px;display:flex;gap:9px;align-items:center}

/* ---------- drawer ---------- */
.dr{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:94vw;background:#fff;z-index:90;
  box-shadow:-16px 0 44px rgba(15,42,90,.16);display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.dr header{padding:18px 20px;border-bottom:1px solid var(--bd2);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dr .db{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.dr footer{padding:14px 20px;border-top:1px solid var(--bd2);display:flex;gap:10px}
.drow{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--bd2);font-size:14px}
.drow:last-child{border-bottom:0}
.drow span{color:var(--mut);flex-shrink:0}
.drow b{text-align:right;font-weight:600;word-break:break-word}

/* ---------- forms ---------- */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal{background:#fff;border-radius:16px;width:100%;max-width:680px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 26px 64px rgba(15,42,90,.3)}
.modal header{padding:20px 24px 16px;border-bottom:1px solid var(--bd2);display:flex;align-items:center;justify-content:space-between}
.modal header b{font-size:18px}
.modal .mb{padding:20px 24px;overflow:auto}
.modal footer{padding:16px 24px;border-top:1px solid var(--bd2);display:flex;justify-content:flex-end;gap:10px;background:#fbfcfe}
.close{background:none;border:0;font-size:22px;color:var(--mut2);cursor:pointer;line-height:1;padding:4px 8px;border-radius:8px}
.close:hover{background:#f1f5f9;color:var(--tx)}
.fgroup{font-size:14px;font-weight:700;color:var(--tx);grid-column:1/-1;margin-top:10px;padding-top:14px;
  border-top:1px solid var(--bd2);display:flex;align-items:center;gap:9px}
.fgroup:first-child{margin-top:0;padding-top:0;border-top:0}
.fgroup .n{width:23px;height:23px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.fgroup .sub{font-weight:400;font-size:12.5px;color:var(--mut2)}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13.5px;color:#41546f;font-weight:500}
.field label .rq{color:#dc2626}
.field input,.field select,.field textarea{border:1px solid #d3ddec;border-radius:10px;padding:0 13px;height:46px;outline:0;background:#fff;width:100%}
.field textarea{height:auto;padding:12px 13px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.field .fh{font-size:12px;color:var(--mut2)}
.optrow{display:flex;flex-wrap:wrap;gap:9px}
.opt{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #d3ddec;border-radius:10px;
  padding:0 14px;height:44px;cursor:pointer;font-size:14.5px;color:#33445f}
.opt:hover{border-color:#a9c4f0}
.opt.on{border-color:var(--blue);background:#eff5ff;color:var(--blue-d);font-weight:600}
.opt .bx{width:20px;height:20px;border:1.5px solid #c3cfe0;border-radius:5px;display:inline-flex;
  align-items:center;justify-content:center;font-size:13px;background:#fff;color:var(--blue-d);flex-shrink:0}
.opt.on .bx{border-color:var(--blue);background:var(--blue);color:#fff}
.ppl{display:flex;flex-direction:column;gap:9px}
.pplrow{display:grid;grid-template-columns:210px minmax(0,1fr);gap:10px;align-items:center}
.pplrow>span{font-size:13.5px;color:#41546f}
.pplrow input{height:44px;padding:0 12px;border:1px solid #d3ddec;border-radius:10px;outline:0;width:100%}
.pplrow input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
@media(max-width:780px){.pplrow{grid-template-columns:1fr;gap:5px}}
/* ---- การ์ดกรอกรายการสินค้าในฟอร์ม ---- */
.itbl{display:flex;flex-direction:column;gap:12px}
.itrow{border:1px solid var(--bd);border-radius:12px;padding:14px 16px 16px;background:#fbfcfe;position:relative;display:flex;flex-direction:column;gap:12px}
.itrow .ittop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.itrow .itno{font-size:12.5px;font-weight:700;color:var(--blue-d);background:#e7f0ff;border-radius:999px;padding:3px 12px}
.itl1{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px}
.itl2{display:grid;grid-template-columns:110px 130px 150px minmax(0,1fr);gap:12px;align-items:end}
/* ช่องเลือกรหัสสินค้าแบบพิมพ์ค้นหา */
.pcw{position:relative;min-width:0}
.pcw>input{width:100%}
.pcm{display:none;position:absolute;z-index:60;left:0;right:0;top:calc(100% + 4px);max-height:280px;overflow:auto;
  background:#fff;border:1px solid #cfdcef;border-radius:12px;box-shadow:0 14px 34px rgba(15,42,90,.16)}
.pcm.on{display:block}
.pci{padding:9px 12px;cursor:pointer;border-bottom:1px solid #f1f5fb}
.pci:last-child{border-bottom:0}
.pci:hover,.pci.on{background:#eff5ff}
.pci .cd{font-size:13.5px;font-weight:700;color:#0f2a5a;word-break:break-all}
.pci .nm{font-size:12.5px;color:#41546f;margin-top:2px}
.pci .mt{font-size:11.5px;color:#8798ae;margin-top:2px}
.pce{padding:10px 12px;font-size:12.5px;color:#6b7b93;background:#f8fafc}
.itf{display:flex;flex-direction:column;gap:6px;min-width:0}
.itf>span{font-size:12.5px;color:#41546f;font-weight:500}
.itrow input,.itrow select,.itrow textarea{height:44px;padding:0 12px;border:1px solid #d3ddec;border-radius:10px;
  width:100%;outline:0;background:#fff;font-size:14.5px}
.itrow textarea{height:auto;padding:11px 12px;resize:vertical;line-height:1.5;min-height:66px}
.itrow input:focus,.itrow select:focus,.itrow textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.13)}
.itrow .itamtbox{height:44px;display:flex;align-items:center;justify-content:flex-end;padding:0 13px;
  background:#eef4ff;border:1px solid #d7e4fb;border-radius:10px;font-weight:700;font-size:16px;color:var(--blue-d)}
.itrow .itdel{height:34px;padding:0 12px;border:1px solid #fbcaca;background:#fff;color:#b91c1c;border-radius:9px;
  cursor:pointer;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.itrow .itdel:hover{background:#fef2f2}
.itsum{display:flex;flex-direction:column;gap:9px;align-items:flex-end;border-top:2px solid var(--bd2);padding-top:14px;font-size:14.5px}
.itsum .rw{display:flex;gap:34px;align-items:baseline}
.itsum .rw b{width:150px;text-align:right}
@media(max-width:820px){
  .itl1,.itl2{grid-template-columns:1fr;gap:11px}
  .itl2{grid-template-columns:1fr 1fr}
  .itl2 .itamtwrap{grid-column:1/-1}
}

/* ---------- upload ---------- */
.drop{border:2px dashed #bfd3f5;background:#f6f9ff;border-radius:12px;padding:26px 16px;display:flex;
  flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer}
.drop:hover,.drop.hot{background:#e8f1ff;border-color:var(--blue)}
.thumbs{display:flex;gap:12px;flex-wrap:wrap}
.thumb{width:124px;border:1px solid #e2e8f0;border-radius:11px;overflow:hidden;position:relative;background:#f8fafc}
.thumb img{width:100%;height:90px;object-fit:cover;display:block;cursor:zoom-in}
.thumb .nm{font-size:11px;color:var(--mut);padding:6px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(15,23,42,.72);color:#fff;
  font-size:13px;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;line-height:1}
.x:hover{background:#ef4444}
.filerow{display:flex;align-items:center;gap:12px;border:1px solid #eaf0f8;border-radius:11px;padding:12px 14px}
.ftag{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0}
.lightbox{position:fixed;inset:0;background:rgba(15,23,42,.88);display:flex;align-items:center;justify-content:center;z-index:200;padding:34px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:12px}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);background:#101b2e;color:#fff;
  font-size:14px;padding:13px 18px;border-radius:11px;z-index:300;opacity:0;transition:opacity .2s,transform .2s;
  display:flex;align-items:center;gap:14px;box-shadow:0 12px 30px rgba(15,42,90,.3)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast button{background:none;border:0;color:#8ec0ff;font-weight:700;cursor:pointer;padding:0}

/* ---------- misc ---------- */
.tl{display:flex;gap:13px}
.tl .dot{display:flex;flex-direction:column;align-items:center}
.tl .dot i{width:12px;height:12px;border-radius:50%;background:var(--blue-d);margin-top:5px;flex-shrink:0}
.tl .dot s{width:2px;flex:1;background:#dbeafe}
.tl.pend .dot i{background:#fff;border:2px solid #cbd5e1}
.fl{display:flex;flex-direction:column;gap:4px}
.fl>span{font-size:12.5px;color:var(--mut2)}
.fl>b{font-size:14.5px;font-weight:600}
.burger{display:none;background:none;border:0;cursor:pointer;color:var(--mut);padding:6px}
@media(max-width:1023px){
  .side{position:fixed;left:-260px;transition:left .2s}
  .side.open{left:0}
  .backdrop.on{display:block}
  .burger{display:inline-flex}
  .body{padding:16px 14px 60px}
  .top{padding:10px 14px}
}
/* ---------- แบบฟอร์มพิมพ์ใบเสนอราคา (A4) ---------- */
.prevov{position:fixed;inset:0;background:#59647a;z-index:150;overflow:auto;padding:24px}
.prevbar{position:sticky;top:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;z-index:2}
.sheet{width:210mm;min-height:297mm;background:#fff;margin:0 auto;padding:12mm 12mm 10mm;
  font-family:'Sarabun','IBM Plex Sans Thai',sans-serif;color:#000;font-size:12px;line-height:1.5;
  box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;position:relative}
.sheet .sh-top{display:flex;align-items:flex-start;gap:10px}
.sheet .sh-logo{width:30mm;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.sheet .sh-logo img{max-width:100%;max-height:26mm}
.sheet .sh-mid{flex:1;text-align:center}
.sheet .sh-cert{width:40mm;flex-shrink:0;display:flex;align-items:flex-start;justify-content:flex-end}
.sheet .sh-cert img{max-width:100%;max-height:20mm}
.sheet .co-th{font-family:'Noto Serif Thai',serif;font-size:19px;font-weight:700;line-height:1.3}
.sheet .co-en{font-family:'Times New Roman',serif;font-size:15.5px;font-weight:700;letter-spacing:.3px}
.sheet .co-ad{font-size:12.5px;margin-top:3px}
.sheet .sh-title{font-family:'Noto Serif Thai',serif;font-size:16px;font-weight:700;text-align:center;margin:9px 0 8px}
.sheet .sh-info{display:flex;gap:14px;font-size:12px}
.sheet .sh-info .col{flex:1}
.sheet .kv{display:flex;gap:6px;margin-bottom:1px}
.sheet .kv .k{width:22mm;flex-shrink:0}
.sheet .kv .k.r{width:32mm}
.sheet .lead{margin:9px 0 7px;text-indent:12mm}
.sheet .itemswrap{flex:1;position:relative;min-height:34mm}
.sheet table.items{position:absolute;inset:0;width:100%;height:100%;border-collapse:collapse;table-layout:fixed}
.sheet table.items th{border:1px solid #000;padding:4px 6px;font-size:12px}
/* ช่องรายการสินค้าเป็นกล่องเปิด ไม่มีเส้นคั่นระหว่างแถว เหลือเส้นเดียวเหนือแถวสรุป */
.sheet table.items td{border-left:1px solid #000;border-right:1px solid #000;
  border-top:0;border-bottom:0;padding:4px 6px;vertical-align:top;font-size:12px}
.sheet table.items th{text-align:center;font-weight:400;height:9mm;vertical-align:middle}
/* ช่องตัวเลขแคบเท่าที่พอดี เหลือที่ให้ช่องรหัสสินค้า/รายละเอียดกว้างที่สุด */
.sheet table.items td.no{text-align:center;width:9mm}
.sheet table.items td.dt{font-family:'Courier New',monospace;font-size:11.5px;white-space:pre-line;
  word-break:break-word;padding-right:8px}
.sheet table.items td.qt{text-align:right;width:22mm}
.sheet table.items td.pr{text-align:right;width:20mm}
.sheet table.items td.am{text-align:right;width:24mm}
/* ตารางเป็น table-layout:fixed ความกว้างยึดจากแถวหัวตาราง จึงต้องกำหนดที่ th ด้วย */
.sheet table.items th:nth-child(1){width:9mm}
.sheet table.items th:nth-child(3){width:22mm}
.sheet table.items th:nth-child(4){width:20mm}
.sheet table.items th:nth-child(5){width:24mm}
/* แถวเปล่าดูดพื้นที่ว่างทั้งหมด แถวสรุปด้านล่างจึงเตี้ยเท่าที่จำเป็น */

.sheet table.items tr.sum td{height:7mm;padding:2px 8px;font-size:12px;vertical-align:middle;
  border-top:1px solid #000;border-bottom:1px solid #000}
.sheet table.items tr.sum .nt{text-align:left}
.sheet table.items tr.sum .lb{text-align:right;font-weight:600;white-space:nowrap}
.sheet table.items tr.sum .am{text-align:right}
.sheet table.items tr.tot .lb,.sheet table.items tr.tot .am{font-weight:700}
.sheet table.items tr.last td{height:auto}
.sheet .notes{margin-top:7px;font-size:12px;display:flex;gap:6px}
.sheet .notes .lbl{width:16mm;flex-shrink:0}

@media print{
  /* เอาโครงหน้าเว็บออกจากการพิมพ์จริง ๆ (ซ่อนแบบ visibility ยังกินพื้นที่ จึงเกิดหน้าว่างต่อท้าย) */
  .app,#toast,.backdrop,.ov{display:none!important}
  html,body{height:auto!important;min-height:0!important;margin:0!important;padding:0!important;
    background:#fff!important;overflow:visible!important}
  #layer{position:static!important}
  body *{visibility:hidden!important}
  .prevov,.prevov *{visibility:visible!important}
  .prevbar,.sheet .ph{display:none!important}
  .prevov{position:static!important;inset:auto!important;padding:0!important;margin:0!important;
    background:#fff!important;overflow:visible!important;display:block!important}
  /* ถ้ามีหน้าพรีวิวค้างอยู่หลายชั้น ให้พิมพ์เฉพาะชั้นบนสุด */
  .prevov:not(:last-of-type){display:none!important}
  /* บังคับ 1 แผ่น = 1 หน้ากระดาษพอดี กันหน้าว่างเกินตอนบันทึกเป็น PDF
     ใช้ 296.6mm แทน 297mm เพราะบางเบราว์เซอร์ปัดเศษขึ้นแล้วดันไปหน้าใหม่ */
  .sheet{box-shadow:none!important;margin:0!important;height:296.6mm!important;min-height:0!important;
    max-height:296.6mm!important;overflow:hidden!important;
    break-inside:avoid;page-break-inside:avoid;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .prevov>*:last-child{margin-bottom:0!important}
  @page{size:A4;margin:0}
}

<script>
/* ================= utils ================= */
const $=(s,r=document)=>r.querySelector(s);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* กรอง src ของรูปก่อนใส่ลง HTML — กันสคริปต์แฝงมากับข้อมูลจากลิงก์เซ็น/ฐานข้อมูล
   อนุญาตเฉพาะ data:image ที่เป็น base64 ล้วน กับชื่อไฟล์รูปในเครื่องเท่านั้น */
function imgSrc(s){
  if(typeof s!=='string')return '';
  const v=s.trim();
  if(/^data:image\/(png|jpeg|jpg|gif|webp|svg\+xml);base64,[A-Za-z0-9+/=]+$/.test(v))return v;
  if(/^[\w.\-]+\.(png|jpe?g|gif|webp|svg)$/i.test(v))return v;
  return '';
}
const uid=()=>Math.random().toString(36).slice(2,10);
const num=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const num0=n=>Number(n||0).toLocaleString('th-TH');
const today=()=>new Date().toISOString().slice(0,10);
function fmtDate(iso){const d=new Date(iso);if(!iso||isNaN(d))return '-';
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+(d.getFullYear()+543);}
function ago(iso){const d=new Date(iso);if(isNaN(d))return '';const day=Math.floor((Date.now()-d)/86400000);
  return day<=0?'วันนี้':day===1?'เมื่อวาน':day<30?day+' วันก่อน':fmtDate(iso);}
const initials=s=>String(s||'?').replace(/^(บริษัท|ห้างหุ้นส่วนจำกัด|หจก\.|คุณ)\s*/,'').trim().slice(0,2);

/* ================= status ================= */
const CUST_ST={'ใหม่':['#dbeafe','#1d4ed8'],'กำลังติดต่อ':['#cffafe','#0e7490'],'ส่งตัวอย่าง':['#ffe4e6','#be123c'],'ส่งใบเสนอราคา':['#fef3c7','#b45309'],'รอ PO':['#ede9fe','#6d28d9'],'ปิดการขาย':['#dcfce7','#15803d'],'ยกเลิก':['#fee2e2','#b91c1c']};

function custStatuses(){
  const out=Object.keys(CUST_ST);
  ((DB&&DB.customers)||[]).forEach(c=>{
    const s=String(c.status||'').trim();
    if(s&&out.indexOf(s)<0)out.push(s);});

function save(now){
  /* โหมดดูข้อมูลของคนอื่น: ห้ามเขียนทับข้อมูลตัวเองในเครื่อง และไม่ส่งขึ้นคลาวด์
     (ของเดิมเขียนลงเครื่อง ทำให้ดูเหมือนบันทึกได้ แต่พอรีเฟรชแล้วหาย) */
  if(booted&&readOnly()){setSync('readonly');return;}
  DB._t=Date.now();dirtySince=DB._t;                       /* ใช้เทียบว่าข้อมูลในเครื่องใหม่กว่าบนคลาวด์ไหม */
  try{localStorage.setItem(localKey(),JSON.stringify(DB));}
  catch(e){if(booted)toast('พื้นที่ในเครื่องเต็ม — ข้อมูลยังบันทึกขึ้นคลาวด์ตามปกติ');}
  if(!booted)return;
  if(!authed())return;
  syncPending=true;setSync('saving');
  clearTimeout(syncTimer);
  if(now)cloudSave();                    /* งานสำคัญ ส่งขึ้นคลาวด์ทันที ไม่รอหน่วงเวลา */
  else syncTimer=setTimeout(cloudSave,1500);
}
/* ข้อมูลใหญ่จนใกล้ขีดจำกัด — เสนอบีบอัดรูปให้ในคลิกเดียว (ถามครั้งเดียวต่อการเปิดเว็บ) */
let compressAsked=false;
function offerCompress(bytes){
  if(compressAsked||readOnly())return;
  compressAsked=true;
  askConfirm('รูปเยอะจนข้อมูลใหญ่เกินไป',
    'ตอนนี้ข้อมูลของคุณ '+Math.round(bytes/1024/1024*10)/10+' MB ซึ่งใกล้ขีดจำกัด 4.5 MB '
    +'ระบบบีบอัดรูปทั้งหมดให้เล็กลงได้โดยยังอ่านออกเหมือนเดิม',
    'บีบอัดให้เลย',async()=>{
      const before=blobBytes();
      let total=0;
      /* ไล่บีบอัดหลายรอบ แต่ละรอบเข้มขึ้น จนข้อมูลลงมาต่ำกว่า 3.5 MB */
      for(const cap of [200*1024,140*1024,90*1024,60*1024,40*1024]){
        toast('กำลังบีบอัดรูป… ('+Math.round(blobBytes()/1024/1024*10)/10+' MB)');
        const r=await compressAllImages(cap);
        total+=r.n;
        if(blobBytes()<3.5*1024*1024)break;
      }
      const after=blobBytes();
      if(!total){toast('รูปทั้งหมดเล็กที่สุดแล้ว — ต้องลบรูปที่ไม่ใช้ออกบ้าง');return;}
      save(true);render();
      const mb=n=>Math.round(n/1024/1024*10)/10;
      toast('บีบอัด '+total+' รูปแล้ว · '+mb(before)+' MB → '+mb(after)+' MB'
        +(after>4*1024*1024?' — ยังใหญ่อยู่ ควรลบรูปที่ไม่ใช้ออก':''));
    });
}
let lastSyncErr='',syncErrShown=false,retryTimer=null;
/* ---------- จัดบ้านให้อัตโนมัติ ----------
   เปิดเว็บแล้วถ้ายังมีรูปฝังอยู่ในข้อมูล จะบีบให้เล็กก่อน แล้วย้ายขึ้นที่เก็บไฟล์เอง
   ทำเงียบ ๆ เบื้องหลัง ผู้ใช้ไม่ต้องกดอะไร */
let autoTidyDone=false;
async function autoTidy(){
  if(autoTidyDone||!authed()||readOnly()||storageOK===false)return;
  const pend=allAttachments().filter(j=>j.data&&/^data:/.test(j.data));
  if(!pend.length)return;
  autoTidyDone=true;
  const before=blobBytes();
  toast('กำลังจัดเก็บรูป '+pend.length+' ไฟล์ให้เล็กลง…');
  try{
    await compressAllImages(IMG_MAX_BYTES);          /* 1) บีบรูปให้ไม่เกิน 200 KB */
    const r=await migrateToStorage((d,t)=>{           /* 2) ย้ายขึ้นที่เก็บไฟล์ */
      if(d===1||d%5===0||d===t)toast('กำลังย้ายรูปขึ้นคลาวด์ '+d+'/'+t+' …');});
    if(storageOK===false){                            /* ยังไม่ได้ติดตั้ง Storage: บีบอย่างเดียวพอ */
      save(true);render();
      toast('บีบรูปให้เล็กลงแล้ว · '+mbTxt(before)+' → '+mbTxt(blobBytes()));
      return;
    }
    save(true);render();
    if(r.done)toast('จัดเก็บรูปเรียบร้อย · '+mbTxt(before)+' → '+mbTxt(blobBytes()));
  }catch(e){autoTidyDone=false;}
}
const mbTxt=n=>(Math.round(n/1024/1024*10)/10)+' MB';
async function cloudSave(tries){
  if(readOnly())return;
  if(!authed()&&AUTH.refresh&&await refreshSession()){}   /* ต่ออายุเซสชันให้เองก่อน */
  if(!authed()){                      /* เซสชันหลุด: บอกให้เข้าระบบใหม่ ข้อมูลในเครื่องยังอยู่ */
    setSync('offline');lastSyncErr='เซสชันหมดอายุ ต้องเข้าระบบใหม่';
    if(!syncErrShown){syncErrShown=true;toast('เซสชันหมดอายุ — เข้าระบบใหม่เพื่อบันทึกงานขึ้นคลาวด์ (ข้อมูลยังอยู่ในเครื่อง)');}
    return;
  }
  syncPending=false;
  try{
    /* คลังรหัสสินค้าเก็บในตารางกลาง ไม่ต้องใส่มากับข้อมูลส่วนตัวของแต่ละคน */
    const mine=Object.assign({},DB);delete mine.products;
    const body=JSON.stringify({user_id:dataOwner(),data:mine,updated_at:new Date().toISOString()});
    if(body.length>4*1024*1024)offerCompress(body.length);
    await sbFetch('user_data?on_conflict=user_id',{method:'POST',
      headers:Object.assign(sbHeaders(),{Prefer:'resolution=merge-duplicates,return=minimal'}),body});
    lastSyncErr='';syncErrShown=false;
    setSync('saved');setTimeout(()=>{if(syncState==='saved'&&!syncPending)setSync('idle');},2500);
  }catch(e){
    lastSyncErr=e&&e.message||'ไม่ทราบสาเหตุ';
    setSync('offline');syncPending=true;
    const n=(+tries||0)+1;
    /* ลองใหม่ให้เองเรื่อย ๆ จนกว่าจะสำเร็จ ผู้ใช้ไม่ต้องกดอะไร
       เริ่มถี่ก่อน แล้วค่อยห่างขึ้นเป็นทุก 30 วินาที */
    clearTimeout(retryTimer);
    retryTimer=setTimeout(()=>cloudSave(n),Math.min(n*2500,30000));
    if(n<=3)return;
    if(syncErrShown)return;
    syncErrShown=true;
    if(/jwt|token|expired|401|unauthor/i.test(lastSyncErr)){
      toast('เซสชันหมดอายุ — กรุณาเข้าระบบใหม่ ข้อมูลยังอยู่ในเครื่องนี้ ไม่หาย');
      setTimeout(()=>loginScreen(),1200);
    }else{
      toast('บันทึกขึ้นคลาวด์ไม่สำเร็จ: '+lastSyncErr);
    }
  }
}

function pickFiles(accept,multiple,cb){const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multiple;i.onchange=()=>cb([...i.files]);i.click();}
/* ย่อรูปให้เล็กพอที่จะเก็บขึ้นคลาวด์ได้ แต่ยังอ่านตัวหนังสือในเอกสารออก
   ลดขนาดและคุณภาพทีละขั้นจนไฟล์ไม่เกินราว 220 KB ต่อรูป */
const IMG_MAX_BYTES=200*1024;   /* ไฟล์รูปที่เก็บ ต้องไม่เกิน 200 KB ต่อรูป */
function shrinkImage(img,maxSide,quality){
  let w=img.width||img.naturalWidth,h=img.height||img.naturalHeight;
  if(w>maxSide||h>maxSide){const s=maxSide/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,w,h);      /* พื้นขาว กันภาพโปร่งใสกลายเป็นดำ */
  g.drawImage(img,0,0,w,h);
  return c.toDataURL('image/jpeg',quality);
}
function fitImage(img,maxBytes){
  const cap=maxBytes||IMG_MAX_BYTES;
  const steps=[[1400,.72],[1200,.68],[1000,.62],[850,.56],[700,.5],[600,.45],[500,.4]];
  let out='';
  for(const [side,q] of steps){
    out=shrinkImage(img,side,q);
    if(out.length*0.75<=cap)return out;   /* base64 ยาวกว่าไบต์จริงราว 4/3 */
  }
  return out;
}
function readImage(file){
  return new Promise(res=>{const fr=new FileReader();
    fr.onload=()=>{const img=new Image();
      img.onload=()=>res({name:file.name,type:'image',size:file.size,
        data:fitImage(img),date:today()});
      img.onerror=()=>res(null);img.src=fr.result;};
    fr.readAsDataURL(file);});
}
/* บีบอัดรูปที่เก็บไว้แล้วให้เล็กลง (ใช้ตอนข้อมูลใหญ่เกินจะขึ้นคลาวด์) */
function recompress(dataUrl,maxBytes){
  return new Promise(res=>{
    if(!/^data:image\/(png|jpe?g|webp)/i.test(dataUrl||''))return res(null);
    const img=new Image();
    img.onload=()=>{const out=fitImage(img,maxBytes);res(out&&out.length<dataUrl.length?out:null);};
    img.onerror=()=>res(null);img.src=dataUrl;
  });
}

/* ---------- บีบไฟล์ PDF ที่เป็นรูปสแกน ----------
   ดึงรูปในแต่ละหน้าออกมา ย่อ แล้วประกอบเป็น PDF ใหม่
   ถ้าเป็น PDF ตัวหนังสือ (ย่อไม่ได้โดยไม่เสียความคมชัด) จะคืนค่าว่าง แล้วใช้ไฟล์เดิม */
function pdfJpegs(u8){
  let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));
  const out=[];
  const re=/\/Subtype\s*\/Image([\s\S]{0,600}?)stream\r?\n/g;
  let m;
  while(m=re.exec(s)){
    const hdr=m[1];
    if(!/\/DCTDecode/.test(hdr))continue;                 /* เอาเฉพาะรูป JPEG ในไฟล์ */
    if(/\/SMask|\/Mask/.test(hdr))continue;
    const w=+((hdr.match(/\/Width\s+(\d+)/)||[])[1]||0);
    const h=+((hdr.match(/\/Height\s+(\d+)/)||[])[1]||0);
    if(!w||!h)continue;
    const start=m.index+m[0].length;
    const end=s.indexOf('endstream',start);
    if(end<0)continue;
    let stop=end;
    while(stop>start&&(s.charCodeAt(stop-1)===10||s.charCodeAt(stop-1)===13))stop--;
    out.push({w,h,bytes:u8.subarray(start,stop)});
  }
  return out;
}
function jpegToCanvasBlob(bytes,maxSide,quality){
  return new Promise(res=>{
    const url=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));
    const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight;
      if(w>maxSide||h>maxSide){const sc=maxSide/Math.max(w,h);w=Math.round(w*sc);h=Math.round(h*sc);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>res(b?{blob:b,w:w,h:h}:null),'image/jpeg',quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(null);};
    img.src=url;
  });
}
/* ประกอบ PDF ใหม่จากรูปหน้าละ 1 รูป */
async function buildPdf(pages){
  const enc=new TextEncoder();
  const parts=[];let len=0;
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;return b;};
  const offs=[0];
  push('%PDF-1.4\n');
  const nPages=pages.length;
  const objCount=2+nPages*3;
  const kids=[];
  for(let i=0;i<nPages;i++)kids.push((3+i*3)+' 0 R');
  offs[1]=len;push('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
  offs[2]=len;push('2 0 obj\n<</Type/Pages/Kids['+kids.join(' ')+']/Count '+nPages+'>>\nendobj\n');
  for(let i=0;i<nPages;i++){
    const p=pages[i],n=3+i*3;
    /* ขนาดหน้าเป็น A4 กว้าง 595 pt สูงตามสัดส่วนรูป */
    const pw=595,ph=Math.round(595*p.h/p.w);
    offs[n]=len;
    push(n+' 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+pw+' '+ph+']'
      +'/Resources<</XObject<</Im0 '+(n+2)+' 0 R>>/ProcSet[/PDF/ImageC]>>'
      +'/Contents '+(n+1)+' 0 R>>\nendobj\n');
    const content='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q\n';
    offs[n+1]=len;
    push((n+1)+' 0 obj\n<</Length '+content.length+'>>\nstream\n'+content+'endstream\nendobj\n');
    const bytes=new Uint8Array(await p.blob.arrayBuffer());
    offs[n+2]=len;
    push((n+2)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+p.w+'/Height '+p.h
      +'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+bytes.length+'>>\nstream\n');
    push(bytes);push('\nendstream\nendobj\n');
  }
  const xref=len;
  let x='xref\n0 '+(objCount+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<=objCount;i++)x+=String(offs[i]||0).padStart(10,'0')+' 00000 n \n';
  x+='trailer\n<</Size '+(objCount+1)+'/Root 1 0 R>>\nstartxref\n'+xref+'\n%%EOF\n';
  push(x);
  const out=new Uint8Array(len);let o=0;
  parts.forEach(b=>{out.set(b,o);o+=b.length;});
  return new Blob([out],{type:'application/pdf'});
}
async function shrinkPdf(file,capBytes){
  const cap=capBytes||200*1024;
  if(file.size<=cap)return null;
  let u8;
  try{u8=new Uint8Array(await file.arrayBuffer());}catch(e){return null;}
  const imgs=pdfJpegs(u8);
  if(!imgs.length||imgs.length>30)return null;
  const imgBytes=imgs.reduce((a,b)=>a+b.bytes.length,0);
  if(imgBytes<file.size*0.5)return null;      /* ไม่ใช่ไฟล์สแกน — ปล่อยไว้เหมือนเดิม */
  const per=Math.max(30*1024,Math.floor(cap/imgs.length)-2048);
  for(const [side,q] of [[1700,.7],[1500,.62],[1300,.55],[1100,.48],[900,.42],[750,.36]]){
    const pages=[];
    for(const im of imgs){
      const r=await jpegToCanvasBlob(im.bytes,side,q);
      if(!r)return null;
      pages.push({blob:r.blob,w:r.w,h:r.h});
    }
    if(pages.every(p=>p.blob.size<=per)||side===750){
      const out=await buildPdf(pages);
      return out.size<file.size?out:null;
    }
  }
  return null;
}
async function readAny(file){
  if(file.type.startsWith('image/'))return readImage(file);
  let f=file;
  /* PDF ที่เป็นรูปสแกน: บีบให้ไม่เกิน 200 KB ก่อนเก็บ */
  if(/pdf$/i.test(file.type)||/\.pdf$/i.test(file.name||'')){
    try{
      const small=await shrinkPdf(file,IMG_MAX_BYTES);
      if(small){
        toast('บีบไฟล์ PDF จาก '+(file.size/1048576).toFixed(1)+' MB เหลือ '+(small.size/1024).toFixed(0)+' KB');
        f=new File([small],file.name,{type:'application/pdf'});
      }
    }catch(e){}
  }
  return {name:file.name,type:'file',size:f.size,data:null,date:today(),_file:f};
}
/* ส่งไฟล์ที่เพิ่งเลือกขึ้นที่เก็บไฟล์ ถ้าส่งไม่ได้ก็เก็บฝังในข้อมูลแบบเดิมไปก่อน */
function fileToDataUrl(f){
  return new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res(null);fr.readAsDataURL(f);});
}
async function toStorage(rec){
  if(!rec)return rec;
  const raw=rec._file;
  if(authed()&&storageOK!==false){
    try{
      const blob=raw||b64ToBlob(rec.data);
      if(blob){
        const nameExt=(rec.name||'').split('.').pop();
        const ext=((String(blob.type).split('/')[1]||nameExt||'bin')+'').replace('jpeg','jpg').split('+')[0].slice(0,8);
        rec.path=await stUpload(blob,ext);
        rec.bytes=blob.size;delete rec.data;delete rec._file;
        return rec;
      }
    }catch(e){}
  }
  /* ส่งขึ้นคลาวด์ไม่ได้ — เก็บฝังในข้อมูลแทน (จำกัด 3 MB เหมือนเดิม) */
  if(raw){
    delete rec._file;
    if(raw.size>3*1024*1024){toast('ไฟล์ใหญ่เกิน 3 MB และยังส่งขึ้นคลาวด์ไม่ได้ — เก็บเฉพาะชื่อไฟล์');return rec;}
    rec.data=await fileToDataUrl(raw);
  }
  return rec;
}

/* ---------- แบบพิมพ์ใบกำกับภาษี/ใบส่งของ/ใบแจ้งหนี้ ---------- */
function bahtText(n){
  n=Math.round((+n||0)*100)/100;
  const U=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const conv=s=>{let r='';const L=s.length;
    for(let i=0;i<L;i++){const dg=+s[i],pos=L-i-1;
      if(!dg)continue;
      if(pos===0&&dg===1&&L>1)r+='เอ็ด';
      else if(pos===1&&dg===2)r+='ยี่';
      else if(pos===1&&dg===1)r+='';
      else r+=U[dg];
      r+=P[pos];}
    return r;};
  const whole=s=>{let t='',x=s.replace(/^0+/,'')||'0';
    if(x==='0')return 'ศูนย์';
    while(x.length>6){t+=conv(x.slice(0,x.length-6))+'ล้าน';x=x.slice(-6);}
    return t+conv(x);};
  const [i,f]=n.toFixed(2).split('.');
  return whole(i)+'บาท'+(+f===0?'ถ้วน':whole(f)+'สตางค์');
}

/* โหลดฟอนต์เอกสารเมื่อเปิดหน้าพิมพ์ครั้งแรก (ไม่ถ่วงตอนเปิดแอป) */
let printFontsLoaded=false;
/* ---------- ย่อแผ่นเอกสารให้พอดี 1 หน้ากระดาษตอนสั่งพิมพ์ ----------
   ถ้าเนื้อหายาวเกิน A4 เล็กน้อย จะย่อลงพอดีแทนที่จะตัดทิ้งหรือขึ้นหน้าใหม่ */
const PAGE_MM=296.6, PX_PER_MM=96/25.4;
function fitSheetsToPage(){
  const max=PAGE_MM*PX_PER_MM;
  document.querySelectorAll('.prevov .sheet').forEach(s=>{
    s.style.zoom='';
    /* วัดความสูงจริงของเนื้อหา โดยปลดล็อกความสูงชั่วคราว
       (ตอนพิมพ์แผ่นถูกตรึงไว้ที่ 1 หน้า ถ้าไม่ปลดจะวัดได้เท่าเดิมเสมอ) */
    const keep=s.getAttribute('style')||'';
    s.style.setProperty('height','auto','important');
    s.style.setProperty('min-height','0','important');
    s.style.setProperty('max-height','none','important');
    s.style.setProperty('overflow','visible','important');
    const need=s.scrollHeight;
    s.setAttribute('style',keep);
    if(need>max+2){
      const k=Math.max(.55,(max-2)/need);
      s.style.zoom=k;
      /* ขยายกรอบกลับตามอัตราย่อ กระดาษจะยังเต็มหน้าเหมือนเดิม */
      s.style.setProperty('height',(PAGE_MM/k)+'mm','important');
      s.style.setProperty('max-height',(PAGE_MM/k)+'mm','important');
    }
  });
}
function unfitSheets(){document.querySelectorAll('.prevov .sheet').forEach(s=>{
  s.style.zoom='';s.style.removeProperty('height');s.style.removeProperty('max-height');});}
window.addEventListener('beforeprint',fitSheetsToPage);
window.addEventListener('afterprint',unfitSheets);
/* เผื่อเบราว์เซอร์ที่ไม่รองรับ beforeprint (Safari รุ่นเก่า) ให้ย่อก่อนเรียกพิมพ์เลย */
function doPrint(){fitSheetsToPage();setTimeout(()=>{window.print();setTimeout(unfitSheets,400);},60);}

/* โดเมนภายในสำหรับล็อกอินด้วยชื่อผู้ใช้
   ใช้ .invalid ตาม RFC 2606 — เป็นโดเมนสงวนที่ไม่มีใครเป็นเจ้าของได้
   จึงไม่มีทางส่งอีเมลออกไปหาคนจริง (Supabase ไม่รับ .local) */
const USER_DOMAIN='bwp.invalid';
/* เบอร์โทร -> ตัวเลขล้วน (รับได้ทั้ง 081-234-5678, 081 234 5678, +66812345678) */
function normPhone(v){
  let s=String(v||'').replace(/[^\d+]/g,'');
  if(s.startsWith('+66'))s='0'+s.slice(3);
  else if(s.startsWith('66')&&s.length>=11)s='0'+s.slice(2);
  return s;
}
const isPhone=v=>/^0\d{8,9}$/.test(normPhone(v));
/* ตัวระบุตัวตน (เบอร์โทร หรือ ชื่อผู้ใช้) -> อีเมลภายในระบบ */
const toEmail=u=>{
  const v=String(u||'').trim();
  if(v.includes('@'))return v.toLowerCase();
  if(isPhone(v))return normPhone(v)+'@'+USER_DOMAIN;
  return v.toLowerCase().replace(/\s+/g,'')+'@'+USER_DOMAIN;
};
/* อีเมลภายใน -> สิ่งที่แสดงผล (เบอร์โทร/ชื่อผู้ใช้) */

    headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));

    const m=j.msg||j.message||j.error_description||j.error||('เข้าสู่ระบบไม่สำเร็จ ('+r.status+')');
    if(/invalid login/i.test(m))throw new Error('PIN ไม่ถูกต้อง');

    if(/signups? not allowed|disabled/i.test(m))throw new Error('ระบบปิดการสมัครเอง — ติดต่อผู้ดูแลให้สร้างบัญชีให้');

/* ---------- REST helper ---------- */
async function sbFetch(path,opt,retry){
  const c=sbCfg();
  const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/'+path,
    Object.assign({headers:sbHeaders()},opt||{}));
  if(r.status===401&&!retry&&AUTH.refresh){
    if(await refreshSession())return sbFetch(path,opt,true);
  }
  const txt=await r.text();
  if(!r.ok){let m=txt;try{m=JSON.parse(txt).message||txt;}catch(e){}throw new Error(m);}
  return txt?JSON.parse(txt):null;
}
const sbGet=p=>sbFetch(p,{method:'GET'});

async function sbRpc(fn,args){
  const c=sbCfg();
  const r=await fetch(c.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:sbHeaders(),body:JSON.stringify(args||{})});
  const txt=await r.text();
  if(!r.ok){
    let msg=txt;try{msg=JSON.parse(txt).message||txt;}catch(e){}
    if(/could not find the function|schema cache|does not exist/i.test(msg))
      throw new Error('ยังไม่ได้ติดตั้งส่วนนี้ในฐานข้อมูล — เปิด Supabase แล้วรัน '
        +(/doc_signature/.test(fn)?'supabase-setup-2.sql':'supabase-setup.sql')+' ก่อน');
    throw new Error(msg||('เชื่อมต่อไม่สำเร็จ ('+r.status+')'));
  }
  return txt?JSON.parse(txt):null;
}

function b64e(obj){return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(obj))));}
function b64d(s){return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));}

/* แผ่นเซ็น — ใช้ได้ทั้งเมาส์ ปากกา (stylus/Apple Pencil) และนิ้ว */
function signaturePad(){
  const wrap=el(`<div>
    <div style="position:relative;border:2px dashed #bfd3f5;border-radius:12px;background:#fff;overflow:hidden">
      <canvas style="width:100%;height:210px;display:block;touch-action:none;cursor:crosshair"></canvas>
      <div class="phz" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#a9b6c9;font-size:15px;pointer-events:none">เซ็นชื่อตรงนี้ — ใช้เมาส์ ปากกา หรือนิ้วได้</div>
      <div style="position:absolute;left:12%;right:12%;bottom:46px;border-bottom:1px solid #dbe3ef;pointer-events:none"></div>
    </div></div>`);
  const cv=wrap.querySelector('canvas'),ph=wrap.querySelector('.phz'),ctx=cv.getContext('2d');
  let drawing=false,dirty=false,last=null;
  function fit(){
    const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
    const img=dirty?ctx.getImageData(0,0,cv.width,cv.height):null;
    cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0b2a63';
    if(img)ctx.putImageData(img,0,0);
  }
  setTimeout(fit,30);
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
    drawing=true;dirty=true;ph.style.display='none';last=pos(e);
    ctx.lineWidth=e.pointerType==='pen'?Math.max(1.2,(e.pressure||.5)*3.4):2.2;
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(last.x+.1,last.y);ctx.stroke();});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();
    const p=pos(e);
    ctx.lineWidth=e.pointerType==='pen'?Math.max(1.2,(e.pressure||.5)*3.4):2.2;
    ctx.beginPath();ctx.moveTo(last.x,last.y);
    ctx.quadraticCurveTo(last.x,last.y,(last.x+p.x)/2,(last.y+p.y)/2);
    ctx.lineTo(p.x,p.y);ctx.stroke();last=p;});
  const stop=e=>{if(drawing){drawing=false;try{cv.releasePointerCapture(e.pointerId);}catch(_){}}};
  cv.addEventListener('pointerup',stop);cv.addEventListener('pointercancel',stop);cv.addEventListener('pointerleave',stop);
  return {
    el:wrap,
    isEmpty:()=>!dirty,
    clear(){ctx.clearRect(0,0,cv.width,cv.height);dirty=false;ph.style.display='flex';},
    /* ตัดขอบขาวออกแล้วย่อ เพื่อให้ไฟล์เล็ก */
    data(){
      if(!dirty)return null;
      const w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data;
      let x0=w,y0=h,x1=0,y1=0;
      for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(d[(y*w+x)*4+3]>12){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
      if(x1<x0)return null;
      const pad=8;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(w-1,x1+pad);y1=Math.min(h-1,y1+pad);
      const sw=x1-x0+1,sh=y1-y0+1,max=560,sc=Math.min(1,max/sw);
      const o=document.createElement('canvas');o.width=Math.round(sw*sc);o.height=Math.round(sh*sc);
      o.getContext('2d').drawImage(cv,x0,y0,sw,sh,0,0,o.width,o.height);
      return o.toDataURL('image/png');
    }};
}

function applySignature(b,silent){
  const d=DB.docs.find(x=>x.no===b.no&&x.type==='quotation');
  if(!d){if(!silent)toast('ไม่พบใบเสนอราคาเลขที่ '+b.no+' ในระบบนี้');return false;}
  if(b.ok){d.sigApprover={img:b.img,name:b.name,date:b.date};d.status='อนุมัติแล้ว';}
  else{d.sigApprover=null;d.status='ยกเลิก';d.rejectNote='ผู้บริหารไม่อนุมัติ '+fmtDate(b.date);}
  save();
  if(!silent){render();toast(b.ok?'รับลายเซ็นผู้บริหารแล้ว — อนุมัติเรียบร้อย':'บันทึกผล: ไม่อนุมัติ');}
  return true;
}

function applyCreditSigs(no,sigs,status,silent,type){
  const d=(type==='receipt'?DB.receipts:DB.docs).find(x=>x.no===no&&(type==='receipt'||x.type===(type||'credit')));
  if(!d)return false;
  ensureByType(Object.assign(d,{type:d.type||type}));
  /* รวมกับลายเซ็นที่เซ็นไว้ในเครื่อง ไม่ให้ของที่ยังไม่ทันขึ้นคลาวด์หายไป */
  d.sigs=Object.assign({},d.sigs||{},sigs||{});
  /* ใบขอตัวอย่าง: ดึงผลการพิจารณา/ข้อเสนอแนะที่ฝ่ายวิจัยกรอกมากับลายเซ็น */
  if(d.type==='sample'&&d.sigs.rd&&d.sigs.rd.note){
    try{const o=JSON.parse(d.sigs.rd.note);
      if(o&&typeof o==='object'){
        if(o.canMake)d.canMake=o.canMake;
        if(o.suggestion)d.suggestion=o.suggestion;}
    }catch(e){}
  }
  const isRc=d.type==='receipt'||DB.receipts.includes(d);
  if(status==='complete')d.status=isRc?d.status:'อนุมัติแล้ว';
  else if(status==='rejected')d.status='ยกเลิก';

}

/* ================= อ่านไฟล์ Excel / CSV ================= */
/* อ่าน .xlsx ได้เองโดยไม่ต้องใช้ไลบรารีภายนอก
   (.xlsx คือไฟล์ zip ที่มี xml อยู่ข้างใน ใช้ DecompressionStream ของเบราว์เซอร์คลายได้เลย) */
async function unzip(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf),files={};
  let eocd=-1;
  for(let i=u8.length-22;i>=0&&i>u8.length-66000;i--)
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  if(eocd<0)throw new Error('ไฟล์ไม่ใช่ Excel (.xlsx) ที่ถูกต้อง');
  const n=dv.getUint16(eocd+10,true);let off=dv.getUint32(eocd+16,true);
  for(let k=0;k<n;k++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),csize=dv.getUint32(off+20,true),
      nameLen=dv.getUint16(off+28,true),extraLen=dv.getUint16(off+30,true),
      cmtLen=dv.getUint16(off+32,true),lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(u8.slice(off+46,off+46+nameLen));
    const lNameLen=dv.getUint16(lho+26,true),lExtraLen=dv.getUint16(lho+28,true);
    const start=lho+30+lNameLen+lExtraLen;
    files[name]={method,bytes:u8.slice(start,start+csize)};
    off+=46+nameLen+extraLen+cmtLen;
  }
  const out={};
  for(const k in files){
    const f=files[k];
    if(f.method===0){out[k]=new TextDecoder().decode(f.bytes);continue;}
    const ds=new DecompressionStream('deflate-raw');
    const blob=new Blob([f.bytes]).stream().pipeThrough(ds);
    out[k]=await new Response(blob).text();
  }
  return out;
}
const colIdx=r=>{const m=String(r).match(/^[A-Z]+/);if(!m)return 0;
  let n=0;for(const c of m[0])n=n*26+(c.charCodeAt(0)-64);return n-1;};
/* คืนค่าเป็นรายการชีตทั้งหมด [{name, rows}] */
async function parseXLSX(buf){
  const zip=await unzip(buf);
  const dom=s=>new DOMParser().parseFromString(s,'application/xml');
  let shared=[];
  const ssKey=Object.keys(zip).find(k=>/sharedStrings\.xml$/i.test(k));
  if(ssKey)shared=[...dom(zip[ssKey]).getElementsByTagName('si')]
    .map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  /* หาชื่อชีตและลำดับที่ถูกต้องจาก workbook.xml + rels */
  let order=[];
  try{
    const wb=dom(zip['xl/workbook.xml']),rels=dom(zip['xl/_rels/workbook.xml.rels']);
    const map={};
    [...rels.getElementsByTagName('Relationship')].forEach(r=>{
      map[r.getAttribute('Id')]='xl/'+r.getAttribute('Target').replace(/^\/?xl\//,'');});
    order=[...wb.getElementsByTagName('sheet')].map(s=>({
      name:s.getAttribute('name'),
      key:map[s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')]
    })).filter(s=>s.key&&zip[s.key]);
  }catch(e){}
  if(!order.length)order=Object.keys(zip).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/i.test(k))
    .sort().map((k,i)=>({name:'ชีต '+(i+1),key:k}));
  if(!order.length)throw new Error('ไม่พบชีตข้อมูลในไฟล์');
  const readRows=key=>{
    const rows=[];
    [...dom(zip[key]).getElementsByTagName('row')].forEach(row=>{
      const arr=[];
      [...row.getElementsByTagName('c')].forEach(c=>{
        const i=colIdx(c.getAttribute('r')||''),t=c.getAttribute('t');
        let v='';
        if(t==='s'){const x=c.getElementsByTagName('v')[0];v=x?(shared[+x.textContent]||''):'';}
        else if(t==='inlineStr'){v=[...c.getElementsByTagName('t')].map(e=>e.textContent).join('');}
        else{const x=c.getElementsByTagName('v')[0];v=x?x.textContent:'';}
        arr[i]=String(v).trim();
      });
      rows.push(arr);
    });
    return rows.filter(r=>r.some(c=>c&&c.length));
  };
  return order.map(s=>({name:s.name,rows:readRows(s.key)}));
}
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const sep=(text.split('\n')[0].split(';').length>text.split('\n')[0].split(',').length)?';':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'&&text[i+1]==='"'){cur+='"';i++;}
      else if(ch==='"')q=false;
      else cur+=ch;
    }else if(ch==='"')q=true;
    else if(ch===sep){row.push(cur.trim());cur='';}
    else if(ch==='\n'){row.push(cur.trim());rows.push(row);row=[];cur='';}
    else if(ch!=='\r')cur+=ch;
  }
  if(cur||row.length){row.push(cur.trim());rows.push(row);}
  return rows.filter(r=>r.some(c=>c&&c.length));
}

  if(/\.csv$/i.test(file.name))return [{name:'CSV',rows:parseCSV(await file.text())}];
  if(/\.xlsx$/i.test(file.name))return parseXLSX(await file.arrayBuffer());
  throw new Error('รองรับเฉพาะไฟล์ .xlsx และ .csv — ถ้าเป็น .xls ให้เปิดใน Excel แล้ว Save As เป็น .xlsx ก่อน');
}

/* ---------- สร้างไฟล์ .xlsx เอง (zip แบบไม่บีบอัด) ---------- */
const CRC_T=(()=>{const t=new Int32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c;}
  return t;})();
function crc32(u8){let c=-1;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&0xff]^(c>>>8);return (c^-1)>>>0;}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name),body=enc.encode(f.data),crc=crc32(body);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,body.length,true);lh.setUint32(22,body.length,true);
    lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,body);
    const cd=new DataView(new ArrayBuffer(46));
    cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);
    cd.setUint16(8,0x0800,true);cd.setUint16(10,0,true);cd.setUint32(16,crc,true);
    cd.setUint32(20,body.length,true);cd.setUint32(24,body.length,true);
    cd.setUint16(28,nm.length,true);cd.setUint32(42,off,true);
    cen.push(new Uint8Array(cd.buffer),nm);
    off+=30+nm.length+body.length;
  });
  const cenLen=cen.reduce((a,b)=>a+b.length,0);
  const ed=new DataView(new ArrayBuffer(22));
  ed.setUint32(0,0x06054b50,true);ed.setUint16(8,files.length,true);ed.setUint16(10,files.length,true);
  ed.setUint32(12,cenLen,true);ed.setUint32(16,off,true);
  return new Blob(parts.concat(cen,[new Uint8Array(ed.buffer)]),
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const xCol=i=>{let s='',n=i+1;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=((n-m)/26)|0;}return s;};
function downloadXLSX(fname,rows,widths,sheetName){
  const body=rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>
    `<c r="${xCol(ci)}${ri+1}" t="inlineStr"><is><t xml:space="preserve">${xEsc(v)}</t></is></c>`).join('')+`</row>`).join('');
  const cols=widths?`<cols>${widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')}</cols>`:'';
  const files=[
    {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
</Types>`},
    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="${xEsc(sheetName||'ข้อมูล')}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
</Relationships>`},
    {name:'xl/worksheets/sheet1.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${cols}<sheetData>${body}</sheetData></worksheet>`}
  ];
  const a=document.createElement('a');a.href=URL.createObjectURL(makeZip(files));a.download=fname;
  document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

/* ================= คลังรหัสสินค้า =================
   เก็บรหัสสินค้าที่เคยใช้ ให้เลือกจากดรอปดาวน์ได้ ถ้าพิมพ์รหัสใหม่ก็เก็บเพิ่มอัตโนมัติ */
const prodKey=c=>String(c||'').trim().toLowerCase();
function allProducts(){return DB&&DB.products?DB.products:[];}
function findProduct(code){const k=prodKey(code);if(!k)return null;
  return allProducts().find(p=>prodKey(p.code)===k||prodKey(p.code2)===k)||null;}
/* ถ้าไม่มีชื่อสินค้า ประกอบชื่อจากหน้ากว้าง/ความหนาให้อ่านออก */
function prodName(p){
  if(!p)return '';
  if(p.name)return p.name;
  const w=p.width?String(p.width)+' '+(p.dimUnit||'cm'):'';
  const t=p.thick?(w?' x ':'')+String(p.thick)+' mc':'';
  return (w||t)?('PE SHRINK '+w+t).trim():'';
}
function prodMeta(p){
  return [p.code2&&prodKey(p.code2)!==prodKey(p.code)?'รหัสสินค้า '+p.code2:'',
    p.mat?'Mat '+p.mat:'',p.coreKg?'แกน '+p.coreKg+' kg':'',p.customer?'ลูกค้า '+p.customer:'']
    .filter(Boolean).join(' · ');
}
/* จำรหัสใหม่ที่พนักงานพิมพ์เอง เพื่อให้ครั้งต่อไปเลือกจากดรอปดาวน์ได้ */
function learnProduct(it){
  if(!it||!DB||!DB.products||readOnly())return false;
  const code=String(it.code||'').trim();
  if(!code||findProduct(code))return false;
  const p={code,code2:'',name:String(it.name||'').split('\n')[0].trim(),
    width:'',dimUnit:'',thick:'',mat:'',coreKg:'',customer:'',note:'',added:today(),auto:1};
  DB.products.push(p);
  /* ส่งเข้าคลังกลางให้ทุกคนเห็นด้วย ถ้าเน็ตมีปัญหาก็ยังใช้ในเครื่องได้ */
  productsPush([p]).catch(()=>{});
  return true;
}
function learnItems(items){
  let n=0;(items||[]).forEach(it=>{if(learnProduct(it))n++;});
  if(n)toast('เก็บรหัสสินค้าใหม่ '+n+' รายการเข้าคลังแล้ว');
  return n;
}
/* ---------- คลังสินค้ากลาง: ใช้ร่วมกันทุกคนในบริษัท ----------
   เก็บในตาราง products บนคลาวด์ ไม่ได้อยู่ในข้อมูลส่วนตัวของแต่ละคน
   ใครเพิ่มรหัสใหม่ คนอื่นเห็นทันทีที่เปิดแอปหรือกดโหลดใหม่ */
const PROD_COLS='id,code,code2,name,width,dim_unit,thick,mat,core_kg,customer,note,updated_at';
const rowToProd=r=>({id:r.id,code:r.code||'',code2:r.code2||'',name:r.name||'',width:r.width||'',
  dimUnit:r.dim_unit||'',thick:r.thick||'',mat:r.mat||'',coreKg:r.core_kg||'',
  customer:r.customer||'',note:r.note||''});
const prodToRow=p=>({code:String(p.code||'').trim(),code2:p.code2||'',name:p.name||'',width:String(p.width||''),
  dim_unit:p.dimUnit||'',thick:String(p.thick||''),mat:p.mat||'',core_kg:String(p.coreKg||''),
  customer:p.customer||'',note:p.note||''});
const PRODSYNC={at:null,err:null,busy:false,pending:0,src:''};
/* รายชื่อสินค้าที่มากับตัวเว็บ — แปลงมาจากไฟล์ Excel ของบริษัทไว้แล้ว
   ใช้เป็นค่าตั้งต้นเมื่อคลังกลางยังว่าง จะได้เลือกรหัสได้ทันทีโดยไม่ต้องกรอกอะไร */
let prodFileCache=null;
const PRODFILE_KEY='bwp_prodfile_v1';
async function productsFile(){
  if(prodFileCache)return prodFileCache;
  /* เก็บสำเนาไว้ในเครื่อง 7 วัน จะได้ไม่ต้องโหลดไฟล์ใหม่ทุกครั้งที่เปิดเว็บ */
  try{
    const c=JSON.parse(localStorage.getItem(PRODFILE_KEY)||'null');
    if(c&&c.at&&Date.now()-c.at<7*86400000&&Array.isArray(c.list)&&c.list.length)
      return (prodFileCache=c.list);
  }catch(e){}
  try{
    const r=await fetch('products.json');
    if(!r.ok)throw 0;
    const j=await r.json();
    prodFileCache=Array.isArray(j)?j.map(p=>Object.assign({code:'',code2:'',name:'',width:'',
      dimUnit:'',thick:'',mat:'',coreKg:'',customer:'',note:''},p)):[];
    try{localStorage.setItem(PRODFILE_KEY,JSON.stringify({at:Date.now(),list:prodFileCache}));}catch(e){}
  }catch(e){prodFileCache=[];}
  return prodFileCache;
}
const prodTableMissing=e=>/relation .*products|does not exist|schema cache/i.test(String(e&&e.message||e));

const PRODPULL_KEY='bwp_prodpull_v1';
/* ดึงคลังสินค้ากลาง — ถ้าเพิ่งดึงไปไม่นานและมีข้อมูลอยู่แล้ว ข้ามไปเลยเพื่อให้เปิดเว็บเร็ว
   (กดปุ่ม "โหลดใหม่" ในหน้าข้อมูลสินค้าเพื่อบังคับดึงใหม่ได้ทุกเมื่อ) */
async function productsPull(force){
  if(!authed())return false;
  if(!force&&allProducts().length){
    let last=0;try{last=+localStorage.getItem(PRODPULL_KEY)||0;}catch(e){}
    if(Date.now()-last<6*3600000){PRODSYNC.at=new Date(last).toISOString();PRODSYNC.src='cloud';return false;}
  }
  PRODSYNC.busy=true;PRODSYNC.err=null;
  try{
    const out=[];let from=0;
    for(;;){                                   /* PostgREST ส่งทีละ 1000 แถว ต้องวนดึงจนครบ */
      const part=await sbFetch('products?select='+PROD_COLS+'&order=code.asc',
        {method:'GET',headers:Object.assign(sbHeaders(),{Range:from+'-'+(from+999)})});
      if(!part||!part.length)break;
      out.push(...part);
      if(part.length<1000)break;
      from+=1000;
    }
    /* ถ้าคลังกลางยังว่างแต่ในเครื่องมีรหัสอยู่ (นำเข้าไว้ก่อนเปลี่ยนมาใช้คลังกลาง)
       เก็บของเดิมไว้ก่อน แล้วให้กดปุ่มส่งขึ้นคลังกลางเอง */
    if(out.length){
      DB.products=out.map(rowToProd);PRODSYNC.src='cloud';PRODSYNC.pending=0;
    }else{
      /* คลังกลางยังว่าง — ใช้รายชื่อสินค้าที่มากับตัวเว็บ (แปลงจากไฟล์ Excel ของบริษัท) */
      const base=await productsFile();
      DB.products=base.length?base:allProducts();
      PRODSYNC.src=base.length?'file':'';
      PRODSYNC.pending=DB.products.length;
    }
    PRODSYNC.at=new Date().toISOString();
    try{localStorage.setItem(PRODPULL_KEY,String(Date.now()));}catch(e){}
    try{localStorage.setItem(localKey(),JSON.stringify(DB));}catch(e){}
    return true;
  }catch(e){
    PRODSYNC.err=prodTableMissing(e)
      ? 'ยังไม่ได้ติดตั้งคลังสินค้ากลางในฐานข้อมูล — เปิด Supabase แล้วรันไฟล์ supabase-setup-6.sql ก่อน'
      : (e.message||'โหลดคลังสินค้าไม่สำเร็จ');
    return false;
  }finally{PRODSYNC.busy=false;}
}
/* ส่งรหัสขึ้นคลาวด์ ถ้าซ้ำให้ข้าม (ทีละ 300 แถว กันคำขอใหญ่เกิน) */
async function productsPush(list){
  if(!authed()||!list.length)return 0;
  let n=0;
  for(let i=0;i<list.length;i+=300){
    const body=JSON.stringify(list.slice(i,i+300).map(prodToRow));
    await sbFetch('products?on_conflict=code',{method:'POST',
      headers:Object.assign(sbHeaders(),{Prefer:'resolution=ignore-duplicates,return=minimal'}),body});
    n+=Math.min(300,list.length-i);
  }
  return n;
}
/* ช่องพิมพ์แล้วเลือกจากรายการสั้น ๆ ได้ (เช่น สถานะลูกค้า) พิมพ์ค่าใหม่เองก็ได้ */
function listCombo(input,options){
  const wrap=el('<div class="pcw"></div>');
  input.parentNode.insertBefore(wrap,input);wrap.append(input);
  const menu=el('<div class="pcm"></div>');wrap.append(menu);
  let list=[],idx=-1;
  const close=()=>{menu.classList.remove('on');idx=-1;};
  /* ตัวเลือกที่เขียนแบบ "เลขที่ · ชื่อลูกค้า" ให้เก็บเฉพาะเลขที่ */
  const pick=v=>{input.value=String(v).split(' · ')[0];close();
    input.dispatchEvent(new Event('change',{bubbles:true}));};
  const open=()=>{
    const q=String(input.value||'').trim().toLowerCase();
    const all=(typeof options==='function'?options():options)||[];
    list=q?all.filter(o=>String(o).toLowerCase().includes(q)):all.slice();
    idx=-1;
    menu.innerHTML=(list.length
      ? list.map((o,i)=>`<div class="pci" data-i="${i}"><div class="cd" style="font-weight:500">${esc(o)}</div></div>`).join('')
      : '')+(q&&!list.some(o=>String(o).toLowerCase()===q)
      ? `<div class="pce">กด Enter เพื่อใช้ "${esc(input.value.trim())}" เป็นค่าใหม่</div>`:'');
    menu.querySelectorAll('.pci').forEach(n=>{
      n.onmousedown=e=>{e.preventDefault();pick(list[+n.dataset.i]);};});
    menu.classList.add('on');
  };
  input.setAttribute('autocomplete','off');
  input.addEventListener('input',open);
  input.addEventListener('focus',open);
  input.addEventListener('blur',()=>setTimeout(close,150));
  input.addEventListener('keydown',e=>{
    if(!menu.classList.contains('on'))return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      if(!list.length)return;
      e.preventDefault();e.stopPropagation();
      idx=Math.max(0,Math.min(list.length-1,idx+(e.key==='ArrowDown'?1:-1)));
      menu.querySelectorAll('.pci').forEach((n,i)=>n.classList.toggle('on',i===idx));
    }else if(e.key==='Enter'){
      if(idx>=0&&list[idx]){e.preventDefault();e.stopPropagation();pick(list[idx]);}
      else close();
    }else if(e.key==='Escape'){e.stopPropagation();close();}
  });
  return wrap;
}
/* ช่องพิมพ์แล้วเลือกรหัสสินค้าได้ (combobox) — พิมพ์รหัสใหม่ก็ได้ */
function productCombo(input,onPick){
  const wrap=el('<div class="pcw"></div>');
  input.parentNode.insertBefore(wrap,input);wrap.append(input);
  const menu=el('<div class="pcm"></div>');wrap.append(menu);
  let list=[],idx=-1;
  const close=()=>{menu.classList.remove('on');idx=-1;};
  const pick=p=>{input.value=p.code;close();if(onPick)onPick(p);};
  const open=()=>{
    const all=allProducts(),q=prodKey(input.value);
    list=(q?all.filter(p=>prodKey(p.code).includes(q)||prodKey(p.code2).includes(q)
        ||String(prodName(p)).toLowerCase().includes(q)):all).slice(0,40);
    idx=-1;
    if(!all.length)menu.innerHTML='<div class="pce">ยังไม่มีรหัสสินค้าในคลัง — พิมพ์รหัสได้เลย ระบบจะเก็บให้ หรือไปเมนู "ข้อมูลสินค้า" เพื่อนำเข้าจาก Excel</div>';
    else if(!list.length)menu.innerHTML='<div class="pce">ไม่พบรหัสนี้ในคลัง — พิมพ์ต่อได้เลย ระบบจะเก็บเป็นรหัสใหม่ให้อัตโนมัติ</div>';
    else menu.innerHTML=list.map((p,i)=>`<div class="pci" data-i="${i}">
        <div class="cd">${esc(p.code)}</div>
        <div class="nm">${esc(prodName(p)||'—')}</div>
        ${prodMeta(p)?`<div class="mt">${esc(prodMeta(p))}</div>`:''}</div>`).join('')
      +(all.length>list.length?`<div class="pce">แสดง ${list.length} จาก ${all.length} รหัส — พิมพ์เพิ่มเพื่อค้นหาให้แคบลง</div>`:'');
    menu.querySelectorAll('.pci').forEach(n=>{
      n.onmousedown=e=>{e.preventDefault();pick(list[+n.dataset.i]);};});
    menu.classList.add('on');
  };
  input.setAttribute('autocomplete','off');
  input.addEventListener('input',open);
  input.addEventListener('focus',open);
  input.addEventListener('blur',()=>setTimeout(close,150));
  input.addEventListener('keydown',e=>{
    if(!menu.classList.contains('on'))return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      if(!list.length)return;
      e.preventDefault();e.stopPropagation();
      idx=Math.max(0,Math.min(list.length-1,idx+(e.key==='ArrowDown'?1:-1)));
      menu.querySelectorAll('.pci').forEach((n,i)=>n.classList.toggle('on',i===idx));
      const a=menu.querySelector('.pci.on');if(a)a.scrollIntoView({block:'nearest'});
    }else if(e.key==='Enter'&&idx>=0&&list[idx]){
      e.preventDefault();e.stopPropagation();pick(list[idx]);
    }else if(e.key==='Escape'){e.stopPropagation();close();}
  });
  return wrap;
}

/* ================= อ่านไฟล์ PO ของลูกค้า (PDF) แล้วกรอกให้อัตโนมัติ =================
   ใช้ตัวอ่าน PDF ที่เขียนเอง ไม่พึ่งไลบรารีภายนอก (นโยบายความปลอดภัยของเว็บบล็อกไว้)
   อ่านได้เฉพาะ PDF ที่เป็นข้อความจริง ถ้าเป็นรูปถ่าย/สแกนจะอ่านไม่ออก */
const bin=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return s;};
async function inflate(u8){
  for(const fmt of ['deflate','deflate-raw']){
    const parts=[];let len=0;
    /* ท้ายสตรีมใน PDF มักมีอักขระขึ้นบรรทัดติดมาด้วย ตัวคลายบีบจะฟ้อง error
       แต่ข้อมูลที่ถอดได้ก่อนหน้านั้นใช้ได้ครบแล้ว จึงเก็บส่วนที่ได้ไว้ */
    try{
      const rd=new Blob([u8]).stream().pipeThrough(new DecompressionStream(fmt)).getReader();
      for(;;){const {done,value}=await rd.read();if(done)break;parts.push(value);len+=value.length;}
    }catch(e){}
    if(len){
      const out=new Uint8Array(len);let off=0;
      parts.forEach(p=>{out.set(p,off);off+=p.length;});
      return out;
    }
  }
  return null;
}
async function pdfText(buf){
  const u8=new Uint8Array(buf),s=bin(u8);
  if(s.slice(0,5)!=='%PDF-')throw new Error('ไม่ใช่ไฟล์ PDF');
  /* หา object ทั้งหมด */
  const objs={};
  for(const m of s.matchAll(/(\d+)\s+\d+\s+obj\b/g)){
    const start=m.index+m[0].length,end=s.indexOf('endobj',start);
    objs[+m[1]]={dict:s.slice(start,Math.min(end,start+4000)),start,end};
  }
  const streamOf=async o=>{
    if(!o||o.start<0)return null;
    const i=s.indexOf('stream',o.start);
    if(i<0||i>o.end)return null;
    let p=i+6;if(s[p]==='\r')p++;if(s[p]==='\n')p++;
    const e=s.indexOf('endstream',p);
    const raw=u8.subarray(p,e);
    return /\/FlateDecode/.test(o.dict)?await inflate(raw):raw;
  };
  /* คลาย ObjStm เพื่อให้เห็น object ที่ถูกบีบไว้ */
  for(const [n,o] of Object.entries(objs)){
    if(!/\/ObjStm/.test(o.dict))continue;
    const d=await streamOf(o);if(!d)continue;
    const t=bin(d),first=+((o.dict.match(/\/First\s+(\d+)/)||[])[1]||0);
    const head=t.slice(0,first).trim().split(/\s+/).map(Number);
    for(let i=0;i<head.length;i+=2){
      const num=head[i],off=head[i+1];
      const end=(i+3<head.length)?first+head[i+3]:t.length;
      if(!objs[num])objs[num]={dict:t.slice(first+off,end),start:-1,end:-1};
    }
  }
  /* ตาราง ToUnicode ของแต่ละฟอนต์ */
  const cmapOf=txt=>{
    const map={};
    for(const blk of txt.match(/beginbfchar([\s\S]*?)endbfchar/g)||[])
      for(const m of blk.matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g))
        map[parseInt(m[1],16)]=String.fromCharCode.apply(null,(m[2].match(/.{4}/g)||[]).map(x=>parseInt(x,16)));
    for(const blk of txt.match(/beginbfrange([\s\S]*?)endbfrange/g)||[])
      for(const m of blk.matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g)){
        const a=parseInt(m[1],16),b=parseInt(m[2],16),c=parseInt(m[3],16);
        for(let i=a;i<=b&&i-a<20000;i++)map[i]=String.fromCharCode(c+i-a);
      }
    return map;
  };
  const uni={};
  for(const [n,o] of Object.entries(objs)){
    const m=o.dict.match(/\/ToUnicode\s+(\d+)\s+0\s+R/);
    if(!m||!objs[+m[1]])continue;
    const d=await streamOf(objs[+m[1]]);if(!d)continue;
    uni[n]=cmapOf(bin(d));
  }
  const fontRes={};
  Object.values(objs).forEach(o=>{
    const fm=o.dict.match(/\/Font\s*<<([^>]*)>>/);
    if(!fm)return;
    for(const g of fm[1].matchAll(/\/(F\d+)\s+(\d+)\s+0\s+R/g))fontRes[g[1]]=g[2];
  });
  let content='';
  for(const o of Object.values(objs)){
    const d=await streamOf(o);if(!d)continue;
    const t=bin(d);
    if((t.match(/TJ|Tj/g)||[]).length>10)content+=t+'\n';
  }
  if(!content)return '';
  const ESC={n:'\n',r:'\r',t:'\t',b:'\b',f:'\f'};
  const unesc=x=>x.replace(/\\([0-7]{1,3})/g,(m,o)=>String.fromCharCode(parseInt(o,8)))
                  .replace(/\\(.)/g,(m,c)=>ESC[c]!==undefined?ESC[c]:c);
  const dec=(str,font)=>{
    const cm=uni[fontRes[font]];
    if(!cm)return str;
    let out='';
    for(let i=0;i+1<str.length;i+=2){
      const c=(str.charCodeAt(i)<<8)|str.charCodeAt(i+1);
      out+=cm[c]!==undefined?cm[c]:'';
    }
    return out;
  };
  let font='F1',out=[],line='';
  const re=/\/(F\d+)\s+[\d.]+\s+Tf|\[((?:[^\][\\]|\\.)*)\]\s*TJ|\(((?:[^()\\]|\\.)*)\)\s*Tj|(T\*|Td|TD|ET)/g;
  let m;
  while(m=re.exec(content)){
    if(m[1]){font=m[1];continue;}
    if(m[2]!==undefined){
      let txt='';
      for(const g of m[2].matchAll(/\(((?:[^()\\]|\\.)*)\)|(-?[\d.]+)/g)){
        if(g[1]!==undefined)txt+=dec(unesc(g[1]),font);
        else if(+g[2]<-150)txt+=' ';
      }
      line+=txt;continue;
    }
    if(m[3]!==undefined){line+=dec(unesc(m[3]),font);continue;}
    if(m[4]){if(line.trim())out.push(line.trim());line='';}
  }
  if(line.trim())out.push(line.trim());
  return out.join('\n');
}
/* ---------- แปลงข้อความจาก PO เป็นข้อมูลกรอกฟอร์ม ---------- */
const MONS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseAnyDate(str){
  const s=String(str||'').trim();
  let m=s.match(/(\d{1,2})[-\/\s]([A-Za-z]{3,})[-\/\s](\d{2,4})/);
  if(m){
    const mo=MONS[m[2].slice(0,3).toLowerCase()];
    if(mo!==undefined){
      let y=+m[3];if(y<100)y+=2500;               /* 69 = 2569 */
      if(y>2400)y-=543;                            /* พ.ศ. -> ค.ศ. */
      return new Date(Date.UTC(y,mo,+m[1])).toISOString().slice(0,10);
    }
  }
  m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);
  if(m){
    let y=+m[3];if(y<100)y+=2500;
    if(y>2400)y-=543;
    return new Date(Date.UTC(y,+m[2]-1,+m[1])).toISOString().slice(0,10);
  }
  return '';
}
const numOf=s=>{const m=String(s||'').replace(/,/g,'').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):0;};
function parsePO(text){
  const lines=String(text||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const all=lines.join('\n'),flat=lines.join(' ');
  const r={custPoNo:'',date:'',dueDate:'',customer:'',payment:'',items:[],total:0,lines};

  /* เลขที่ PO */
  let m=all.match(/\b((?:PO|P\/O|PR)[-\s]?[A-Z0-9][A-Z0-9\-\/]{3,})/i);
  if(m)r.custPoNo=m[1].replace(/\s+/g,'');
  if(!r.custPoNo){
    m=all.match(/(?:เลขที่|เลขที|No\.?|Number)\s*[:：]?\s*([A-Z0-9][A-Z0-9\-\/]{4,})/i);
    if(m)r.custPoNo=m[1];
  }
  /* วันที่ */
  for(const l of lines){const d=parseAnyDate(l);if(d){r.date=d;break;}}
  m=all.match(/(?:กำหนดส่ง|Delivery|Due|Ship(?:ping)?\s*Date)[^\n]{0,30}/i);
  if(m)r.dueDate=parseAnyDate(m[0]);
  /* เงื่อนไขการชำระเงิน */
  m=all.match(/(?:Credit|Crdit|Term|เครดิต)[^\n]{0,30}?(\d{2,3})\s*(?:days|วัน)/i);
  if(m)r.payment='เครดิต '+m[1]+' วัน';
  else if(/เงินสด|\bcash\b/i.test(flat))r.payment='เงินสด';
  /* ลูกค้า: หาชื่อที่ตรงกับรายชื่อลูกค้าในระบบก่อน */
  const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9ก-๙]/g,'');
  const flatN=norm(flat);
  let best=null;
  (DB.customers||[]).forEach(c=>{
    const n=norm(c.name);
    if(n.length>=4&&flatN.includes(n)&&(!best||n.length>norm(best).length))best=c.name;
  });
  if(!best){
    /* ชื่อบริษัทภาษาอังกฤษที่โผล่ในไฟล์ (มักเป็นผู้ออก PO) */
    const co=lines.find(l=>/co\.?,?\s*ltd|company|limited|จำกัด/i.test(l)&&l.length>10
      &&!/best\s*world|เบสท์เวิลด์/i.test(l));
    if(co)best=co.replace(/\s+/g,' ').trim();
  }
  r.customer=best||'';
  /* ยอดรวม */
  m=all.match(/Total[^\d]{0,20}([\d,]+(?:\.\d+)?)/i)||all.match(/รวมทั้งสิ้น[^\d]{0,20}([\d,]+(?:\.\d+)?)/);
  if(m)r.total=numOf(m[1]);

  /* รายการสินค้า: จับคู่บรรทัดคำอธิบาย + จำนวน + ราคา/หน่วย */
  const qtyIdx=[],priceIdx=[],descIdx=[];
  lines.forEach((l,i)=>{
    if(/^[\d,]+(\.\d+)?\s*(kg|kgs|กก\.?|ม้วน|roll|rolls|pcs|ชิ้น|ใบ|กล่อง|ถุง|แผ่น|ตัน|เมตร|m)\b/i.test(l))qtyIdx.push(i);
    if(/(?:THB|บาท|฿)?\s*[\d,]+(?:\.\d+)?\s*(?:THB|บาท)?\s*\/\s*(kg|kgs|กก\.?|ม้วน|roll|pcs|ชิ้น|ใบ|กล่อง|m|เมตร)\b/i.test(l))priceIdx.push(i);
    if(/[A-Za-z]{4,}/.test(l)&&/(film|shrink|ฟิล์ม|bag|ถุง|sheet|micron|mic\b|pe\b|ldpe|hdpe)/i.test(l)
       &&!/^(description|no\.?|quantity|unit|amount|total)$/i.test(l))descIdx.push(i);
  });
  const n=Math.max(qtyIdx.length,priceIdx.length,descIdx.length);
  for(let i=0;i<n;i++){
    const q=qtyIdx[i]!==undefined?lines[qtyIdx[i]]:'';
    const p=priceIdx[i]!==undefined?lines[priceIdx[i]]:'';
    let d=descIdx[i]!==undefined?lines[descIdx[i]]:'';
    /* บรรทัดถัดไปที่สั้น ๆ มักเป็นรายละเอียดต่อ เช่น (AB) */
    if(descIdx[i]!==undefined){
      const nx=lines[descIdx[i]+1]||'';
      if(nx&&nx.length<=12&&/^[A-Za-z()\d\s\-]+$/.test(nx)&&!/^\d+$/.test(nx))d+=' ('+nx.replace(/[()]/g,'')+')';
    }
    const unitM=q.match(/(kg|kgs|กก\.?|ม้วน|roll|rolls|pcs|ชิ้น|ใบ|กล่อง|ถุง|แผ่น|ตัน|เมตร|m)\b/i);
    const unit=unitM?({kg:'กก.',kgs:'กก.',roll:'ม้วน',rolls:'ม้วน',pcs:'ชิ้น',m:'เมตร'}[unitM[1].toLowerCase()]||unitM[1]):'';
    const it={code:'',name:d.trim(),qty:numOf(q),unit:unit,price:numOf(p)};
    if(!it.qty&&!it.price&&!it.name)continue;
    /* เดารหัสสินค้าจากคลัง โดยเทียบคำในคำอธิบาย */
    it.code=guessProductCode(it.name,r.customer);
    r.items.push(it);
  }
  return r;
}
/* เดารหัสสินค้าจากคำอธิบายในใบ PO เทียบกับคลังรหัสสินค้า */
function guessProductCode(desc,customer){
  const d=String(desc||'').toLowerCase();
  if(!d)return '';
  const nums=(d.match(/\d+(?:[-.]\d+)?/g)||[]);
  let best='',score=0;
  allProducts().forEach(p=>{
    const t=(prodName(p)+' '+(p.code||'')).toLowerCase();
    let sc=0;
    nums.forEach(n=>{if(t.includes(n))sc+=2;});
    ['shrink','film','ldpe','hdpe','pe','bag','ab'].forEach(w=>{if(d.includes(w)&&t.includes(w))sc++;});
    if(customer&&p.customer&&String(p.customer).length>3
       &&customer.toLowerCase().includes(String(p.customer).toLowerCase().slice(0,4)))sc+=2;
    if(sc>score){score=sc;best=p.code;}
  });
  return score>=4?best:'';
}

/* อ่านไฟล์ PO แล้วเติมลงฟอร์มที่เปิดอยู่ */
async function autofillFromPO(file,ff,ctl){

  const r=parsePO(text);

  if(set('dueDate',r.dueDate))got.push('กำหนดส่ง '+fmtDate(r.dueDate));
  if(set('payment',r.payment))got.push('การชำระเงิน');

  if(r.items.length&&ctl&&ctl.items){
    const cur=ctl.items.value().filter(i=>i.name||i.code||i.qty||i.price);
    if(!cur.length){
      ctl.items.set(r.items);
      got.push(r.items.length+' รายการสินค้า');
    }
  }
  poReadReport(r,got,ff,ctl);
}

/* ================= ที่เก็บไฟล์บนคลาวด์ (Supabase Storage) =================
   เก็บรูปเป็นไฟล์จริง ข้อมูลหลักเก็บแค่ที่อยู่ไฟล์ ทำให้ข้อมูลเล็กและเปิดเว็บเร็ว */
const BUCKET='attachments';
const TRANSPARENT_PX='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
let storageOK=null;                 /* null=ยังไม่รู้, true=ใช้ได้, false=ยังไม่ได้ติดตั้ง */
const signCache={};                 /* path -> {url,exp} */
const stUrl=p=>sbCfg().url.replace(/\/$/,'')+'/storage/v1'+p;
const stHead=extra=>{const c=sbCfg();
  return Object.assign({apikey:c.key,Authorization:'Bearer '+(AUTH.token||c.key)},extra||{});};
function b64ToBlob(dataUrl){
  const m=/^data:([^;]+);base64,(.*)$/.exec(dataUrl||'');
  if(!m)return null;
  const bin=atob(m[2]),u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return new Blob([u8],{type:m[1]});
}
async function stUpload(blob,ext){
  const path=dataOwner()+'/'+uid()+uid()+'.'+(ext||'jpg');
  const r=await fetch(stUrl('/object/'+BUCKET+'/'+path),{method:'POST',
    headers:stHead({'Content-Type':blob.type||'application/octet-stream','x-upsert':'true'}),body:blob});
  if(!r.ok){
    const t=await r.text().catch(()=>'');
    if(/bucket not found|not found/i.test(t)){storageOK=false;
      throw new Error('ยังไม่ได้ติดตั้งที่เก็บไฟล์ — ให้ผู้ดูแลรัน supabase-setup-9.sql');}
    throw new Error(t||('อัปโหลดไม่สำเร็จ ('+r.status+')'));
  }
  storageOK=true;
  return path;
}
async function stSign(path){
  const hit=signCache[path];
  if(hit&&hit.exp>Date.now()+60000)return hit.url;
  const r=await fetch(stUrl('/object/sign/'+BUCKET+'/'+path),{method:'POST',
    headers:stHead({'Content-Type':'application/json'}),body:JSON.stringify({expiresIn:3600})});
  if(!r.ok)throw new Error('เปิดไฟล์ไม่ได้ ('+r.status+')');
  const j=await r.json();
  const url=stUrl(String(j.signedURL||j.signedUrl||'').replace(/^\/storage\/v1/,''));
  signCache[path]={url,exp:Date.now()+3500*1000};
  return url;
}
async function stDelete(path){
  try{await fetch(stUrl('/object/'+BUCKET+'/'+path),{method:'DELETE',headers:stHead()});}catch(e){}
}
/* ใส่รูปลงแท็ก img — ถ้าเป็นไฟล์บนคลาวด์จะขอลิงก์ชั่วคราวให้เอง */
function paintImg(node,item){
  if(!node||!item)return node;
  if(item.data){node.src=imgSrc(item.data);return node;}
  if(!item.path)return node;
  node.src=TRANSPARENT_PX;
  stSign(item.path).then(u=>{node.src=u;}).catch(()=>{node.alt='เปิดรูปไม่ได้';});
  return node;
}
/* ย้ายรูปที่ฝังอยู่ในข้อมูลขึ้นที่เก็บไฟล์ ทำครั้งเดียวต่อบัญชี */
function allAttachments(){
  const out=[];
  const add=a=>(a||[]).forEach(x=>{if(x)out.push(x);});
  (DB.customers||[]).forEach(c=>{add(c.photos);add(c.files);});
  (DB.pos||[]).forEach(p=>{add(p.images);add(p.files);});
  (DB.receipts||[]).forEach(r=>{add(r.photos);add(r.files);});
  (DB.docs||[]).forEach(d=>{add(d.photos);add(d.files);});
  return out;
}
async function migrateToStorage(onProgress){
  const todo=allAttachments().filter(j=>j.data&&/^data:/.test(j.data));
  let done=0,failed=0;
  for(const j of todo){
    try{
      const blob=b64ToBlob(j.data);
      if(!blob){failed++;continue;}
      const ext=(String(blob.type).split('/')[1]||'bin').replace('jpeg','jpg').split('+')[0];
      j.path=await stUpload(blob,ext);
      j.bytes=blob.size;delete j.data;
      done++;
    }catch(e){failed++;if(storageOK===false)break;}
    if(onProgress)onProgress(done,todo.length);
  }
  return {done,failed,total:todo.length};
}

function openForm(title,fields,values,onSubmit,opts){
