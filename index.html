      const row=w.querySelector('.optrow');
      (f.options||[]).forEach(o=>{
        const on=f.type==='checks'?cur.includes(o):cur===o;
        const b=el(`<button type="button" class="opt ${on?'on':''}" data-v="${esc(o)}">
          <span class="bx">${on?'✓':''}</span>${esc(o)}</button>`);
        b.onclick=()=>{
          if(f.type==='radio'){row.querySelectorAll('.opt').forEach(x=>{x.classList.remove('on');x.querySelector('.bx').textContent='';});
            b.classList.add('on');b.querySelector('.bx').textContent='✓';}
          else{const s=b.classList.toggle('on');b.querySelector('.bx').textContent=s?'✓':'';}};
        row.append(b);});
      custom[f.key]=()=>{
        const on=[...row.querySelectorAll('.opt.on')].map(x=>x.dataset.v);
        return f.type==='checks'?on:(on[0]||'');};
      ff.append(w);return;
    }
    if(f.type==='people'){
      const cur=values[f.key]||f.rolesDefault.map(r=>({role:r,name:''}));
      const w=el(`<div class="field" style="grid-column:1/-1"><label>${esc(f.label)}</label><div class="ppl"></div></div>`);
      const box=w.querySelector('.ppl');
      f.rolesDefault.forEach((role,i)=>{

        box.append(el(`<div class="pplrow"><span>${i+1}. ${esc(role)}</span>
          <input class="pname" data-role="${esc(role)}" placeholder="ชื่อ-นามสกุล" value="${esc(v.name||'')}">
          ${role==='อื่น ๆ (โปรดระบุตำแหน่ง)'?`<input class="ppos" placeholder="ระบุตำแหน่ง" value="${esc(v.pos||'')}">`:''}</div>`));

        prev.innerHTML='';

        if(imgs.length){
          const g=el('<div class="thumbs"></div>');

      w.append(dropZone(f.hint||'JPG, PNG, PDF · รูปจะถูกย่อขนาดอัตโนมัติ',async fs=>{

        paint();
        /* ไฟล์ PO เป็น PDF ข้อความ ให้ลองอ่านแล้วกรอกให้เลย */

        ${f.hint?`<div class="fh">${esc(f.hint)}</div>`:''}</div>`);

        <label>${esc(f.label)}${f.req?' <span class="rq">*</span>':''}</label>
        <input name="${f.key}" autocomplete="off" placeholder="พิมพ์รหัสหรือชื่อสินค้าเพื่อค้นหา" value="${esc(values[f.key]??f.def??'')}">
        <div class="fh">เลือกจากคลัง หรือพิมพ์รหัสใหม่ได้เลย ระบบจะเก็บเข้าคลังให้อัตโนมัติ</div></div>`);
      productCombo(w.querySelector('input'),p=>{
        const n=ff.querySelector('[name="name"]');
        if(n&&!n.value.trim())n.value=prodName(p);});
      ff.append(w);return;
    }
    const v=values[f.key]??f.def??'';
    let inp;
    if(f.type==='select')inp=`<select name="${f.key}">${(f.options||[]).map(o=>`<option value="${esc(o)}" ${String(o)===String(v)?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(f.type==='textarea')inp=`<textarea name="${f.key}" rows="3">${esc(v)}</textarea>`;

  });
  const close=()=>{ov.remove();document.removeEventListener('keydown',key);};
  const submit=()=>{
    /* กันบันทึกทับข้อมูลของคนอื่นตอนอยู่ในโหมดดูอย่างเดียว */
    if(readOnly()&&!opts.allowRO){
      toast('กำลังดูข้อมูลของ '+(AUTH.viewingName||'เพื่อนร่วมทีม')+' — บันทึกไม่ได้ กดเมนูผู้ใช้แล้วเลือก "กลับไปข้อมูลของฉัน" ก่อน');
      return;
    }
    const out={};let bad=null;
    Object.keys(custom).forEach(k=>out[k]=custom[k]());
    fields.filter(f=>!f.group&&!custom[f.key]).forEach(f=>{

    onSubmit(out);close();

  /* ไม่ปิดด้วย Esc — ฟอร์มกรอกข้อมูลต้องกดยกเลิกหรือกากบาทเท่านั้น กันข้อมูลที่พิมพ์ไว้หาย */
  const key=e=>{

  m.querySelector('.close').onclick=close;m.querySelector('#c').onclick=close;m.querySelector('#s').onclick=submit;

}

/* ---------- 1. DASHBOARD ---------- */
const PERIODS=[['30','30 วัน'],['90','90 วัน'],['year','รายปี'],['all','ทั้งหมด']];
function inPeriod(iso){const d=new Date(iso);if(isNaN(d))return false;const p=S.dash.period;
  if(p==='all')return true;if(p==='year')return d.getFullYear()===S.dash.year;
  return (Date.now()-d.getTime())/86400000<=parseInt(p,10);}
function dataYears(){const ys=new Set([new Date().getFullYear()]);
  [...DB.receipts,...DB.pos,...DB.docs].forEach(x=>{const d=new Date(x.date);if(!isNaN(d))ys.add(d.getFullYear());});
  return [...ys].sort((a,b)=>b-a);}
const poTotal=p=>(p.items||[]).reduce((a,i)=>a+i.qty*i.price,0);
const poGross=p=>poTotal(p)*1.07;

/* ================= สูตรยอดขาย: อ้างอิงจากใบเสร็จ =================
   ยอดขายจริง (รับรู้รายได้) = ใบเสร็จรับเงินที่ไม่ถูกยกเลิก — นับครั้งเดียว ไม่ซ้ำ
   PO และใบเสนอราคา = "ยอดในมือ" ที่ยังไม่ได้ออกใบเสร็จ แสดงแยกต่างหาก
   ใบเสร็จอ้างอิงได้ทั้งเลขที่ PO และเลขที่ใบเสนอราคา (ช่อง ref)
   ลูกค้าที่ซื้อโดยไม่มี PO จึงเข้ายอดขายได้ทันทีเมื่อออกใบเสร็จอ้างอิงใบเสนอราคา */
const rcRef=r=>r.poRef||'';
/* ทำดัชนีใบเสร็จไว้ครั้งเดียวต่อการเปลี่ยนข้อมูล เพื่อไม่ต้องไล่ทั้งกองซ้ำ ๆ
   (ตอนข้อมูลเยอะ ๆ ช่วยให้หน้าแรกเปิดเร็วขึ้นมาก) */
let _rcv=-1,_rci=null;
function rcIndex(){
  if(_rci&&_rcv===dirtySince&&_rci.n===DB.receipts.length)return _rci;
  const live=DB.receipts.filter(r=>r.status!=='ยกเลิก');
  const byRef=new Set(),byItem=new Set();
  live.forEach(r=>{const k=rcRef(r);if(k){byRef.add(k);if(r.poItemId)byItem.add(k+'|'+r.poItemId);}});
  _rci={live,byRef,byItem,n:DB.receipts.length};_rcv=dirtySince;
  return _rci;
}
const liveRc=()=>rcIndex().live;
/* ใบเสร็จออกตามรายการสินค้าใน PO — PO 1 ใบมีหลายรายการ ก็ออกได้หลายใบ
   (ลูกค้ามักขอแบ่งส่งทีละรายการ) */
const itemGross=it=>(+it.qty||0)*(+it.price||0)*1.07;
function itemHasReceipt(po,it){
  if(!it||!it.id)return false;
  return rcIndex().byItem.has(po.no+'|'+it.id);
}
function poItemsLeft(po){return (po.items||[]).filter(it=>!itemHasReceipt(po,it));}
function poHasReceipt(po){
  const items=po.items||[];
  /* PO ที่ยังไม่ได้ใส่รายการสินค้า ใช้เกณฑ์เดิมคือมีใบเสร็จอ้างอิงเลขที่ PO นี้ */
  if(!items.length)return rcIndex().byRef.has(po.no);
  if(items.some(it=>!it.id))return rcIndex().byRef.has(po.no);
  return poItemsLeft(po).length===0;
}
let _qv=-1,_qmap=null;
function quoteHasReceipt(q){
  if(!_qmap||_qv!==dirtySince){          /* จับคู่ใบเสนอราคา -> PO ไว้ล่วงหน้า */
    _qmap={};DB.pos.forEach(p=>{if(p.quoteRef)(_qmap[p.quoteRef]=_qmap[p.quoteRef]||[]).push(p.no);});
    _qv=dirtySince;
  }
  const idx=rcIndex();
  if(idx.byRef.has(q.no))return true;
  return (_qmap[q.no]||[]).some(no=>idx.byRef.has(no));
}
/* งานที่ปิดการขายแล้วแต่ยังไม่ได้ออกใบเสร็จ — ยังไม่นับเป็นยอดขาย */
function pending(){
  const out=[];
  DB.pos.filter(p=>p.status!=='ยกเลิก'&&!poHasReceipt(p)).forEach(p=>{
    const items=(p.items||[]).filter(it=>it.id);
    if(!items.length){
      out.push({src:'po',label:'PO',ref:p.no,customer:p.customer,date:p.date,amount:poGross(p),obj:p});
      return;
    }
    /* แยกทีละรายการ เพราะออกใบเสร็จตามรายการที่ส่งจริง */
    items.filter(it=>!itemHasReceipt(p,it)).forEach((it,i)=>
      out.push({src:'po',label:'PO · '+(String(it.name||'').split('\n')[0]||it.code||('รายการที่ '+(i+1))),
        ref:p.no,customer:p.customer,date:it.due||p.date,amount:itemGross(it),obj:p,item:it}));
  });
  DB.docs.filter(d=>d.type==='quotation'&&d.status==='อนุมัติแล้ว'
      &&!DB.pos.some(p=>p.status!=='ยกเลิก'&&p.quoteRef===d.no)&&!quoteHasReceipt(d))
    .forEach(d=>out.push({src:'quote',label:'ใบเสนอราคา (ไม่มี PO)',ref:d.no,customer:d.customer,date:d.date,amount:d.amount,obj:d}));
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}
/* ออกใบเสร็จจาก PO — ถ้ามีหลายรายการให้เลือกก่อนว่าจะออกของรายการไหน */
function issuePoReceipt(p,item){
  const items=(p.items||[]).filter(it=>it.id);
  const pre=it=>({customer:p.customer,poRef:p.no,poItemId:it?it.id:'',
    shipTo:p.ship||'',salesman:p.owner||'',
    amount:Math.round((it?itemGross(it):poGross(p))*100)/100,
    items:it?[{code:it.code||'',name:it.name||'',qty:it.qty||0,unit:it.unit||'',price:it.price||0}]
            :(p.items||[]).map(x=>({code:x.code||'',name:x.name||'',qty:x.qty||0,unit:x.unit||'',price:x.price||0}))});
  if(item)return issueReceipt(pre(item));
  const left=poItemsLeft(p);
  if(!items.length)return issueReceipt(pre(null));
  if(left.length===1)return issueReceipt(pre(left[0]));
  /* หลายรายการ: ให้เลือกว่าจะออกใบเสร็จของรายการไหน (แบ่งส่งทีละรายการ) */
  const ov=el('<div class="ov"></div>');
  const m=el(`<div class="modal" style="max-width:560px"><header><div><b>ออกใบเสร็จของรายการไหน</b>
      <div class="tiny" style="margin-top:2px">${esc(p.custPoNo||p.no)} · ${esc(p.customer)} · ออกใบเสร็จได้ทีละรายการตามที่ส่งจริง</div></div>
      <button class="close">✕</button></header><div class="mb"><div class="list"></div></div>
    <footer><button class="btn gh" id="all">ออกใบเดียวรวมทุกรายการ</button><div style="flex:1"></div>
      <button class="btn gh" id="c">ปิด</button></footer></div>`);
  const list=m.querySelector('.list');
  items.forEach((it,i)=>{
    const done=itemHasReceipt(p,it);
    const r=el(`<div class="lrow" ${done?'style="cursor:default;opacity:.55"':''}>
      <div class="lav">${done?'✓':i+1}</div>
      <div class="lmain"><div class="lt">${esc(String(it.name||'').split('\n')[0]||it.code||'-')}</div>
        <div class="lm">${esc(it.code||'-')} · ${num0(it.qty)} ${esc(it.unit||'')} × ${num(it.price)} ฿${it.due?' · ส่ง '+fmtDate(it.due):''}</div></div>
      <div class="lright"><div class="lamt">${num(itemGross(it))} ฿</div>
        ${done?'<span class="pill" style="background:#dcfce7;color:#15803d">ออกแล้ว</span>':''}</div></div>`);
    if(!done)r.onclick=()=>{ov.remove();issueReceipt(pre(it));};
    list.append(r);});
  m.querySelector('#all').onclick=()=>{ov.remove();issueReceipt(pre(null));};
  m.querySelector('.close').onclick=()=>ov.remove();m.querySelector('#c').onclick=()=>ov.remove();
  ov.append(m);$('#layer').append(ov);
}
/* ออกใบเสร็จจากใบเสนอราคา หรือ PO — เติมข้อมูลให้อัตโนมัติ */
function issueReceipt(pre){
  if(readOnly()){toast('กำลังดูข้อมูลของ '+(AUTH.viewingName||'เพื่อนร่วมทีม')+' — ออกใบเสร็จไม่ได้');return;}
  openForm('ออกใบเสร็จรับเงิน',rcFields(),Object.assign({
    no:'RC-'+(new Date().getFullYear()+543)+'-'+String(DB.receipts.length+67).padStart(4,'0'),
    date:today(),status:'รอชำระ'},pre),d=>{
    const r=Object.assign({id:uid(),photos:[],files:[]},d);DB.receipts.unshift(r);save(true);
    go('receipts',{rcFilter:'ทั้งหมด',rcQ:'',rcMonth:null});toast('ออกใบเสร็จแล้ว — ยอดเข้าแดชบอร์ดทันที');openRc(r);});
}

/* ================= สรุปตัวเลข ใช้ร่วมกันทั้งหน้าแรกและภาพรวมทีม =================
   withDB: สลับชุดข้อมูลชั่วคราวเพื่อคำนวณของเซลคนอื่น แล้วคืนค่าเดิมเสมอ */
function withDB(db,fn){const o=DB;DB=db;try{return fn();}finally{DB=o;}}

/* สินค้าที่ขายได้ — รวมจากรายการใน PO และใบเสนอราคาที่อนุมัติแล้วแต่ยังไม่มี PO */
function productStats(inP){
  const map={};
  const add=it=>{
    const name=String(it.name||'').trim()||'(ไม่ระบุชื่อสินค้า)';
    const k=name.toLowerCase();
    const e=map[k]||(map[k]={name,qty:0,unit:it.unit||'',amount:0,deals:0});
    e.qty+=(+it.qty||0);e.amount+=(+it.qty||0)*(+it.price||0);e.deals++;
    if(!e.unit&&it.unit)e.unit=it.unit;
  };
  DB.pos.filter(p=>p.status!=='ยกเลิก'&&inP(p.date)).forEach(p=>(p.items||[]).forEach(add));
  DB.docs.filter(d=>d.type==='quotation'&&d.status==='อนุมัติแล้ว'&&inP(d.date)
    &&!DB.pos.some(p=>p.status!=='ยกเลิก'&&p.quoteRef===d.no)).forEach(d=>(d.items||[]).forEach(add));
  return Object.values(map).sort((a,b)=>b.amount-a.amount);
}
/* ตัวเลขสรุปทั้งชุดของข้อมูลหนึ่งชุด (ของตัวเองหรือของเซลคนอื่น) */
function statsOf(db){
  return withDB(db,()=>{
    const rcs=liveRc().filter(r=>inPeriod(r.date));
    const pend=pending().filter(x=>inPeriod(x.date));
    const quotes=DB.docs.filter(d=>d.type==='quotation'&&inPeriod(d.date));
    const pos=DB.pos.filter(p=>p.status!=='ยกเลิก'&&inPeriod(p.date));
    const css=DB.customers.filter(c=>inPeriod(c.date));
    const yr=S.dash.period==='year'?S.dash.year:new Date().getFullYear();
    const months=Array(12).fill(0),cnts=Array(12).fill(0);
    liveRc().forEach(r=>{const d=new Date(r.date);
      if(!isNaN(d)&&d.getFullYear()===yr){months[d.getMonth()]+=r.amount;cnts[d.getMonth()]++;}});
    return {
      total:rcs.reduce((a,b)=>a+b.amount,0),
      paid:rcs.filter(r=>r.status==='ชำระแล้ว').reduce((a,b)=>a+b.amount,0),
      unpaid:rcs.filter(r=>r.status!=='ชำระแล้ว').reduce((a,b)=>a+b.amount,0),
      rcN:rcs.length,
      pendSum:pend.reduce((a,b)=>a+b.amount,0),pendN:pend.length,
      quoteN:quotes.length,quoteOk:quotes.filter(d=>d.status==='อนุมัติแล้ว').length,
      poN:pos.length,poSum:pos.reduce((a,b)=>a+poGross(b),0),
      custN:css.length,custWon:css.filter(c=>c.status==='ปิดการขาย').length,
      products:productStats(inPeriod),buyers:customerStats(inPeriod),months,cnts,year:yr};
  });
}
/* ลูกค้าแต่ละรายซื้อสินค้าอะไรไปบ้าง — รวมจากแหล่งเดียวกับสินค้าที่ขายได้ */
function customerStats(inP){
  const map={};
  const add=(cust,it)=>{
    const c=String(cust||'').trim()||'(ไม่ระบุลูกค้า)';
    const e=map[c]||(map[c]={customer:c,amount:0,deals:0,items:{}});
    const name=String(it.name||'').trim()||'(ไม่ระบุชื่อสินค้า)',k=name.toLowerCase();
    const p=e.items[k]||(e.items[k]={name,qty:0,unit:it.unit||'',amount:0});
    p.qty+=(+it.qty||0);p.amount+=(+it.qty||0)*(+it.price||0);
    if(!p.unit&&it.unit)p.unit=it.unit;
    e.amount+=(+it.qty||0)*(+it.price||0);
  };
  const doc=(cust,items)=>{
    if(!(items||[]).length)return;
    (items||[]).forEach(i=>add(cust,i));
    const c=String(cust||'').trim()||'(ไม่ระบุลูกค้า)';
    if(map[c])map[c].deals++;
  };
  DB.pos.filter(p=>p.status!=='ยกเลิก'&&inP(p.date)).forEach(p=>doc(p.customer,p.items));
  DB.docs.filter(d=>d.type==='quotation'&&d.status==='อนุมัติแล้ว'&&inP(d.date)
    &&!DB.pos.some(p=>p.status!=='ยกเลิก'&&p.quoteRef===d.no)).forEach(d=>doc(d.customer,d.items));
  return Object.values(map)
    .map(e=>Object.assign(e,{list:Object.values(e.items).sort((a,b)=>b.amount-a.amount)}))
    .sort((a,b)=>b.amount-a.amount);
}

function customerBuyModal(r){

      <div class="tiny" style="margin-top:2px">ซื้อ ${r.list.length} ชนิดสินค้า · ${r.deals} รายการ · รวม ${num0(Math.round(r.amount))} บาท</div></div>

/* รายการดีลที่มีสินค้าชิ้นนี้ — ใช้ตอนกดดูรายละเอียดสินค้า */
function productDeals(db,name){
  const key=String(name).toLowerCase(),hit=it=>String(it.name||'').trim().toLowerCase()===key;
  return withDB(db,()=>{
    const out=[];
    DB.pos.filter(p=>p.status!=='ยกเลิก'&&inPeriod(p.date)).forEach(p=>
      (p.items||[]).filter(hit).forEach(i=>out.push({label:'PO '+p.no,customer:p.customer,date:p.date,
        qty:+i.qty||0,unit:i.unit||'',amount:(+i.qty||0)*(+i.price||0)})));
    DB.docs.filter(d=>d.type==='quotation'&&d.status==='อนุมัติแล้ว'&&inPeriod(d.date)
      &&!DB.pos.some(p=>p.status!=='ยกเลิก'&&p.quoteRef===d.no)).forEach(d=>
      (d.items||[]).filter(hit).forEach(i=>out.push({label:'ใบเสนอราคา '+d.no,customer:d.customer,date:d.date,
        qty:+i.qty||0,unit:i.unit||'',amount:(+i.qty||0)*(+i.price||0)})));
    return out.sort((a,b)=>b.date.localeCompare(a.date));
  });
}

const TEAM={loaded:false,loading:false,err:null,people:[],at:null};
async function loadTeam(force){
  if(TEAM.loading)return;
  if(TEAM.loaded&&!force)return;
  TEAM.loading=true;TEAM.err=null;
  if(S.page==='team')render();
  try{
    const list=await sbRpc('team_list',{})||[];
    await empNames();                      /* ดึงชื่อจากทะเบียนพนักงานมาแสดงแทนเบอร์ */
    const me=AUTH.user.id;
    const all=[{id:me,name:(AUTH.profile&&AUTH.profile.name)||'ฉัน',
      email:(AUTH.profile&&AUTH.profile.email)||'',role:(AUTH.profile&&AUTH.profile.role)||'sales',mine:true}]
      .concat(list.filter(t=>t.id!==me).map(t=>Object.assign({},t,{mine:false})));
    const people=[];
    for(const t of all){
      let db=null;
      try{db=t.mine?DB:await cloudLoad(t.id);}catch(e){}
      if(db&&db.customers){try{withDB(db,migrate);}catch(e){}}
      people.push(Object.assign({},t,{db:db&&db.customers?db:null}));
    }
    TEAM.people=people;TEAM.loaded=true;TEAM.at=new Date().toISOString();

function guessProductHeader(rows){
  let best=0,bestScore=-1;
  rows.slice(0,12).forEach((r,i)=>{
    const filled=r.filter(c=>c&&c.length).length;
    if(filled<2)return;
    let score=filled;
    PRODUCT_FIELDS.forEach(f=>{
      if(r.some(c=>{const t=String(c||'').toLowerCase().replace(/\s/g,'');
        return t&&f.hint.some(h=>t.includes(h.toLowerCase().replace(/\s/g,'')));}))score+=4;});
    if(score>bestScore){bestScore=score;best=i;}});
  return best;
}

        const p={code,code2:'',name:'',width:'',dimUnit:'',thick:'',mat:'',coreKg:'',customer:'',note:''};
        PRODUCT_FIELDS.forEach(f=>{if(f.k!=='code'&&sel[f.k]!==undefined)p[f.k]=String(r[sel[f.k]]||'').trim();});
        fresh.push(p);});
      if(!fresh.length){toast('ไม่มีรหัสใหม่ให้นำเข้า · ซ้ำ '+dup+' · ข้าม '+skipped);return;}
      go.disabled=true;go.textContent='กำลังส่งขึ้นคลังกลาง '+fresh.length+' รหัส…';

      }

  };
  step1();
  ov.append(m);$('#layer').append(ov);

/* เดาว่าแถวไหนคือหัวตาราง — แถวที่ตรงกับชื่อช่องที่รู้จักมากที่สุด */
function guessHeaderRow(rows){
  let best=0,bestScore=-1;
  rows.slice(0,12).forEach((r,i)=>{
    const filled=r.filter(c=>c&&c.length).length;
    if(filled<2)return;
    let score=filled;
    IMPORT_FIELDS.forEach(f=>{
      if(r.some(c=>{const t=String(c||'').toLowerCase().replace(/\s/g,'');
        return t&&f.hint.some(h=>t.includes(h.toLowerCase()));}))score+=4;
    });
    if(score>bestScore){bestScore=score;best=i;}
  });
  return best;
}

function exportCustomers(){
  if(!DB.customers.length){toast('ยังไม่มีลูกค้าให้ส่งออก');return;}
  const rows=[IMPORT_FIELDS.map(f=>f.label).concat(['สถานะ','ช่องทาง','วันที่ติดต่อ'])];
  DB.customers.forEach(c=>rows.push(
    IMPORT_FIELDS.map(f=>c[f.k]||'').concat([c.status||'',c.channel||'',fmtDate(c.date)])));
  downloadFile('ลูกค้า_'+today()+'.csv',toCSV(rows));
  toast('ส่งออก '+DB.customers.length+' รายการแล้ว');
}

function pgCustomers(v){
  header('ลูกค้าติดต่อเข้ามา',['งานขาย']);
  actionBtn('เพิ่มลูกค้าใหม่','plus',()=>openForm('เพิ่มลูกค้าใหม่',customerFields(),{},d=>{
    const c=Object.assign({id:uid(),logo:null,photos:[],files:[],
      timeline:[{date:d.date||today(),title:'รับการติดต่อผ่าน '+d.channel,note:'',by:d.owner}]},d);
    DB.customers.unshift(c);save();render();toast('เพิ่มลูกค้าแล้ว');openCustomer(c);}));
  actionBtn('นำเข้า Excel','up',importCustomers,'btn gh');
  if(DB.customers.length)actionBtn('ส่งออก','dl',exportCustomers,'btn gh');

  v.append(hint('คลิกที่ชื่อลูกค้าเพื่อดูรายละเอียดและบันทึกว่าดำเนินการถึงไหนแล้ว'));

  const bar=el('<div class="toolbar"></div>');
  bar.append(searchRow(S.custQ,'ค้นหาชื่อ เบอร์โทร หรืออีเมล',q=>{S.custQ=q;render();}));
  v.append(bar);

  const chipItems=[['ทั้งหมด','ทั้งหมด ('+DB.customers.length+')'],
    ...custStatuses().map(k=>[k,k+' ('+DB.customers.filter(c=>c.status===k).length+')'])];
  let clear=null;
  if(S.custFilter!=='ทั้งหมด'||S.custQ){clear=el('<button class="chip clear">ล้างตัวกรอง ✕</button>');
    clear.onclick=()=>{S.custFilter='ทั้งหมด';S.custQ='';render();};}
  v.append(chipRow(chipItems,S.custFilter,k=>{S.custFilter=k;render();},clear));

  const q=S.custQ.toLowerCase();
  const items=DB.customers.filter(c=>(S.custFilter==='ทั้งหมด'||c.status===S.custFilter)&&
    (!q||[c.name,c.contact,c.phone,c.email].join(' ').toLowerCase().includes(q)));
  const cnt=el(`<div style="display:flex;align-items:center;gap:12px"><div class="tiny">พบ ${items.length} รายการ</div></div>`);
  if(items.length){
    const del=el(`<button class="btn dg sm">ลบ ${items.length} รายการที่แสดงอยู่</button>`);
    del.onclick=()=>askConfirm('ลบลูกค้าหลายรายการ',
      'ลบลูกค้า '+items.length+' รายการที่แสดงอยู่ตอนนี้ออกจากระบบ?','ลบทั้งหมด',()=>{
        const ids=new Set(items.map(x=>x.id));
        const backup=DB.customers.slice();
        DB.customers=DB.customers.filter(c=>!ids.has(c.id));
        save();render();
        toast('ลบ '+ids.size+' รายการแล้ว',()=>{DB.customers=backup;save();render();});
      });
    cnt.append(del);
  }
  v.append(cnt);
  v.append(listCard(items,{
    avatar:c=>c.logo?`<img src="${imgSrc(c.logo)}">`:esc(initials(c.name)),
    title:c=>esc(c.name),
    meta:c=>[esc(c.contact||'ไม่ระบุผู้ติดต่อ'),esc(c.phone||''),'ติดต่อ '+ago(c.date)].filter(Boolean).join(' · '),
    status:c=>pill(c.status,CUST_ST),
    isSel:c=>c.id===S.profSel,
    onOpen:openCustomer,
    empty:emptyState('ยังไม่มีลูกค้าในกลุ่มนี้','เพิ่มลูกค้ารายแรก หรือเปลี่ยนตัวกรองด้านบน','เพิ่มลูกค้าใหม่',()=>$('#topActions .btn').click())
  }));
}

/* แก้ไข / ลบ บันทึกการดำเนินการที่บันทึกไปแล้ว */
function timelineEdit(c,t,after){
  openForm('แก้ไขบันทึก',[
    {key:'title',label:'ทำอะไรไป',req:true,full:true},
    {key:'date',label:'วันที่',type:'date'},
    {key:'by',label:'ผู้บันทึก'},
    {key:'note',label:'หมายเหตุ',type:'textarea',full:true},
    {key:'status',label:'อัปเดตสถานะลูกค้าเป็น',type:'combo',options:custStatuses,full:true,
     hint:'สถานะปัจจุบันของลูกค้ารายนี้ · เลือกจากรายการ หรือพิมพ์สถานะใหม่ได้เลย'}
  ],Object.assign({},t,{status:c.status}),d=>{
    const st=String(d.status||'').trim();delete d.status;
    const changed=!!st&&st!==c.status;
    Object.assign(t,d);
    if(changed)c.status=st;
    save();render();toast(changed?'แก้ไขบันทึก และเปลี่ยนสถานะเป็น "'+st+'" แล้ว':'แก้ไขบันทึกแล้ว');
    if(after)after();},
  {okLabel:'บันทึกการแก้ไข',extra:{label:'ลบบันทึกนี้',cls:'gh dg',fn:()=>{
    const i=c.timeline.indexOf(t);if(i<0)return;
    const g=c.timeline.splice(i,1)[0];save();render();
    toast('ลบบันทึกแล้ว',()=>{c.timeline.splice(i,0,g);save();render();});
    if(after)after();}}});
}
/* แถวบันทึกหนึ่งรายการ พร้อมปุ่มแก้ไข */
function timelineRow(c,t,last,after,big){
  const r=el(`<div class="tl"><div class="dot"><i></i>${last?'':'<s></s>'}</div>
    <div style="padding-bottom:${big?'15px':'14px'};flex:1;min-width:0">
      <div style="display:flex;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0"><div style="font-size:${big?'14.5px':'14px'};font-weight:600">${esc(t.title)}</div>
        <div class="tiny">${fmtDate(t.date)}${t.by?' · '+esc(t.by):''}${t.note?' · '+esc(t.note):''}</div></div>
      </div></div></div>`);
  /* ปุ่มแก้ไขขึ้นเสมอ ถ้าอยู่ในโหมดดูข้อมูลของคนอื่นจะบอกเหตุผลตอนกด */
  const b=el(`<button class="btn gh sm" style="flex-shrink:0;padding:4px 10px">${svg('edit','ic s')}แก้ไข</button>`);
  b.onclick=e=>{e.stopPropagation();
    if(readOnly()){toast('กำลังดูข้อมูลของ '+(AUTH.viewingName||'เพื่อนร่วมทีม')+' — แก้ไขไม่ได้ กดเมนูผู้ใช้แล้วเลือก "กลับไปข้อมูลของฉัน" ก่อน');return;}
    timelineEdit(c,t,after);};
  r.querySelector('div[style*="display:flex"]').append(b);
  return r;
}
function openCustomer(c){
  const tl=el('<div></div>');
  tl.append(el('<div style="font-size:14px;font-weight:700;margin-bottom:10px">ดำเนินการถึงไหนแล้ว</div>'));
  c.timeline.forEach((t,i)=>tl.append(
    timelineRow(c,t,i===c.timeline.length-1,()=>openCustomer(c),false)));
  tl.append(el(`<div class="tl pend"><div class="dot"><i></i></div><div><div style="font-size:14px;font-weight:600;color:var(--mut2)">ขั้นถัดไป: ${esc(c.status)}</div></div></div>`));
  const addBtn=el(`<button class="btn gh blk">${svg('plus','ic s')}บันทึกการดำเนินการ</button>`);
  addBtn.onclick=()=>openForm('บันทึกการดำเนินการ — '+c.name,[
    {key:'title',label:'ทำอะไรไป',req:true,full:true,ph:'เช่น โทรติดตามใบเสนอราคา'},
    {key:'date',label:'วันที่',type:'date',def:today()},{key:'by',label:'ผู้บันทึก',def:meName()},
    {key:'note',label:'หมายเหตุ',type:'textarea',full:true},
    {key:'status',label:'อัปเดตสถานะเป็น',type:'combo',options:custStatuses,def:c.status,full:true,hint:'เลือกจากรายการ หรือพิมพ์สถานะใหม่ได้เลย'}
  ],{},d=>{c.timeline.push({date:d.date,title:d.title,note:d.note,by:d.by});c.status=d.status;save();render();toast('บันทึกแล้ว');openCustomer(c);});
  tl.append(addBtn);

  const docs=DB.docs.filter(d=>d.customer===c.name),pos=DB.pos.filter(p=>p.customer===c.name);
  drawer({id:c.id,kicker:'ลูกค้า',title:c.name,badge:pill(c.status,CUST_ST),
    blocks:[
      rows([['ผู้ติดต่อ',esc(c.contact||'-')],['เบอร์โทร',esc(c.phone||'-')],['อีเมล',esc(c.email||'-')],
            ['ช่องทาง',esc(c.channel)],['ผู้ดูแล',esc(c.owner||'-')],['วันที่ติดต่อ',fmtDate(c.date)],
            ['เอกสาร',docs.length+' ฉบับ'],['PO',pos.length+' ใบ']]),
      tl],
    actions:[
      [svg('profile','ic s')+'เปิดข้อมูลเต็ม','gh',()=>go('profiles',{profSel:c.id,profTab:'info'})],
      [svg('edit','ic s')+'แก้ไข','gh',()=>openForm('แก้ไขข้อมูลลูกค้า',customerFields(),c,d=>{Object.assign(c,d);save();render();toast('บันทึกแล้ว');openCustomer(c);})],
      [svg('trash','ic s'),'dg',()=>askConfirm('ลบลูกค้า','ลบ "'+c.name+'" ออกจากระบบ?','ลบ',()=>{
        const i=DB.customers.indexOf(c);DB.customers.splice(i,1);save();closeDrawer();render();
        toast('ลบลูกค้าแล้ว',()=>{DB.customers.splice(i,0,c);save();render();});})]]});
}

    {key:'customer',label:'ลูกค้า',type:'select',options:DB.customers.map(c=>c.name),req:true,

    {key:'contact',label:'ผู้ติดต่อ',def:'ฝ่ายจัดซื้อ'},
    {group:'ข้อมูลเอกสาร'},
    {key:'no',label:'เลขที่ใบเสนอราคา',req:true,def:nextNo('QUO')},
    {key:'date',label:'วันที่ออกเอกสาร',type:'date',def:today()},
    {key:'payment',label:'เงื่อนไขการชำระเงิน',type:'select',options:['เงินสด','เครดิต 30 วัน','เครดิต 45 วัน','เครดิต 60 วัน'],def:'เงินสด'},
    {key:'validDays',label:'ยืนราคา (วัน)',type:'number',def:7,hint:'ระบบคำนวณวันหมดอายุให้อัตโนมัติ'},
    {key:'salesperson',label:'พนักงานขาย'},
    {key:'status',label:'สถานะ',type:'select',options:Object.keys(DOC_ST),def:'ร่าง'},
    {group:'รายการสินค้า',sub:'จำนวนเงินคำนวณให้อัตโนมัติ'},
    {key:'items',type:'items'},

/* การ์ดลายเซ็น ใช้ร่วมกันทุกเอกสาร */

function sigRemoveBtn(d,k,label,s){
  const rm=el('<button class="btn gh sm" style="color:#b91c1c;border-color:#fbcaca">ลบลายเซ็น</button>');
  rm.onclick=()=>askConfirm('ลบลายเซ็น — '+label,
    'ลบลายเซ็นของ "'+(s.name||label)+'" ออก เพื่อส่งลิงก์ให้เซ็นใหม่?\n\n'
    +'ลายเซ็นเดิมจะหายถาวร แต่ลิงก์เดิมยังใช้ได้ ไม่ต้องสร้างใหม่',
    'ลบและขอเซ็นใหม่',async()=>{
      const keep=d.sigs[k];
      delete d.sigs[k];
      if(d.status==='อนุมัติแล้ว'||d.status==='ยกเลิก')d.status='รออนุมัติ';
      save(true);render();
      if(!d.sigDocId||!sbOn()){toast('ลบลายเซ็นแล้ว');return;}
      try{
        const res=await sbRpc('remove_doc_signature',{p_id:d.sigDocId,p_role:k});
        if(res)applyCreditSigs(d.no,res.sigs,res.status,true,d.type);
        save(true);render();
        toast('ลบลายเซ็นแล้ว — ส่งลิงก์ให้ '+label+' เซ็นใหม่ได้เลย');
      }catch(e){
        d.sigs[k]=keep;save(true);render();      /* ลบบนคลาวด์ไม่สำเร็จ คืนค่าเดิม */
        toast(/could not find|schema cache|does not exist|ยังไม่ได้ติดตั้ง/i.test(e.message)
          ? 'ยังไม่ได้ติดตั้งส่วนนี้ — ให้ผู้ดูแลรันไฟล์ supabase-setup-10.sql ก่อน'
          : e.message);
      }
    });
  return rm;
}
function signCard(d,onSigned){
  /* เอกสารของตัวเอง ถ้าช่องฝ่ายขายยังว่างและมีลายเซ็นประจำตัวอยู่ ให้เซ็นให้เลย */
  if(autoSignSales(d)){save();if(onSigned)onSigned();}
  const roles=rolesOf(d.type),n=Object.keys(d.sigs||{}).length;
  const sg=el(`<div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px">
    <div class="h3" style="margin:0">ลายเซ็นอนุมัติ</div>
    <span class="pill" style="background:${n===roles.length?'#dcfce7':'#fef3c7'};color:${n===roles.length?'#15803d':'#b45309'}">${n}/${roles.length} ลายเซ็น</span></div></div>`);
  roles.forEach(([k,label],i)=>{
    const s=(d.sigs||{})[k],done=!!(s&&s.img);
    const row=el(`<div style="display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--bd2)">
      <div style="width:26px;height:26px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
        font-size:12px;font-weight:700;background:${done?'#dcfce7':'#eef2f8'};color:${done?'#15803d':'#94a3b8'}">${done?'✓':i+1}</div>
      <div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">${esc(label)}</div>
      <div class="tiny">${done?esc(s.name||'')+' · '+fmtDate(s.date):'ยังไม่ได้เซ็น'}</div>
      ${done?`<img src="${imgSrc(s.img)}" style="max-height:40px;margin-top:7px;display:block">`:''}</div></div>`);
    if(done&&!readOnly())row.append(sigRemoveBtn(d,k,label,s));
    if(!done){
      const b=el('<button class="btn gh sm">เซ็นที่เครื่องนี้</button>');
      b.onclick=()=>signModal('เซ็น — '+label,d.no,
        k==='sales'?((mySig()&&mySig().name)||(AUTH.profile&&AUTH.profile.name)||''):'',s2=>{
        d.sigs=d.sigs||{};d.sigs[k]=s2;
        if(k==='sales')saveMySig(s2);        /* จำลายเซ็นฝ่ายขายไว้ใช้ครั้งต่อไป */
        if(onSigned)onSigned();
        save();render();toast('บันทึกลายเซ็น '+label+' แล้ว');
        pushLocalSig(d,k,s2);});
      row.append(b);}
    sg.append(row);});
  const send=el(`<button class="btn blk" style="margin-top:14px">${svg('doc','ic s')}ส่งลิงก์ให้เซ็น ${roles.length} ท่าน</button>`);
  send.onclick=()=>shareCredit(d);
  sg.append(send);
  if(d.sigDocId){
    const rf=el('<button class="btn gh blk" style="margin-top:9px">ตรวจสอบลายเซ็นล่าสุด</button>');
    rf.onclick=()=>checkCredit(d);sg.append(rf);
    if(n<roles.length&&sbReady!==false){clearInterval(pollTimer);
      pollTimer=setInterval(()=>{if(!document.body.contains(sg)){clearInterval(pollTimer);return;}checkCredit(d,true);},15000);}
  }
  sg.append(el(`<div class="tiny" style="margin-top:10px">${sbReady===true?'🟢 พร้อมส่งลิงก์ให้เซ็นข้ามเครื่อง'
    :sbReady===false?'🟠 '+esc(sbError):'⏳ กำลังตรวจสอบการเชื่อมต่อ…'}</div>`));
  return sg;
}

function openDoc(d){
  const isQuote=d.type==='quotation';
  const hasRc=isQuote&&quoteHasReceipt(d);
  const hasPo=isQuote&&DB.pos.some(p=>p.status!=='ยกเลิก'&&p.quoteRef===d.no);
  const blocks=[rows([['ลูกค้า',esc(d.customer)],['วันที่',fmtDate(d.date)],['ยอดรวม',num(d.amount)+' บาท'],
      d.note?['รายละเอียด',esc(d.note)]:null,
      isQuote?['สถานะยอดขาย',hasRc?'<span style="color:#15803d">ออกใบเสร็จแล้ว — นับเป็นยอดขาย</span>'
        :hasPo?'<span style="color:#4338ca">มี PO แล้ว รอออกใบเสร็จ</span>'
        :d.status==='อนุมัติแล้ว'?'<span style="color:#b45309">ยังไม่มี PO และยังไม่ออกใบเสร็จ</span>'
        :'<span style="color:#94a3b8">ยังไม่อนุมัติ</span>']:null])];
  if(isQuote&&!hasRc){
    const b=el(`<button class="btn blk">${svg('receipt','ic s')}ออกใบเสร็จจากใบเสนอราคานี้</button>`);
    b.onclick=()=>issueReceipt({customer:d.customer,amount:d.amount,poRef:d.no});
    const w=el('<div></div>');
    w.append(b);
    w.append(el(`<div class="tiny" style="margin-top:8px">${hasPo?'ใบเสนอราคานี้มี PO แล้ว — ออกใบเสร็จอ้างอิง PO ก็ได้เช่นกัน':'ลูกค้าที่ซื้อโดยไม่มี PO ให้ออกใบเสร็จจากตรงนี้ ยอดจะเข้าแดชบอร์ดทันที'}</div>`));
    blocks.push(w);
  }
  drawer({id:d.id,kicker:docTypeName(d.type),title:d.no,badge:pill(d.status,DOC_ST),
    blocks,
    actions:[
      [svg('edit','ic s')+'แก้ไข','gh',()=>openForm('แก้ไข '+d.no,docFields(d.type),d,o=>{Object.assign(d,o);save();render();toast('บันทึกแล้ว');openDoc(d);})],
      [svg('print','ic s')+'พิมพ์','gh',()=>doPrint()],
      [svg('trash','ic s'),'dg',()=>askConfirm('ลบเอกสาร','ลบ '+d.no+'?','ลบ',()=>{
        const i=DB.docs.indexOf(d);DB.docs.splice(i,1);save();closeDrawer();render();
        toast('ลบเอกสารแล้ว',()=>{DB.docs.splice(i,0,d);save();render();});})]]});
}

/* ---------- 4. PO ---------- */
/* เลขที่ PO ภายใน — ไม่ให้ซ้ำกับที่มีอยู่ */
/* พิมพ์ชื่อลูกค้าใหม่ในเอกสารได้เลย ระบบเพิ่มเข้าทะเบียนลูกค้าให้อัตโนมัติ */
function ensureCustomer(name){
  const n=String(name||'').trim();
  if(!n||readOnly())return null;
  const found=DB.customers.find(c=>c.name===n);
  if(found)return found;
  const c={id:uid(),name:n,status:'ปิดการขาย',channel:'จาก PO',date:today(),
    contact:'',contactPos:'',phone:'',email:'',address:'',shipTo:'',taxId:'',biz:'',website:'',
    creditTerm:'30 วัน',creditLimit:0,owner:meName(),note:'',logo:null,photos:[],files:[],
    timeline:[{date:today(),title:'เพิ่มอัตโนมัติจากการสร้าง PO',note:'',by:meName()}]};
  DB.customers.unshift(c);
  toast('เพิ่ม "'+n+'" เข้าทะเบียนลูกค้าให้แล้ว');
  return c;
}
/* กำหนดส่งมอบของ PO = วันที่เร็วที่สุดในรายการสินค้า */
function poDue(p){
  const ds=(p.items||[]).map(i=>i.due).filter(Boolean).sort();
  return ds[0]||p.dueDate||"";
}
function nextPoNo(){
  const yr=new Date().getFullYear()+543;
  let n=DB.pos.length+90,no;
  do{no='PO-'+yr+'-'+String(n++).padStart(4,'0');}while(DB.pos.some(p=>p.no===no));
  return no;
}
function poFields(){return [
  {group:'ข้อมูล PO'},

  {key:'items',type:'items',due:true}];}
function pgPO(v){
  if(S.poOpen){const p=DB.pos.find(x=>x.id===S.poOpen);if(p)return poDetail(v,p);S.poOpen=null;}
  header('PO ลูกค้า',['งานขาย']);
  actionBtn('เพิ่ม PO','plus',()=>openForm('เพิ่ม PO ลูกค้า',
    poFields().concat([{group:'รูป PO ที่ลูกค้าส่งมา',sub:'ถ่ายรูปหรือแนบไฟล์ PO ของลูกค้าได้เลย จะเพิ่มทีหลังก็ได้'},
      {key:'attach',type:'uploads',autofill:'po',label:'แนบรูป / ไฟล์ PO จากลูกค้า',
       hint:'JPG, PNG, PDF · ถ้าเป็น PDF ที่เป็นข้อความ ระบบจะอ่านแล้วกรอกให้อัตโนมัติ'}]),
    {},d=>{
      const at=d.attach||{};delete d.attach;
      /* เลขที่ภายในสร้างให้อัตโนมัติ ใช้อ้างอิงกับใบเสร็จ ผู้ใช้ไม่ต้องกรอก */
      const p=Object.assign({id:uid(),no:nextPoNo(),items:[],
        images:at.images||[],files:at.files||[]},d);
      if(!p.no)p.no=nextPoNo();
      ensureCustomer(p.customer);   /* ลูกค้าใหม่ที่พิมพ์เอง เพิ่มเข้าระบบให้เลย */
      DB.pos.unshift(p);save(true);go('po',{poOpen:p.id});
      toast('สร้าง PO แล้ว'+((at.images||[]).length+(at.files||[]).length?' พร้อมไฟล์แนบ':''));},
    {wide:true,okLabel:'สร้าง PO'}));

  v.append(hint('แนบรูป PO ของลูกค้าได้ตั้งแต่ตอนกด "เพิ่ม PO" หรือคลิกที่ PO ในรายการเพื่อเข้าไปแนบเพิ่มทีหลัง'));

  v.append(bar);

  let clear=null;
  if(S.poFilter!=='ทั้งหมด'||S.poQ){clear=el('<button class="chip clear">ล้างตัวกรอง ✕</button>');
    clear.onclick=()=>{S.poFilter='ทั้งหมด';S.poQ='';render();};}
  v.append(chipRow([['ทั้งหมด','ทั้งหมด ('+DB.pos.length+')'],
    ...Object.keys(PO_ST).map(k=>[k,k+' ('+DB.pos.filter(p=>p.status===k).length+')'])],S.poFilter,k=>{S.poFilter=k;render();},clear));

  const q=S.poQ.toLowerCase();
  const items=DB.pos.filter(p=>(S.poFilter==='ทั้งหมด'||p.status===S.poFilter)&&
    (!q||[p.no,p.custPoNo,p.customer].join(' ').toLowerCase().includes(q)));
  v.append(el(`<div class="tiny">พบ ${items.length} รายการ · ยอดรวม ${num0(items.reduce((a,b)=>a+poTotal(b),0))} ฿</div>`));
  v.append(listCard(items,{
    avatar:()=>svg('cart','ic s'),
    title:p=>esc(p.custPoNo||p.no),
    meta:p=>esc(p.customer)+' · '+esc(p.no)+' · รับ '+fmtDate(p.date)+' · ส่ง '+fmtDate(poDue(p))+
      ((p.images.length+p.files.length)?' · 📎 '+(p.images.length+p.files.length):''),
    amount:p=>num0(poTotal(p))+' ฿',
    status:p=>pill(p.status,PO_ST),
    onOpen:p=>go('po',{poOpen:p.id}),
    empty:emptyState('ยังไม่มี PO','เพิ่ม PO ใบแรกเพื่อเริ่มบันทึกคำสั่งซื้อ','เพิ่ม PO',()=>$('#topActions .btn').click())
  }));
}

      ${msg?`<div class="hint" style="margin-bottom:16px">${esc(msg)}</div>`:''}
      <div id="lgErr" style="display:none;background:#fef2f2;border:1px solid #fbcaca;color:#b91c1c;
        border-radius:10px;padding:11px 13px;font-size:13.5px;margin-bottom:14px"></div>
      <div class="field" style="margin-bottom:14px"><label>เบอร์โทรศัพท์</label>
        <input id="lgEmail" autocomplete="username" inputmode="tel" placeholder="เช่น 081-234-5678" autocapitalize="off" spellcheck="false">
        <div class="fh">เบอร์ที่ผู้ดูแลลงทะเบียนไว้ให้</div></div>
      <div class="field" id="lgPinWrap" style="margin-bottom:14px"><label>PIN 6 หลัก (ตัวเลขเท่านั้น)</label>
        <input id="lgPass" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6"
          autocomplete="current-password" placeholder="••••••"
          style="letter-spacing:8px;font-size:20px;text-align:center">
        <div class="fh" id="lgPinHint">เข้าครั้งแรก: ตั้ง PIN ตัวเลข 6 หลักที่ต้องการได้เลย ระบบจะจำไว้</div></div>
      <div class="field" id="lgNameWrap" style="margin-bottom:14px;display:none"><label>ชื่อ-นามสกุล (แสดงในระบบ)</label>
        <input id="lgName" placeholder="เช่น คุณวราลักษณ์ บุตะกุล"></div>
      <button class="btn blk" id="lgGo" style="height:48px;margin-top:4px">เข้าสู่ระบบ</button>
      <div style="text-align:center;margin-top:16px;font-size:13.5px;color:var(--mut);display:none" id="lgSwitchWrap">
        <span id="lgSwitchTxt">ยังไม่มีบัญชี?</span>
        <a href="#" id="lgSwitch" style="font-weight:600">สมัครใช้งาน</a></div>
      <div class="tiny" style="text-align:center;margin-top:18px">ยังไม่มีบัญชี? ติดต่อผู้ดูแลระบบให้สร้างให้<br>
        ข้อมูลของแต่ละคนแยกกัน เข้าจากเครื่องไหนก็เห็นงานของตัวเอง</div>
    </div></div>`);
  document.body.append(w);
  let mode='in';
  const err=t=>{const e=w.querySelector('#lgErr');e.style.display=t?'block':'none';e.textContent=t||'';};
  /* แสดงลิงก์สมัครเองเฉพาะตอนยังไม่มีใครในระบบ (เผื่อสร้างบัญชีผู้ดูแลคนแรก) */
  (async()=>{try{const c=sbCfg();
    const r=await fetch(c.url.replace(/\/$/,'')+'/auth/v1/settings',{headers:{apikey:c.key}});
    const s=await r.json();
    if(s&&s.disable_signup===false)w.querySelector('#lgSwitchWrap').style.display='block';
  }catch(e){}})();
  w.querySelector('#lgSwitch').onclick=e=>{e.preventDefault();
    mode=mode==='in'?'up':'in';err('');
    w.querySelector('#lgNameWrap').style.display=mode==='up'?'flex':'none';
    w.querySelector('#lgGo').textContent=mode==='up'?'สมัครใช้งาน':'เข้าสู่ระบบ';
    w.querySelector('#lgSwitchTxt').textContent=mode==='up'?'มีบัญชีแล้ว?':'ยังไม่มีบัญชี?';
    w.querySelector('#lgSwitch').textContent=mode==='up'?'เข้าสู่ระบบ':'สมัครใช้งาน';};
  /* พิมพ์ชื่อผู้ดูแล -> ซ่อนช่อง PIN ให้เข้าได้เลย */
  const uEl=w.querySelector('#lgEmail');
  const syncMode=()=>{
    const adm=isAdminUser(uEl.value);
    w.querySelector('#lgPinWrap').style.display='flex';   /* ผู้ดูแลก็ต้องใส่ PIN */
    w.querySelector('#lgGo').textContent=adm?'เข้าสู่ระบบผู้ดูแล':'เข้าสู่ระบบ';
  };
  uEl.addEventListener('input',syncMode);

  /* ช่อง PIN รับเฉพาะตัวเลข พิมพ์ตัวอักษรไม่ติด วางข้อความมาก็กรองให้ */
  const pinEl=w.querySelector('#lgPass');
  pinEl.addEventListener('keypress',e=>{if(!/^\d$/.test(e.key))e.preventDefault();});
  pinEl.addEventListener('input',()=>{
    const v=pinEl.value.replace(/\D/g,'').slice(0,6);
    if(v!==pinEl.value)pinEl.value=v;
  });

  const go=async()=>{
    const b=w.querySelector('#lgGo');
    const user=uEl.value.trim();
    const pass=w.querySelector('#lgPass').value;
    const adm=isAdminUser(user);
    if(!user){err('กรุณากรอกเบอร์โทรศัพท์');return;}
    if(!adm&&!isPhone(user)){err('เบอร์โทรไม่ถูกต้อง เช่น 081-234-5678');return;}
    if(!/^\d{6}$/.test(pass)){err('PIN ต้องเป็นตัวเลข 6 หลัก');return;}
    b.disabled=true;b.textContent='กำลังเข้าระบบ…';err('');
    try{
      if(adm){
        try{await signIn(ADMIN_USER,pass);}
        catch(e1){throw new Error('PIN ผู้ดูแลไม่ถูกต้อง');}
      }else{
        try{
          await signIn(user,pass);                       // มี PIN อยู่แล้ว
        }catch(e1){
          if(!/ไม่ถูกต้อง/.test(e1.message))throw e1;
          /* ยังไม่เคยตั้ง PIN -> ตั้งครั้งแรก (ฐานข้อมูลจะเช็คทะเบียนพนักงานให้) */
          let ok;
          try{ok=await signUp(user,pass);}
          catch(e2){
            /* สมัครไม่ได้เพราะมีบัญชีอยู่แล้ว = ตั้ง PIN ไปแล้ว แปลว่า PIN ที่ใส่ผิด */
            if(/มีคนใช้แล้ว|already/i.test(e2.message))
              throw new Error('PIN ไม่ถูกต้อง — เบอร์นี้ตั้ง PIN ไว้แล้ว ถ้าลืม PIN ให้ติดต่อผู้ดูแลระบบ');
            throw e2;
          }
          if(!ok){b.disabled=false;syncMode();
            err('ตั้ง PIN แล้วแต่ระบบยังบังคับยืนยันอีเมล — ให้ผู้ดูแลปิด "Confirm email" ใน Supabase');return;}
        }
      }
      w.remove();document.querySelector('.app').style.display='';
      await startApp();
    }catch(e){b.disabled=false;syncMode();err(e.message);}
  };
  w.querySelector('#lgGo').onclick=go;
  setTimeout(syncMode,10);
  w.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  setTimeout(()=>w.querySelector('#lgEmail').focus(),80);
}

async function sbFn(body){
  const c=sbCfg();
  const r=await fetch(c.url.replace(/\/$/,'')+'/functions/v1/manage-users',{method:'POST',
    headers:{apikey:c.key,Authorization:'Bearer '+AUTH.token,'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    if(r.status===404)throw new Error('ยังไม่ได้ติดตั้งฟังก์ชัน manage-users ใน Supabase → Edge Functions');
    throw new Error(j.error||('ทำรายการไม่สำเร็จ ('+r.status+')'));
  }
  return j;
}

let EMP_NAMES=null;
async function empNames(){
  if(EMP_NAMES)return EMP_NAMES;
  const map={};
  try{(await sbRpc('employee_list',{})||[]).forEach(e=>{
    if(e.phone&&e.name)map[normPhone(e.phone)]=e.name;});}catch(e){}
  EMP_NAMES=map;return map;
}
/* ชื่อที่จะโชว์: ชื่อในโปรไฟล์ → ชื่อในทะเบียนพนักงาน → เบอร์ */
function personName(t,map){
  const login=toUsername(t.email||'');
  const nm=String(t.name||'').trim();
  if(nm&&nm!==login&&nm!==normPhone(login))return nm;
  return (map&&map[normPhone(login)])||nm||login;
}

/* ================= boot ================= */
function migrate(){
  if(!DB.company)DB.company=Object.assign({},COMPANY);
  if(!DB.products)DB.products=[];
  /* อัปเดตรหัสแบบฟอร์มใบเสนอราคาให้เป็นรุ่นล่าสุด (ถ้ายังเป็นรุ่นเก่าที่ระบบตั้งไว้) */
  if(DB.company&&/^FQP-MKT-01:01 Rev\.0[12]$/.test(DB.company.docCode||''))
    DB.company.docCode=COMPANY.docCode;
  (DB.receipts||[]).forEach(r=>{if(!r.photos)r.photos=[];if(!r.files)r.files=[];});
  (DB.pos||[]).forEach(p=>{if(!p.items)p.items=[];if(!p.images)p.images=[];if(!p.files)p.files=[];
    p.items.forEach(it=>{if(!it.id)it.id=uid();});});
  if(DB.cert===undefined)DB.cert=null;
  /* เอาบรรทัด "ราคาดังกล่าวยังไม่ภาษีมูลค่าเพิ่ม 7%" ออกจากใบเสนอราคาเดิม (ทำครั้งเดียว) */
  if(!DB.notesFix){
    (DB.docs||[]).forEach(d=>{
      if(d.type==='quotation'&&typeof d.notes==='string')
        d.notes=d.notes.split('\n').filter(l=>!/ราคาดังกล่าวยังไม่ภาษีมูลค่าเพิ่ม/.test(l)).join('\n');});
    DB.notesFix=1;
  }
  (DB.docs||[]).filter(d=>d.type==='quotation').forEach(d=>{
    ensureQuote(d);
    if(!d.items.length&&d.amount)d.items=[{name:'สินค้าตามรายละเอียดที่เสนอ',qty:1,unit:'รายการ',price:d.amount}];
  });
}

async function startApp(){
  try{await loadProfile();}catch(e){}
  const local=load();
  /* แสดงข้อมูลในเครื่องก่อนเลย ไม่ต้องรอคลาวด์ — เปิดเว็บแล้วใช้งานได้ทันที
     แล้วค่อยสลับเป็นข้อมูลจากคลาวด์ให้ทีหลังถ้าใหม่กว่าและยังไม่ได้แก้อะไร */
  let quick=false;
  if(local&&local.customers){
    DB=local;migrate();loadView();booted=true;paintUser();render();
    quick=true;dirtySince=0;
  }
  let row=null,cloud=null,failed=false;
  try{row=await cloudRow(AUTH.user.id);cloud=row&&row.data;}catch(e){failed=true;}
  if(quick&&!failed&&cloud&&cloud.customers){
    const lT=(+local._t)||0,cT=row.updated_at?Date.parse(row.updated_at):0;
    if(cT>lT+2000&&!dirtySince){       /* คลาวด์ใหม่กว่า และยังไม่ได้แก้อะไรในหน้านี้ */
      DB=cloud;migrate();render();
    }else if(lT>cT+2000){
      save(true);toast('พบงานที่ยังไม่ได้ขึ้นคลาวด์ในเครื่องนี้ — อัปโหลดให้แล้ว');
    }
    productsPull().then(ok=>{if(ok)render();});
    sbPing();setTimeout(autoTidy,2500);return;
  }
  if(quick&&failed){setSync('offline');
    toast('เชื่อมคลาวด์ไม่ได้ — ใช้ข้อมูลในเครื่องไปก่อน แล้วจะบันทึกให้เมื่อกลับมาออนไลน์');
    productsPull().then(ok=>{if(ok)render();});sbPing();return;}
  /* ถ้าข้อมูลในเครื่องใหม่กว่าบนคลาวด์ (เช่นปิดเว็บก่อนอัปโหลดเสร็จ) ให้ใช้ของในเครื่อง
     แล้วอัปขึ้นคลาวด์ให้ ไม่งั้นงานที่เพิ่งบันทึกจะหายตอนรีเฟรช */
  const localT=(local&&+local._t)||0;
  const cloudT=(row&&row.updated_at)?Date.parse(row.updated_at):0;
  const localNewer=!!(local&&local.customers&&localT&&localT>cloudT+2000);
  let restored=false;
  if(cloud&&cloud.customers&&!localNewer)DB=cloud;
  else if(local&&local.customers){DB=local;restored=!!(cloud&&localNewer);}
  else DB=seed();
  migrate();
  loadView();booted=true;
  paintUser();render();
  if(failed){setSync('offline');toast('เชื่อมคลาวด์ไม่ได้ — ใช้ข้อมูลในเครื่องไปก่อน แล้วจะบันทึกให้เมื่อกลับมาออนไลน์');}
  else if(!cloud){save(true);}   /* ผู้ใช้ใหม่: อัปข้อมูลเริ่มต้นขึ้นคลาวด์ */
  else if(restored){save(true);toast('พบงานที่ยังไม่ได้ขึ้นคลาวด์ในเครื่องนี้ — อัปโหลดให้แล้ว');}
  /* ดึงคลังรหัสสินค้ากลาง — ใช้ร่วมกันทุกคน ไม่ขึ้นกับข้อมูลส่วนตัว */
  productsPull().then(ok=>{if(ok)render();});
  sbPing();
  setTimeout(autoTidy,2500);   /* จัดเก็บรูปให้เองเบื้องหลัง */
}
async function boot(){
  /* ลิงก์เซ็นเอกสาร: เปิดได้เลยไม่ต้องล็อกอิน */
  if(/^#(s=|a=|approve=|signed=)/.test(location.hash||'')){
    DB=load()||seed();migrate();booted=true;
    document.querySelector('.app').style.display='none';
    await handleHash();
    if(!document.querySelector('.prevov,.ov')){document.querySelector('.app').style.display='';render();}
    return;
  }
  try{const s=JSON.parse(localStorage.getItem(AKEY)||'null');
    if(s&&s.token){Object.assign(AUTH,s);}}catch(e){}
  if(!sbOn()){DB=load()||seed();migrate();booted=true;render();
    toast('ยังไม่ได้ตั้งค่าฐานข้อมูล — ใช้งานแบบเก็บในเครื่อง');return;}
  if(authed()){
    try{await sbGet('profiles?select=id&limit=1');}
    catch(e){if(!await refreshSession()){clearSession();loginScreen('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');return;}}
    await startApp();
  }else loginScreen();
}
window.addEventListener('hashchange',handleHash);
boot();

</script>
